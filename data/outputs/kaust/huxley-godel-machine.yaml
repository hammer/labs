description: >
  <p>A self-improving coding agent from
  <a href="/people/jurgen-schmidhuber">Jürgen Schmidhuber</a>'s lab that
  approximates the optimal Gödel machine via <strong>clade-metaproductivity
  (CMP)</strong> search &mdash; scoring self-modifications by the downstream
  productivity of their descendant lineage rather than immediate benchmark
  gains. The result reaches human-engineered-agent-level performance on
  SWE-bench.</p>

  <p>The 401&#9733; <code>metauto-ai/HGM</code> release drew clean-room
  reimplementations and press coverage. It is distinct from the separately
  tracked Darwin Gödel Machine (Sakana AI / UBC), which pursues a related but
  independent self-improvement line.</p>
