description: >
  <p>Goldfish (with its MiniGPT4-video component) introduces a retrieval-based
  approach to understanding arbitrarily long videos: rather than feeding an
  entire clip to the model, it retrieves the most relevant segments per query,
  avoiding context-length blowup. The 636&#9733; release, presented at
  <strong>ECCV 2024</strong>, is the origin of the
  <a href="/people/mohamed-elhoseiny">Mohamed Elhoseiny</a> / Vision-CAIR
  long-video line that culminates in <a href="/outputs/kaust/tempo-6b">Tempo</a>.</p>

  <p>Built on the <a href="/outputs/kaust/minigpt-4">MiniGPT-4</a> lineage and
  a pretrained LLM backbone rather than trained from scratch, so its scale is
  inherited from those bases.</p>
