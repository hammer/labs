description: >
  <p>MiniGPT-4 aligns a frozen BLIP-2 visual encoder with a frozen large
  language model (Vicuna) through a single projection layer, unlocking
  GPT-4-like visual conversation from a lightweight training recipe. Presented
  at <strong>ICLR 2024</strong>, it became the 25.7K&#9733; ancestor of the
  entire <a href="/people/mohamed-elhoseiny">Mohamed Elhoseiny</a> /
  Vision-CAIR line &mdash; <a href="/outputs/kaust/goldfish">MiniGPT4-video /
  Goldfish</a>, <a href="/outputs/kaust/minigpt-med">MiniGPT-Med</a>, and
  <a href="/outputs/kaust/tempo-6b">Tempo</a>.</p>

  <p>Because it is built on Vicuna plus BLIP-2 rather than pretrained from
  scratch, its scale is inherited from those bases; the contribution is the
  alignment recipe and demonstration that a single trainable projection can
  bridge vision and language for open-ended dialogue.</p>
