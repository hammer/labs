description: >
  <p>NeurIPS 2025 <strong>Best Paper</strong> (Eysenbach's group, with
  Warsaw University of Technology): scaling network <em>depth</em> to
  ~1000 layers in contrastive self-supervised RL unlocks qualitatively
  new goal-reaching, with 2&ndash;50&times; performance gains &mdash; a
  depth-scaling result for RL analogous to width/data scaling for LLMs.</p>
