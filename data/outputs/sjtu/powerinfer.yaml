description: >
  <p>IPADS's activation-sparsity LLM serving engine (9.6K&#9733;):
  hot neurons stay on the GPU, cold ones compute on the CPU, making
  consumer-GPU inference practical (SOSP '24). <strong>PowerInfer-2</strong>
  (June 2024) extends the design to smartphones with
  neuron-cluster-granularity heterogeneous compute. The team spun out as
  Tiiny-AI (tiiny.ai), where the repo now lives.</p>
