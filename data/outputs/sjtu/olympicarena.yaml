description: >
  <p>Multi-discipline olympiad-level benchmark for "superintelligent AI"
  cognitive reasoning (NeurIPS 2024 Datasets &amp; Benchmarks):
  11,163 bilingual problems drawn from 62 international olympic
  competitions across math, physics, chemistry, biology, geography,
  astronomy, and CS, with process-level as well as answer-level
  evaluation. From <a href="/people/pengfei-liu">Pengfei Liu</a>'s
  pre-SII GAIR lab; picked up in frontier-model eval suites.</p>
