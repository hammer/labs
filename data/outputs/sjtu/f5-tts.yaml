description: >
  <p>Non-autoregressive flow-matching TTS from
  <a href="/people/kai-yu">Kai Yu</a>'s X-LANCE lab (ACL 2025): a
  Diffusion Transformer that "fakes fluent and faithful speech" without
  duration models, text encoders, or phoneme alignment. One of the
  most-adopted open TTS models anywhere &mdash; <strong>~798K monthly
  HuggingFace downloads</strong>, 15K&#9733;, and a large finetune
  ecosystem spanning dozens of languages (e.g. the Arabic Habibi-TTS,
  Jan 2026).</p>
