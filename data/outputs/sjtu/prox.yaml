description: >
  <p>"Programming every example": small LMs emit per-document cleaning
  programs (normalize, strip, keep/drop) instead of hand-crafted rules,
  refining pretraining data at scale (ICML 2025). The
  <strong>&gt;100B-token</strong> refined corpora released on HuggingFace
  were reused by later pretraining efforts &mdash; a pre-SII GAIR
  contribution to the data-refinement toolchain from
  <a href="/people/pengfei-liu">Pengfei Liu</a>'s group.</p>
