description: >
  <p>Qiyuan Tech with Tsinghua, HKU and Peking (the Harness-Bench
  collaboration pattern) answers benchmark saturation and contamination with
  an olympiad-style eval built from <strong>thirteen recent public science
  competitions</strong> &mdash; IPhO and IChO 2025&ndash;26, IBO 2023,
  USAPhO 2026, USNCO 2025 &mdash; whose open-ended multi-step problems carry
  <strong>process-credit rubrics</strong> for step-level scoring, matching
  the reasoning-process-eval criterion the index tracks.</p>

  <p>An expert-audited digitization pipeline converts official exams,
  figures, solutions and rubrics into structured items verified by olympiad
  medalists, and LLM-as-judge scoring is calibrated against medalist ground
  truth.</p>
