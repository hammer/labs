description: >
  <p>TSAIL's plug-and-play quantized attention (INT8 &rarr; FP4 across
  v1/2/3; 3.5K&#9733;), 2&ndash;5&times; faster than FlashAttention and
  the de-facto standard in open video-generation inference (ComfyUI,
  HunyuanVideo, Wan, CogVideoX). The line continues with SpargeAttention
  (ICML 2025) and TurboDiffusion's 100&ndash;200&times; video-diffusion
  acceleration (3.6K&#9733; in 7 months).</p>
