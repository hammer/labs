description: >
  <p>Introduces the <strong>Skaling law</strong>, a neural scaling law that
  corrects a structural weakness in the standard Chinchilla formulation.
  Whereas Chinchilla models parameter count and training data as independent
  additive contributions to loss, Skaling adds one interaction exponent that
  couples the two. This removes the saddle-shaped prediction bias that appears
  when models are severely data-limited or overtrained, reducing interpolation
  and extrapolation mean absolute percentage error by
  <strong>1.5&ndash;3&times;</strong>.</p>

  <p>The FAIR team validated the law on an internal <strong>SK-Grid of 125
  pretraining runs</strong> spanning 14 model sizes (134M&ndash;4.9B parameters)
  and 316M&ndash;316B tokens, as well as Farseer and original Chinchilla data.
  On 112 held-out high-compute Farseer runs, Skaling reached
  <strong>0.60% pooled MAPE</strong>, 3.9&times; lower than Chinchilla. Its
  sparse L-shaped profiling strategy samples only inexpensive edges of the
  model-size/data grid yet reconstructs the full loss surface with comparable
  accuracy using approximately <strong>10&times; less compute</strong>, making
  compute-allocation decisions possible from substantially cheaper pilot
  training runs.</p>
