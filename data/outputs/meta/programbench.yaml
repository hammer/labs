description: >
  <p>A benchmark for building a whole program from scratch.
  <strong>ProgramBench</strong> gives an agent only a compiled program and its
  documentation. The agent has to design and write a codebase, plus a build
  script, whose executable behaves like the reference. The
  <strong>200 tasks</strong> run from small CLI tools (nnn, fzf, gron) to
  <strong>FFmpeg, SQLite and the PHP interpreter</strong>. The median
  reference is 8,635 lines of code, and the largest is 2.7M. Hidden
  end-to-end behavioural tests (median 770 per task) come from agent-driven
  fuzzing of the reference binary. Because the tests check only behaviour,
  agents can use any language and any architecture. Runs flagged for
  cheating, such as looking up the original source, are disqualified. With
  internet access, a panel of nine LM judges flagged 36% of Claude Sonnet
  4.6's runs and 21% of Claude Opus 4.6's. Code is MIT-licensed.</p>

  <p>The headline metric is <strong>% Resolved</strong>: every hidden test
  passes. "Almost resolved" means at least 95% pass. In the paper's mini-SWE-agent
  baseline, with 1,000 steps and 6 hours per run, <strong>none of nine
  models resolved a single task</strong>. Claude Opus 4.7 led the almost-resolved
  column at 3.0%. Models wrote much less code than the originals (median 1,173
  vs 3,068 lines among solutions passing 75% of tests), usually as
  monolithic single files: GPT-5.4 wrote a median 96% of its code in one turn.
  Five months later the public leaderboard (updated 2026-10-22) has moved a
  long way. <strong>Claude Opus 5.5 (xhigh) resolves 18.5% and almost-resolves
  70.5%</strong>, ahead of Claude Fable 5.1 (9.0% / 55.5%) and Muse Wonder Full
  (8.5% / 60.0%). Launch posts have adopted it quickly:
  <a href="/outputs/meta/muse-wonder">Muse Wonder</a>,
  <a href="/outputs/stepfun/step-5-preview">Step 5 Preview</a> (80.5),
  <a href="/outputs/tencent/hy4-preview">Hy4 preview</a> (39.5 vs Opus 5's
  17.5) and <a href="/outputs/deepseek/deepseek-v4.1-flash">DeepSeek V4.1
  Flash</a> (29.1) all report it. Vendors do not always say which metric or
  harness they used, and the leaderboard has three columns (resolved, almost
  resolved, average test pass rate), so vendor numbers cannot be compared
  directly.</p>

  <p>The benchmark comes from the SWE-bench / SWE-agent group, now at Meta.
  Most authors are Meta FAIR (John Yang, Kilian Lieret, Gabriel Synnaeve,
  Ofir Press) or Meta TBD (Pengcheng Yin, Rui Hou). Diyi Yang (Stanford)
  and Jeffrey Ma (Meta FAIR and Harvard) are co-authors. It follows
  <a href="/outputs/princeton/swe-bench">SWE-bench</a> and uses the
  <a href="/outputs/princeton/mini-swe-agent">mini-SWE-agent</a> harness, but
  replaces single-issue repair with whole-program construction.</p>
