description: >
  <p>Meta Superintelligence Labs' successor to
  <a href="/outputs/meta/muse-spark-1.2">Muse Spark 1.2</a>, billed by Mark
  Zuckerberg as delivering "frontier performance at low cost" and by Meta as
  its <strong>largest improvement in coding and agentic work to date</strong>.
  "Trained for agentic workflows and optimized for competitive coding
  performance," it is tuned for long-horizon coding: tracking context and
  prior results, working through messy or conflicting inputs, and asking for
  input when needed &mdash; while using <strong>~20% fewer tool calls and
  ~25% fewer tokens</strong> than 1.2. Meta also cites improved
  instruction-following and constraint preservation, adversarial robustness
  and prompt-injection resistance, and better calibration on irreversible
  actions. Natively multimodal over <strong>video, images, and
  documents</strong>, with visual reasoning run "through a real execution
  environment instead of scripted steps."</p>

  <p>Meta's launch scorecard (against Muse Spark 1.2, GPT-5.6 Sol (max), and
  Opus 5 (max)) leads its comparison group on coding and long context:
  <strong>Terminal-Bench 2.1 88.8</strong> (up from 82.9), <strong>DeepSWE
  v1.1 75.4</strong> (up from 59.3), SWEAtlas CodeBase QnA 59.4, and MRCR
  <strong>98.5 / 98.1</strong> (256K&ndash;512K / 512K&ndash;1M); agentic
  results include GDPval-AA v2 1754 Elo (vs Opus 5's 1824), OSWorld 2.0 66.9,
  DeepSearchQA 89.4, and Agentic IF Index 57.8. Artificial Analysis scored it
  the same day: <strong>AA Intelligence Index 62</strong> in max reasoning
  mode (60 at xhigh) &mdash; Meta's highest score to date, up from 1.2's 57,
  fourth among labs behind Anthropic, OpenAI, and Google.</p>

  <p><strong>Proprietary</strong> (parameters undisclosed), with a
  <strong>1M-token context</strong>, live in <strong>Muse Code</strong> and
  the Meta Model API at launch ($1.25 / $4.25 per 1M input/output tokens,
  feedback-gated Contributor Tier from $0.10 input) plus OpenRouter, and
  rolling out to Meta AI across Instagram and Facebook. Zuckerberg says Meta
  plans to release <strong>open-weights versions</strong> of the Muse line in
  the near future.</p>
