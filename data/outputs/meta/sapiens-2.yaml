description: >
  <p>Transformer-based human-centric vision foundation family from Meta.
  <strong>0.1B&ndash;5B parameters</strong>, native 1K resolution with
  hierarchical 4K-capable variants and windowed attention for extended spatial
  reasoning. Trained on <strong>1 billion curated human images</strong> via
  masked image reconstruction combined with self-distilled contrastive learning;
  4K models pretrain at 2K output resolution.</p>

  <p>Five downstream task heads released open: <strong>pretrain</strong>
  (feature extractor), <strong>pose</strong> (keypoint detection),
  <strong>seg</strong> (body-part segmentation), <strong>normal</strong>
  (surface-normal estimation), and <strong>pointmap</strong>
  (depth/geometry &mdash; albedo discussed in the paper but not in the public
  collection). Reported gains over Sapiens v1: <strong>+4 mAP pose</strong>,
  <strong>+24.3 mIoU body-part segmentation</strong>,
  <strong>&minus;45.6% normal angular error</strong>. ICLR 2026.</p>

  <p>By Khirodkar, Wen, Martinez, Dong, Zhaoen, and Saito (Meta Reality Labs).</p>
