description: >
  <p>"A foundation model of vision, audition, and language for in-silico
  neuroscience." Tri-modal (video + audio + text) <strong>brain-encoding
  foundation model</strong> that predicts high-resolution fMRI responses for
  novel stimuli, tasks, and subjects. Trained on <strong>1,000+ hours of fMRI
  across 720 subjects</strong>; reports several-fold accuracy improvements over
  linear encoding baselines.</p>

  <p>Recovers established findings from classic visual and neuro-linguistic
  experiments and reveals fine-grained topography of multisensory integration
  &mdash; positioning AI as a unifying framework for brain organization. Another
  scientific FM in the same vein as Meta's
  <a href="/outputs/meta/sapiens-2">Sapiens2</a> human-vision family. By
  d'Ascoli, Rapin, Benchetrit, Brooks, Begany, Raugel, Banville, and
  Jean-Rémi King (Meta FAIR).</p>
