description: >
  <p>Meta Superintelligence Labs' agent-first frontier line, launched as two
  proprietary variants on one model card: <strong>Muse Wonder</strong>
  (<code>muse-wonder-1.0</code>, Meta Model API, $4.00 / $20.00 per 1M
  input/output and $0.20 cached input) and <strong>Muse Wonder Full</strong>
  (<code>muse-wonder-full-1.0</code>, subscription-only through
  <a href="/outputs/meta/muse-code">Muse Code</a>). Both take text, image,
  video and audio in and emit text, over a <strong>1M-token context</strong>.
  Meta pitches two named behaviours rather than a size: <strong>Active
  Memory</strong>, "carrying important context about you across conversations
  and actively retrieving the details relevant to the task at hand," and
  <strong>Active Focus</strong>, "continuing working toward a challenging
  goal: trying alternative approaches, working through blockers, and adapting
  to new information."</p>

  <p>The launch scorecard compares both variants at max reasoning effort
  against <a href="/outputs/openai/gpt-6-astra">GPT-6 Astra</a>,
  <a href="/outputs/anthropic/claude-fable-5.1">Claude Fable 5.1</a> and
  <a href="/outputs/anthropic/claude-opus-5.5">Claude Opus 5.5</a>, and it is
  not a sweep. <strong>Wonder Full leads the group on professional agent work
  and long-horizon engineering</strong>: Harvey LAB-AA <strong>13.1</strong>
  against Astra's 8.6, Fable 5.1's 6.4 and Opus 5.5's 4.2 &mdash; half again
  the best rival on legal deliverables, and more than triple Opus &mdash;
  plus SWE-Marathon <strong>57.5</strong> (xhigh) against
  42.5&ndash;46.3, DeepSWE 1.1 <strong>79.0</strong>,
  AutomationBench-AA 45.4, and Meta's internal Personal Superintelligence
  Index 59.1. On MemoryBench, the evaluation built for the Active Memory
  claim, the smaller Wonder edges Full <strong>85.6 to 85.5</strong>, both
  clear of the 79.0&ndash;81.5 field.</p>

  <p><strong>It trails Opus 5.5 where the comparison is least favourable to
  the pitch.</strong> Meta's own AA Intelligence Index row reads
  <strong>56 for Wonder Full and 52 for Wonder, against 58 for Opus
  5.5</strong>; ProgramBench is 59.0 vs <strong>70.5</strong>, OSWorld V2.1
  78.4 vs 81.8 partial, Terminal-Bench 4.0-AA 57.1 vs 59.6, and HealthBench
  Pro 62.3 vs 65.6. Vals Finance Agent V2 splits the family: Full takes it at
  59.1 over Fable 5.1's 58.9 and Opus 5.5's 58.6, while the base Wonder's
  56.6 trails both. So the frontier claim holds for agentic and legal work
  and for sustained coding, not for general intelligence. Artificial Analysis
  published its own pages the day after launch and <strong>confirmed Meta's
  numbers exactly</strong> on <strong>AA Intelligence Index v4.3.2</strong>:
  <strong>52 for Muse Wonder</strong> (max reasoning), ranking 9th of 216
  scored models, and <strong>56 for Muse Wonder Full</strong>, ranking 4th
  &mdash; Meta's best placement to date and a jump from
  <a href="/outputs/meta/muse-spark-1.3">Muse Spark 1.3</a>'s 48. AA lists
  Wonder at $4.00 / $20.00 per 1M and notes Full has no publicly available
  API, consistent with its subscription-only release.</p>

  <p>Released under the <strong>Meta Superintelligence Scaling
  Framework</strong>, with an unusually direct disclosure: Meta "does not rule
  out the model reaching" the high-risk threshold in the <strong>Chemical
  &amp; Biological</strong> domain without mitigations, and so ships safety
  post-training plus system-level classifiers for that domain; Cybersecurity
  and Loss of Control are assessed "moderate or lower" even unmitigated. Cyber
  capability on Wonder Full: CyberGym 88.4%, ExploitBench 58.9%, and 92 flags
  on ExploitGym &mdash; of which a verifier pass found only <strong>21 used
  the intended vulnerability</strong>, the figure comparable to the published
  ranking. Parameters are undisclosed and no weights were released, though
  Mark Zuckerberg has said Meta plans open-weights versions of the Muse
  line.</p>
