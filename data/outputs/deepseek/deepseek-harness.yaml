description: >
  <p><strong>"Everything is a plugin."</strong> DeepSeek's open-source agent
  harness (<code>dsh</code>), the execution layer it uses to evaluate and
  deploy its own models and the scaffold behind the
  <a href="/outputs/deepseek/deepseek-v4.1-flash">V4.1-Flash</a> agentic
  results. Built in TypeScript on the <strong>Cordis</strong> plugin kernel,
  which only loads, unloads, and resolves dependencies between plugins; every
  agent capability &mdash; model adapters, tools, skills, sessions, sandboxes,
  storage, the agent loop, scheduling, and the UI &mdash; is a plugin that
  developers swap or extend from configuration without touching the source.
  Everything the model sees is written to an append-only session log
  (system prompt, chain of thought, tool calls and results, sub-agent
  dispatch, every context injection) and surfaced in a Trajectory view;
  resume, fork, retrieval, and replay share that one event stream.</p>

  <p>Ships four presets: <strong>Standard</strong> (a full coding agent with
  file editing, shell, file and web search, skills, plans, goals, sub-agents,
  and workflows), <strong>PTC</strong> (the same tools exposed through a Code
  Mode SDK so the model composes multi-step actions in one TypeScript
  program), <strong>Minimal</strong> (a two-tool bash plus
  <code>str_replace_editor</code> agent for benchmarking models in bare
  environments), and <strong>Create</strong> (runtime inspection and in-memory
  plugin experiments for authoring new presets); an Agent Team mode runs a
  lead agent over sub-agents. Launched as a developer preview in mid-August
  2026 with the repository public from August 13, installable as
  <code>npx @deepseek-ai/dsh web</code>; at filing it had passed
  <strong>218K GitHub stars</strong> with release candidates landing daily.
  MIT license; DeepSeek warns of compatibility-breaking changes during the
  preview.</p>

  <p>On October 31, 2026 DeepSeek published <a
  href="https://github.com/deepseek-ai/dsh-superagent-prototype"><strong>dsh-superagent</strong></a>
  (MIT), a proactive coding agent for a single GitHub repository, packaged
  as a <code>dsh</code> bundle. It listens to GitHub and optionally Feishu,
  opens a work item when an authorized person asks, works in its own session
  and directory, and answers in the original thread, for example with a pull
  request. A web panel shows only what needs a human. Its stated design goal
  is to "take as little human attention as possible". DeepSeek labels it a
  research prototype adapted from internal day-to-day use, with much of the
  engineering done by coding agents. It differs from the internal version
  and from the design in DeepSeek's write-up <em>Exploring Super-agent
  Design: Towards a More Autonomous Agent System</em>, some of which is
  described there as future work. It passed 14,900 GitHub stars within three
  days.</p>
