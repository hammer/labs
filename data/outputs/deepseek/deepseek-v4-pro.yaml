description: >
  <p>The <strong>general-availability build of DeepSeek-V4-Pro</strong>, rolled out
  across DeepSeek's app, web client, and API on August 13, 2026. It supersedes the
  April <a href="/outputs/deepseek/deepseek-v4">V4-Pro preview</a> while retaining
  the <code>deepseek-v4-pro</code> API identifier. The API exposes a <strong>1M-token
  context window</strong>, low/high/max thinking-effort controls, and native support
  for the OpenAI Responses API, including a Codex-specific integration.</p>

  <p>DeepSeek reports substantially stronger agent performance than the preview:
  <strong>87.9</strong> on Terminal-Bench 2.1, <strong>62.7</strong> on DeepSWE,
  <strong>74.1</strong> on Toolathlon-Verified, <strong>61.5</strong> on NL2Repo,
  and <strong>60.0</strong> on Humanity's Last Exam with tools (42.7 without).
  Other reported results include CyberGym 83.3, DSBench-FullStack 71.1, and
  DSBench-Hard 67.2. DeepSeek released the GA checkpoint's weights on Hugging
  Face under the <strong>MIT License</strong>; for high/max reasoning effort it
  recommends allowing up to 384K output tokens.</p>
