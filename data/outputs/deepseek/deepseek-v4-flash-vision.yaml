description: >
  <p>The <strong>V4 family's first image-input model</strong>: an experimental,
  API-only multimodal build of <a
  href="/outputs/deepseek/deepseek-v4-flash">DeepSeek-V4-Flash-0731</a> that
  accepts mixed text + image input (JPEG, PNG, GIF, WebP; up to 600 images per
  request). DeepSeek says it "matches DeepSeek-V4-Flash on text
  capabilities&mdash;including agents, reasoning, and world knowledge" and makes
  "a major leap over V4-Flash" on multimodal agent benchmarks, "bringing
  multimodal agent performance close to Opus-4.8" (no scores published). Served
  as <code>deepseek-v4-flash-vision-exp</code> with a 1M-token context, 384K
  max output, thinking mode on by default with low/high/max
  <code>reasoning_effort</code>, and Chat Completions, Anthropic Messages and
  Responses API support. Weights followed on HuggingFace on
  September 1, 2026 under the <strong>MIT license</strong> (~305B by
  safetensors count &mdash; the 284B V4-Flash MoE backbone plus the vision
  tower; <code>deepseek_v4</code>, 43 layers, 256 routed experts, top-6,
  1,048,576 positions).</p>

  <p>Images are auto-resized to roughly 800&times;800 pixels and tokenized at
  up to <strong>384 tokens per image</strong>, billed at V4-Flash text rates
  ($0.22/M input, $0.66/M output off-peak). Launched alongside a free Files API
  (upload an image once, reference it by <code>file_id</code>) and DeepSeek
  Harness 0.1.1, which added the model to its DeepSeek adapter the same day.
  Artificial Analysis lists it as a proprietary model and scores its max-effort
  reasoning mode within a point of the text-only V4-Flash-0731 (AA Intelligence Index v4.2: 42 vs 41).</p>
tags:
  - multimodal
  - vision
  - reasoning
  - agentic
  - proprietary
model:
  # Vision-enabled build of V4-Flash-0731 (DeepSeek's announcement frames it
  # against V4-Flash; OpenRouter: "an experimental vision-enabled version of
  # DeepSeek V4 Flash 0731"; AA files it under the V4 Flash 0731 family).
  # Architecture/params are not restated by DeepSeek for this build, so they
  # are left unset here — the base entry carries the 284B-A13B MoE facts.
  base_model: deepseek-v4-flash
  context_window: 1048576
  license: MIT
  intelligence_index: 42
  intelligence_index_version: "AA v4.2"
  intelligence_index_history:
    - score: 51
      version: "AA v4.1.1"
      until: "2026-09-05"
related:
  - deepseek-v4-flash
  - deepseek-v4
