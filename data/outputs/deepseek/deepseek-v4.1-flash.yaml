description: >
  <p>The first model in DeepSeek's <strong>V4.1 architecture family</strong>
  and, per DeepSeek, the smallest of it: a natively multimodal 552B-parameter
  MoE that succeeds <a href="/outputs/deepseek/deepseek-v4-flash">V4-Flash</a>
  and, on DeepSeek's own tests, beats the 1.6T <a
  href="/outputs/deepseek/deepseek-v4-pro">V4-Pro</a> on performance, cost, and
  speed. The headline change is a <strong>Causal Encoder-Decoder (CED)</strong>
  layout: a 20-layer causal encoder feeds a 20-layer decoder whose global KV
  cache is projected from the encoder's final hidden states, so the model
  activates only <strong>8B parameters per token during prefill and 16B during
  decode</strong>. <strong>Compressed Sparse Attention 2 (CSA2)</strong> shares
  main KV and indexer keys across layers in Full, Reindex, and Reuse modes with a
  hierarchical sparse indexer, and the main KV cache is stored in FP4, bringing
  the global KV footprint to <strong>890 bytes per token</strong>, about a
  quarter of V4-Flash and 437 times smaller than DeepSeek-V1; SWA Bounded
  Replay cuts the persistent SSD cache to roughly an eighth. Decode FLOPs grow
  only about a quarter from 4K to 1M context. It keeps and revises the V4-era
  extensions: Single-Pass <a href="/outputs/deepseek/mhc">mHC</a>, a 196B
  <a href="/outputs/deepseek/deepseek-engram">Engram</a> conditional-memory
  table, and <a href="/outputs/deepseek/dspark">DSpark</a> speculative decoding.
  Each MoE layer has 384 routed experts plus one shared, 6 active per token; a
  from-scratch DeepSeek-ViT encoder with 2D-RoPE handles images.</p>

  <p>Pretrained from scratch on <strong>45T multimodal tokens</strong>, with
  sparse attention trained at 64K and context extended to 1M tokens at the 34T
  mark; post-training is the standard SFT, RL, and on-policy-distillation recipe
  with the changes confined to large-scale synthetic agent tasks and
  environments. Reasoning effort is a continuous 1 to 100 dial; the API exposes
  max, high, and low tiers at 100, 75, and 50. Self-reported at max effort
  (DeepSeek Harness): DeepSWE v1.1 <strong>74.2</strong> (Claude Opus 5 74.0,
  GPT-5.6 Sol 73.0, V4-Flash 54.4), Terminal-Bench 2.1 <strong>90.6</strong>,
  Terminal-Bench 4.0 31.2 (Opus 5 51.8), GPQA Diamond 90.9, HLE 36.8, Codeforces
  3471, MathArena Apex 65.6, CyberGym 88.1, Automation-Bench 54.8, and Agents'
  Last Exam 31.8. MIT license; served as <code>deepseek-flash</code> at $0.30
  per million input tokens and $1.20 per million output at peak, half that
  off-peak, with a 1M context and 384K max output. V4-Flash and
  V4-Flash-Vision-Exp were retired the same day, and V4-Pro traffic routes to
  V4.1-Flash from September 14 until a V4.1-Pro ships. Artificial Analysis
  scores it <strong>39</strong> on Intelligence Index v4.3.2 (reasoning, max
  effort), above V4-Pro at 36 on the same version; AA had not rescored this
  original checkpoint on v5.0 when that launched. At its September release that put it near the
  top of the open-weights field, behind GLM-5.3 (45 on v4.3.2). It measured
  198 tokens/s and a 1.06 s time to first token.</p>

  <p><strong>DeepSeek-V4.1-Flash-1017</strong> (October 17, 2026) is a
  second checkpoint of the same model, and DeepSeek's card calls it "a minor
  update". Its config.json is byte-identical to the September release (552B,
  16B active at decode, 384 routed experts plus one shared with 6 active, 1M
  context, Engram and DSpark heads), so the architecture facts above apply
  unchanged. The changes are in post-training. DeepSeek says it trained the
  checkpoint with "reinforcement learning with self-feedback" for end-to-end
  project building and claims "a Pareto improvement in performance and cost":
  higher scores, faster task completion and shorter outputs. Self-reported
  gains over the September checkpoint: Terminal-Bench 4.0 <strong>42.3 vs
  31.2</strong>, HLE without tools 42.6 vs 36.8, ProgramBench 29.1 vs 20.3,
  Apex Bench v1.1 72.1 vs 64.6, Automation-Bench 60.5 vs 54.8, Agents' Last
  Exam 35.4 vs 31.8, DeepSWE v1.1 77.0 vs 74.2 and NL2Repo 68.2 vs 65.4. The
  independent number moves the same way: Artificial Analysis scores 1017 at
  <strong>45</strong> on v4.3.2, six points above the original, and has
  marked the September entry deprecated in its favour. On v5.0 1017 scores
  <strong>32</strong>, level with GLM-5.3 as the highest-scoring model with
  released open weights at launch. 1017 now serves the
  <code>deepseek-flash</code> API name at the same Flash price, and it is the
  default checkpoint of DeepSeek's <a
  href="/outputs/deepseek/deepinfer">DeepInfer</a> inference framework. The
  weights are on HuggingFace and ModelScope under MIT. This entry keeps its
  structured score on the September checkpoint that the file names, and
  records 1017 as a variant.</p>
