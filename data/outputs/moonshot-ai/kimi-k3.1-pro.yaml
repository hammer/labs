description: >
  <p>Not a new base model: "Kimi K3.1 Pro is a <strong>post-trained version of
  Kimi K3</strong>, with substantially larger post-training compute" &mdash; how
  much larger is not quantified. The architecture mostly carries over from
  <a href="/outputs/moonshot-ai/kimi-k3">Kimi K3</a>, the 2.8T Stable LatentMoE
  with 104B active and a 1M-token context (93 layers, 896 experts with 16
  routed and 2 shared). There is one change, disclosed only in the
  open-weight model card: the 24 full-attention layers that were Gated MLA in
  K3 are now <strong>Gated DeepSeek Sparse Attention</strong>, with a
  32-head indexer selecting the top 2,048 tokens, alongside the unchanged 69
  KDA layers. What moved is the score: 55 on AA Intelligence Index
  v4.3.2 against K3's 44 on the same version, bought entirely in
  post-training. On <strong>v5.0</strong> (October 27) it reads
  <strong>46</strong>, which AA reports as the top open-weights score even
  though the weights are not yet released. Moonshot's own framing is breadth rather than a single win
  &mdash; "consistent gains in every domain", with coding, 3D creation,
  financial research and agentic use called out.</p>

  <p><strong>The weights shipped on time.</strong> The launch post promised
  "Full model weights will be released by <strong>Nov 4, 2026</strong>", and at
  filing (Oct 24) nothing was downloadable, so the entry was carried as
  closed. <a href="https://huggingface.co/moonshotai/Kimi-K3.1-Pro"><code>moonshotai/Kimi-K3.1-Pro</code></a>
  appeared on HuggingFace on <strong>2026-11-02</strong>, public and ungated.
  It holds a single checkpoint of about 2.78T parameters, with MXFP4 weights
  and MXFP8 activations from quantization-aware training, the same precision
  Moonshot serves, and it has vision processors. It ships with day-0 vLLM,
  SGLang and TokenSpeed recipes. The <strong>Kimi K3.1 Pro License</strong> is
  MIT-style with two conditions. A Model-as-a-Service operator with more than
  $20M in trailing-12-month revenue needs a separate agreement with Moonshot
  for commercial use. A product with more than 100M MAU or more than $20M in
  monthly revenue must display "Kimi K3.1-Pro". It now tops the open-weights
  intelligence column at AA v5.0's 46.</p>

  <p><strong>The cyber-capability ablation is the most unusual thing in the
  post</strong>, because Moonshot measured its own safety intervention and
  published the counterfactual. "For the open-weight release of K3.1 Pro, we
  identified and removed cyber-related data from both training stages, while
  retaining the general-purpose coding tasks needed for model usefulness",
  defended on access grounds: "We believe making K3.1 Pro available in a
  non-discriminatory way benefits people who need dual-use capabilities for
  defensive purposes." On internal xdev-bench-hard (pass@3) the ladder runs
  GPT-5.6 Sol <strong>100</strong> (third-party evaluation), <strong>the same
  pipeline without cyber risk-reduction 90.5</strong>, DeepSeek-V4.1-Flash 85.7,
  shipped <strong>K3.1 Pro 81.0</strong>, GLM-5.3 57.1, and
  <strong>K3 33.3</strong>. Moonshot reads it as "data removal meaningfully
  reduces cyber capability relative to what the same training pipeline would
  otherwise produce", which is true and worth 9.5 points. The other true
  reading sits in the same column: the shipped, risk-reduced model still scores
  <strong>81.0 against its predecessor's 33.3</strong>, so the generation more
  than doubled the capability that the removal then trimmed.</p>

  <p>On the capability tables it approaches the closed frontier without
  passing it. <strong>Terminal-Bench 4.0: 65.7%</strong> against Claude Opus
  5.5's 66.4%. On BenchCAD (1,000-file subset, Voxel IoU) <em>with tools</em> it
  takes <strong>92.7</strong> behind Opus 5.5 at 96.2 and GPT-6 Astra at 95.9 &mdash;
  but <em>without tools</em> it reads <strong>72.8 against Opus 5.5's 73.0</strong>,
  which is the sharper of the two numbers and the one the scaffold is not doing
  the work in. It leads on finance, <strong>64.4 on OfficeQA Pro v2</strong>
  (state of the art) and 58.6 on Frontier Finance, and reports an
  <strong>8.3% claim-level hallucination rate</strong> on Kimi Hallu Bench Hard.</p>

  <p>Served on Kimi.com, Kimi Work, <a href="/outputs/moonshot-ai/kimi-code">Kimi
  Code</a> and the Kimi API at <strong>$2.00 / $10.00 per 1M tokens</strong> with
  cache reads at $0.20, a 1M context and up to 943,718 completion tokens.
  Reasoning is on by default at <em>max</em> effort, with max/high/low/none
  exposed, and the modality is text, image <em>and video</em> in. A second
  variant, <strong>Kimi K3.1 Pro Highspeed</strong>, "delivers 2-3&times; the
  speed of K3.1 Pro for more responsive interactions" through the same channels
  with no separate price published. AA measures 77.1 output tokens/s, a 2.89s
  time to first token and $2.11 per Intelligence Index task. No technical report
  and no GitHub repository at filing &mdash; K3 shipped one of each. As of
  2026-11-05 the open-weight release added a model card but still no technical
  report.</p>
