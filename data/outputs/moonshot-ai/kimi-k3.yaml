description: >
  <p>Moonshot's next-generation flagship: a <strong>2.8T-parameter Stable
  LatentMoE</strong> (16 of 896 experts active) built on Kimi Delta
  Attention (from <a href="/outputs/moonshot-ai/kimi-linear">Kimi
  Linear</a>) and <a
  href="/outputs/moonshot-ai/attention-residuals">Attention
  Residuals</a>, with Gated MLA, <strong>native vision</strong>, and a
  1M-token context window &mdash; the architectural leap the K2 line
  (1T/32B) built toward. Runs at max thinking effort by default with low-
  and high-effort modes. AA Intelligence Index <strong>60</strong> (v4.1.1)
  &mdash; #4 overall at release, the highest-scoring Chinese model and
  above Grok 4.5 (54), though AA flags verbosity (~2&times; median output
  tokens) and slow serving. Moonshot positions it as trailing only Claude
  Fable 5 and GPT-5.6 Sol. $0.30/$3/$15 per MTok (cache-hit/miss/output);
  live on Kimi.com, Kimi Work, Kimi Code, and the API at launch.
  <strong>Weights (~1.56TB) and the technical report shipped on schedule
  July 27</strong> under a bespoke "Kimi K3 License" &mdash; the largest
  open-weight model to date (8-bit instruct checkpoint only; no base
  checkpoint). The report discloses 104B active parameters and the layer
  mix: 69 KDA + 24 Gated MLA layers with attention residuals.</p>
