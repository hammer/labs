name: LongCat-Video
slug: longcat-video
lab: meituan
date: 2025-10-25
sources:
  - label: Paper (arXiv)
    url: https://arxiv.org/abs/2510.22200
  - label: HuggingFace
    url: https://huggingface.co/meituan-longcat/LongCat-Video
  - label: GitHub
    url: https://github.com/meituan-longcat/LongCat-Video
description: >
  13.6B parameter foundational video generation model unifying text-to-video,
  image-to-video, and video-continuation tasks. Uses Diffusion Transformer
  with block sparse attention and multi-reward GRPO. Includes a Video-Avatar
  variant for identity-consistent portrait generation.
tags:
  - video
  - generation
  - open-weight
outputs:
  - name: LongCat-Video
    type: model
    date: 2025-10-25
    sources:
      - label: HuggingFace
        url: https://huggingface.co/meituan-longcat/LongCat-Video
      - label: GitHub
        url: https://github.com/meituan-longcat/LongCat-Video
    model:
      open_weights: true
      architecture: dense
      parameters: 13.6B
  - name: LongCat-Video Technical Report
    type: paper
    date: 2025-10-25
    sources:
      - label: Paper (arXiv)
        url: https://arxiv.org/abs/2510.22200
    paper:
      arxiv: "2510.22200"
  - name: LongCat-Video-Avatar
    type: model
    date: 2025-12-13
    sources:
      - label: HuggingFace
        url: https://huggingface.co/meituan-longcat/LongCat-Video-Avatar
      - label: HuggingFace (Avatar 1.6)
        url: https://huggingface.co/meituan-longcat/LongCat-Video-Avatar-1.6
      - label: Avatar 1.6 technical report (PDF)
        url: https://github.com/meituan-longcat/LongCat-Video/blob/main/assets/LongCat-Video-Avatar-1.6-Tech-Report.pdf
    description: >
      Identity-consistent, audio-driven portrait video generation variant built
      on LongCat-Video. Version 1.6 (2026-11-13, MIT, after an intermediate 1.5)
      improves lip-audio sync and facial/body coordination, and reduces error
      accumulation in autoregressive continuation so that videos can run past
      10 minutes. It also adds inference optimizations.
    model:
      open_weights: true

