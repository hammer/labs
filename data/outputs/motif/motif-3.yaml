description: >
  <p><a href="/labs/motif">Motif Technologies</a>' frontier Korean/English
  foundation model: a <strong>314B-total / 13.2B-active sparse MoE</strong>
  (384 routed experts, top-8, plus 1 shared expert; 53 layers, 2 dense + 51
  MoE; 220K vocabulary) with a <strong>native 256K context</strong>, pretrained
  from scratch on <strong>~12.5T tokens</strong> (knowledge cutoff March 2026;
  ~70% of the corpus is NVIDIA's public Nemotron pretraining releases, the rest
  in-house web, STEM, code, synthetic, Korean, legal and financial data). The
  architecture is fully in-house: <strong>Grouped Differential Latent Attention
  (GDLA)</strong> (grouped differential attention over an MLA-style compressed
  KV latent, with a query-dependent output gate), <strong>Expert-Specific
  PolyNorm</strong> activations, modified manifold-constrained hyper-connections
  (mHC, 4 residual streams), and a 1-layer <strong>multi-token-prediction
  head</strong> used for self-speculative decoding. Trained on NVIDIA B200s with
  the Muon optimizer (QK-Clip), selective MXFP8 expert compute and window-aware
  context parallelism. Post-training combines general SFT, six RL-trained
  specialist teachers plus a software-engineering teacher, and
  <strong>Multi-teacher On-Policy Distillation (MOPD)</strong> into one unified
  reasoning model.</p>

  <p><strong>Timeline.</strong> Motif first surfaced as
  <strong>Motif-3-Beta</strong>, an intermediate checkpoint released 14 July
  2026 under a non-commercial research-only license (AA lists it separately as
  "Motif 3 (Beta)"; it scored 44 then 45 on AA Intelligence Index v4.1/v4.1.1).
  The <strong>final release</strong> followed in August 2026: the post-trained
  <strong>Motif-3</strong> and pretrained <strong>Motif-3-Base</strong>
  checkpoints under the <strong>MIT license</strong> (commercial use permitted,
  no access gate), the "Motif 3: Technical Report" (arXiv 2608.09119, 10 Aug),
  and an <strong>NVFP4</strong>-quantized build for Blackwell GPUs. AA lists the
  final model at <strong>AA Intelligence Index v4.1.1: 47</strong> &mdash; the
  <strong>#1 Korean model</strong> on the index &mdash; with particular strength
  on agentic tool use (&tau;&sup3;-Banking 35.3, Terminal-Bench 2.1 74.9,
  ITBench 51.5) and calibrated abstention on AA-Omniscience (71.6
  non-hallucination). Motif's torchtitan-based training framework
  (motif3-training-example) and a vLLM fork with Motif-3 support are open on
  GitHub. From a lab spun out of Moreh, trained on its GPU-optimization
  stack.</p>
