description: >
  <p>A new base <strong>trained from scratch on 28T tokens</strong> as a
  <strong>looped transformer</strong>. The report is titled "Unlocking Agentic
  Capabilities in a Compact Model". Its 22 physical layers run twice per
  forward pass, giving 44 effective layers, with hidden size 3072, 48 query
  heads and 8 KV heads. The model has 4.17B parameters in total, or 3B
  without embeddings. The report says it chose looping from scratch over
  upcycling an existing model, and a full two-pass loop over sharing the KV
  cache across loops. The instruct model has a 256K context.</p>

  <p>Self-reported results:</p>
  <ul>
    <li><strong>Reasoning:</strong> GPQA-Diamond 87.4 and HMMT Feb 2026
    82.8.</li>
    <li><strong>Agentic coding:</strong> SWE-bench Verified 63.6, SWE-bench Pro
    46.9 and Terminal-Bench 2.0 44.1.</li>
    <li><strong>Other:</strong> GDPval rubrics 74.3 and AA-LCR 58.7.</li>
  </ul>
  <p>Artificial Analysis's August 2026 study of models that fit on a phone
  scored it <strong>63 on its mobile-device benchmark set</strong> at 16K
  context, tied for first. That set is separate from the Intelligence
  Index.</p>

  <p>The release added:</p>
  <ul>
    <li>FP8 and GPTQ-Int8 checkpoints.</li>
    <li>Nanbeige forks of vLLM, SGLang, llama.cpp and Ollama to serve the
    looped architecture.</li>
    <li><strong>DSpark</strong> (August 31): an 848M speculative-decoding draft
    model that reads hidden states from five target layers and drafts seven
    tokens at a time.</li>
  </ul>
  <p>The card says its modeling code already contains LoopSplit, mHC with
  depth attention and concatenated n-gram embeddings. These are features
  meant for <strong>Nanbeige4.5</strong>, which was in training for release
  later in 2026.</p>
