description: >
  <p>1.3B-parameter on-device vision-language model with <strong>262K context
  window</strong> and 4x/16x mixed visual-token compression for iOS, Android,
  and HarmonyOS deployment. AA Intelligence Index v4.0: <strong>13</strong>
  &mdash; reportedly <strong>19x more token-efficient than Qwen3.5 0.8B</strong>
  at comparable quality.</p>

  <p>Continues the <a href="/outputs/openbmb/minicpm-v">MiniCPM-V</a> series'
  push on the edge-multimodal frontier alongside the omni-modal
  <a href="/outputs/openbmb/minicpm-o">MiniCPM-o 2.6</a>.</p>
