description: >
  <p>OpenBMB's September 2026 <strong>UltraData</strong> drop, released
  alongside
  <a href="/outputs/openbmb/minicpm5-2b">MiniCPM5-2B</a>, whose pretraining
  corpus it feeds. The drop now carries both the L2 and L3 tiers, split by
  language (C++, C#, Go, Java, JavaScript, PHP, Python and more) as parquet
  shards, together
  with the L2 quality classifier used to build it. It follows
  <a href="/outputs/openbmb/ultra-fineweb-l3">Ultra-FineWeb-L3</a> as the
  second tier-labelled UltraData release. The same week added <strong>UltraData-RL-2609</strong>,
  85,995 verifiable RL problems (math 32.4K, code 23.7K, long-context 18.0K,
  knowledge 11.9K) on which JustRL II was run, and
  <strong>UltraData-SFT-Agent-2609</strong>, 483,661 agent trajectories across
  code, search, general, and tool-use agents; the pipeline itself is described
  in the tiered data-management paper (arXiv 2602.09003). Apache 2.0.</p>

  <p><strong>The technical report arrived on 2026-10-09</strong>, five weeks
  after the data &mdash; <em>UltraData-Code: From Raw Repositories to
  Algorithmically Dense and Task-Oriented Code Data</em>
  (<a href="https://arxiv.org/abs/2610.23960">arXiv:2610.23960</a>), sixteen
  authors across Peking, Tsinghua and ModelBest. Its premise is that corpus
  expansion has run out of room &mdash; "as obtaining public code of
  sufficient quality becomes more difficult, further progress cannot rely on
  corpus expansion alone" &mdash; so the four tiers apply progressively
  narrower processing to progressively smaller pools. <strong>L0</strong>
  keeps raw repositories and provenance so the pipeline can be re-run;
  <strong>L1</strong> is filtered, normalised, near-deduplicated code for
  broad pretraining; <strong>L2</strong> selects algorithmically relevant
  files by language-adaptive relevance signals, about <strong>400B tokens
  across 11 languages</strong>; <strong>L3</strong> converts selected
  implementations into structured programming exercises, about <strong>150B
  tokens</strong> over the same 11.</p>

  <p>The ablation is controlled, and worth reading with its scale attached. On
  <strong>10B-token continual pretraining of a 1B model</strong>, L2 beats L1
  by <strong>+7.80pp pass@1 on EvalPlus</strong> and +5.13pp on MultiPL-E;
  replacing <em>half</em> the L2 tokens with L3 adds a further
  <strong>+8.42pp and +8.07pp</strong>. Both gains are reported to grow at a
  100B-token budget, which is the direction a data paper needs &mdash; though
  1B/10B is still far below the scale this corpus is built to serve. The
  result to take from it is that the synthesis tier outperforms the selection
  tier at a third of the token count.</p>

