description: >
  <p>OpenBMB's flagship open pretraining dataset family, built on the
  <strong>UltraData L0–L4 tiered framework</strong> for moving raw web data
  through progressively more useful curation layers.</p>

  <p><strong>Ultra-FineWeb (L2, June 2025):</strong> ~<strong>1.3T-token</strong>
  selection from FineWeb and Chinese FineWeb &mdash; 1T English + 120B Chinese.
  Introduces a lightweight fastText classifier and an "efficient verification
  strategy" that lets the team rapidly estimate the training impact of a
  candidate filter at minimal compute. Apache 2.0.</p>

  <p><strong>Ultra-FineWeb-L3 (May 28, 2026):</strong> further <em>refinement</em>
  of L2 into more learnable training samples &mdash; <strong>400B+ English and
  200B+ Chinese tokens</strong> across two synthesis tasks:</p>

  <ul>
    <li><strong>Q&A Synthetic</strong>: declarative web text rewritten as
    "original + multiple Q&A pairs" with self-contained questions over core
    concepts, facts, and logical relations (245B English / 118B Chinese).</li>
    <li><strong>Multi-Style Synthetic</strong>: single-source content rewritten
    into encyclopedia, textbook, blog, and abstract styles for richer
    expression coverage (164B English / 82B Chinese).</li>
  </ul>

  <p>The Chinese portion is reportedly the <strong>largest open-source Chinese
  pre-training synthetic dataset</strong> to date. Apache 2.0. By Yudong Wang,
  Zixuan Fu, Jie Cai, Peijun Tang, Hongya Lyu, Yewei Fang, Zhi Zheng, Jie Zhou,
  Guoyang Zeng, Chaojun Xiao, Xu Han, and Zhiyuan Liu.</p>
