description: >
  <p>OpenBMB's <strong>L2-selected</strong> open pretraining dataset and the
  filtering pipeline behind it. ~<strong>1.3T tokens</strong> &mdash; 1T English
  and 120B Chinese &mdash; distilled from FineWeb and Chinese FineWeb. Apache 2.0.</p>

  <p>The companion paper "Ultra-FineWeb: Efficient Data Filtering and Verification
  for High-Quality LLM Training Data" introduces an <strong>efficient verification
  strategy</strong> that estimates a candidate filter's downstream training impact
  at minimal compute, plus a lightweight <strong>fastText classifier</strong> that
  reproduces the resulting selection at scale. LLMs trained on Ultra-FineWeb show
  significant gains over their FineWeb baselines across multiple benchmarks.</p>

  <p>Sits at the L2 layer of OpenBMB's broader
  <strong>UltraData L0&ndash;L4 tiered framework</strong>, with
  <a href="/outputs/openbmb/ultra-fineweb-l3">Ultra-FineWeb-L3</a> (May 2026)
  refining this corpus into synthetic Q&A pairs and multi-style rewrites. By
  Yudong Wang, Zixuan Fu, Jie Cai, Peijun Tang, Hongya Lyu, Yewei Fang, Zhi Zheng,
  Jie Zhou, Guoyang Zeng, Chaojun Xiao, Xu Han, and Zhiyuan Liu.</p>
