description: >
  <p>First publicly reported <strong>1.58-bit ternary quantization-aware
  training at 8B scale on Huawei Ascend NPU (CANN stack)</strong>. Four sizes
  released: 0.5B, 1B, 3B, 8B. The 8B variant retains <strong>95.7% of FP
  accuracy</strong>, achieves <strong>~6&times; memory reduction</strong>, and
  imposes only ~5% throughput overhead vs full-precision training.</p>

  <p>Significant domestic-chip co-design milestone &mdash; demonstrates a fully
  China-domestic training stack for bitnet-class models, paralleling
  <a href="/labs/bytedance-seed">ByteDance</a>'s recently disclosed custom-CPU
  effort and DeepSeek-V4-Pro's Ascend 950PR pre-training. By the MiniCPM team.</p>
