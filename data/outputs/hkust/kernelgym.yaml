description: >
  <p><strong>RL for GPU kernel generation done right</strong> (ICML 2026):
  KernelGYM is a distributed RL environment for Triton kernel generation
  with robust multi-turn feedback, and the paper introduces
  <strong>TRLOO</strong>, an unbiased turn-level advantage estimator for
  multi-turn RL. The resulting <strong>Dr.Kernel-14B</strong> (RL-tuned
  from Qwen3-14B-Base; an 8B sibling from Qwen3-8B) beats
  Claude-4.5-Sonnet and GPT-5 on KernelBench Level-2 speedup metrics.</p>

  <p>Sole HKUST work from <a href="/people/junxian-he">Junxian He</a>'s
  hkust-nlp &mdash; the systems-flavored continuation of the lab's
  <a href="/outputs/hkust/simplerl">SimpleRL</a> zero-RL line into
  verifiable, performance-rewarded coding environments.</p>
