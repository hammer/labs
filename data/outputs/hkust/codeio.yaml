description: >
  <p><strong>Condensing reasoning patterns via code input/output
  prediction</strong> (ICML 2025 Oral): transforms real code into a
  natural-language CoT task &mdash; predict inputs/outputs given code and
  test cases &mdash; exposing models to universal reasoning primitives
  (logic-flow planning, state-space search, decision-tree traversal) while
  decoupling reasoning from code syntax. Consistently improves symbolic,
  scientific, logic, math, and commonsense reasoning; adopted as a
  pretraining/mid-training signal in later reasoning recipes.</p>

  <p>Joint <strong>HKUST / <a href="/labs/deepseek">DeepSeek-AI</a></strong>
  work with an HKUST student lead from
  <a href="/people/junxian-he">Junxian He</a>'s group.</p>
