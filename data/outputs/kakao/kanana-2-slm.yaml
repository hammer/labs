name: Kanana-2 SLM series
slug: kanana-2-slm
lab: kakao
type: model
date: 2026-07-27
sources:
  - label: HuggingFace (3B Instruct)
    url: https://huggingface.co/kakaocorp/kanana-2-3b-instruct
  - label: Tech Blog
    url: https://tech.kakao.com/posts/826
  - label: Announcement
