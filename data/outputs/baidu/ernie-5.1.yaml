description: >
  <p>Successor to <a href="/outputs/baidu/ernie-5.0">ERNIE 5.0</a>, launched at
  Baidu Create 2026. <strong>Derived from ERNIE 5.0 via elastic sub-network
  extraction</strong> &mdash; total params ~1/3 of 5.0, active params ~1/2 &mdash;
  with a disaggregated fully-asynchronous RL infrastructure and a four-stage
  post-training pipeline including Multi-Teacher On-Policy Distillation. Baidu
  claims pre-training cost is <strong>~6% of comparable industry peers</strong>.</p>

  <p>Self-reported benchmarks: <strong>AIME26 99.6</strong> (with tool use),
  <strong>LMArena Arena Search 1223</strong> (#4 globally, #1 among Chinese
  models), surpasses DeepSeek-V4-Pro on τ³-bench and SpreadsheetBench-Verified,
  approaches closed-source frontier on GPQA Diamond and MMLU-Pro. Not yet scored
  on Artificial Analysis.</p>
