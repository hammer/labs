name: ERNIE 5.5 Flash Preview
slug: ernie-5.5-flash-preview
lab: baidu
type: model
date: 2026-11-11
sources:
  - label: Release post (ERNIE)
    url: https://ernie.baidu.com/release/ernie-5-5-flash-preview/
  - label: TechNode coverage
    url: https://technode.com/2026/11/12/baidu-opens-api-access-to-ernie-5-5-flash-preview/
  - label: OpenRouter
    url: https://openrouter.ai/baidu/ernie-5.5-flash-preview:free
description: >
  <p>The first post-trained model on
  <a href="/outputs/baidu/ernie-5.5-flash-base">ERNIE 5.5 Flash Base</a>,
  released by Baidu on November 11, 2026, six days after the base checkpoint.
  It is the same <strong>280B total / 14B active MoE</strong>, text-only, with a
  <strong>1M-token context</strong>. Baidu says it targets coding, 3D modeling,
  knowledge work and content creation, and calls it an intermediate
  "preview" of ongoing post-training. The API is live on Baidu Qianfan, and
  OpenRouter has a free endpoint with a 1,024,000-token context. <strong>The weights are not yet
  released</strong>. Baidu says they "will be open-sourced under Apache 2.0
  soon", a more permissive licence than the base model's custom ERNIE
  licence. Baidu discloses no post-training recipe. The release post is
  mostly agent-harness demos, run in Claude Code: an 11-hour task that wrote
  an Unreal Engine 5.8 game in C++, about 100 mobile mini-games built from
  design documents, Blender scenes of an airport and Hōryū-ji, and FreeCAD
  models of a W16 engine and a lunar rover.</p>

  <p>The benchmark appendix (highest reasoning setting; many comparator scores
  re-run by Baidu) puts it close to
  <a href="/outputs/tencent/hy4">Hy4</a> and
  <a href="/outputs/deepseek/deepseek-v4.1-flash-1017">DeepSeek-V4.1-Flash-1017</a>,
  and ahead of <a href="/outputs/zai/glm-5.3-flash">GLM-5.3-Flash</a>, on most
  rows. ERNIE 5.5 Flash Preview / Hy4 / DeepSeek-V4.1-Flash-1017:
  Terminal-Bench 4.0 46.5 / 44.4 / 42.3, DeepSWE v1.1 71.2 / 74.9 / 77.0,
  AutomationBench 61.9 / 56.2 / 60.5, APEX-Agents 1.1 64.2 / 77.6 / 69.8,
  MCP-Atlas 84.6 / 83.0 / 77.8, BrowseComp 87.4 / 91.8 / 80.3, HLE text-only
  without tools 46.4 / 46.7 / 44.0, AA-LCR v1.1 79.0 / 80.0 / 82.7. Claude
  Opus 5.5 leads clearly on Terminal-Bench 4.0 (66.4), ProgramBench (65.0
  vs 29.5) and Terminal-Bench-Science (63.3 vs 21.0). Not yet scored on the
  Artificial Analysis Intelligence Index as of 2026-11-19.</p>
