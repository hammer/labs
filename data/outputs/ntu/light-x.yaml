description: >
  <p><strong>Generative 4D video rendering with joint camera and
  illumination control</strong> (ICLR 2026): re-renders monocular video
  along novel camera trajectories while relighting the scene, unifying
  trajectory control and illumination editing in one video-generation
  model &mdash; a step toward controllable neural rendering of dynamic
  real-world scenes.</p>

  <p>Joint HUST / NTU (S-Lab, <a href="/people/ziwei-liu">Ziwei Liu</a>) /
  Tsinghua-AIR / BAAI / CUHK-Shenzhen work with NTU as co-lead &mdash;
  representative of S-Lab's generation-and-restoration line alongside the
  ByteDance-branded SeedVR/SeedVR2 (filed with
  <a href="/labs/bytedance-seed">ByteDance Seed</a> per attribution
  rules).</p>
