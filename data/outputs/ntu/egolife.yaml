description: >
  <p><strong>Toward an egocentric life assistant</strong> (CVPR 2025): six
  participants lived together for a week wearing AI glasses, producing the
  <strong>EgoLife dataset</strong> &mdash; 300 hours of egocentric,
  interpersonal, multiview, multimodal daily-life recordings with intensive
  annotation &mdash; plus the EgoLifeQA long-context QA suite. The
  companion <strong>EgoGPT-7B</strong> is an omni-modal model tuned for
  egocentric video/audio understanding, with EgoRAG for
  ultra-long-context memory and retrieval.</p>

  <p>NTU-led (<a href="/people/ziwei-liu">Ziwei Liu</a>) through the
  LMMs-Lab community. EgoGPT builds on open LMM backbones, not a
  from-scratch pretrain; the line continues in later EgoLife releases.</p>
