description: >
  <p><strong>Measures knowledge acquisition from professional
  videos</strong>: 300 expert-level videos and 900 human-annotated
  questions across six disciplines, structured along three cognitive
  stages &mdash; Perception, Comprehension, Adaptation &mdash; with a
  &Delta;knowledge metric quantifying how much a model improves after
  "watching" the video. Revealed steep performance decline as cognitive
  demand rises and a wide human-model gap; adopted into frontier VLM
  evaluation suites (reported by Gemini and Qwen-VL releases).</p>

  <p>LMMs-Lab / NTU (<a href="/people/ziwei-liu">Ziwei Liu</a>'s
  orbit), evaluated via <a href="/outputs/ntu/lmms-eval">LMMs-Eval</a>.</p>
