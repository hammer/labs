description: >
  <p><strong>"Towards next-generation perceptual intelligence"</strong>:
  a fully open 8B LMM unifying image, long-video, and spatial
  understanding, with the entire pipeline released &mdash; data recipes,
  encoders, training logs, and the lean <code>lmms-engine</code> unified
  multimodal training stack that now backs LMMs-Lab releases.</p>

  <p>NTU-led LMMs-Lab release (<a href="/people/ziwei-liu">Ziwei
  Liu</a>, Bo Li), continuing the open-everything trajectory of
  <a href="/outputs/ntu/llava-onevision-1.5">LLaVA-OneVision-1.5</a>;
  sibling efforts include OpenMMReasoner (CVPR 2026, transparent SFT+RL
  multimodal-reasoning recipe) and the LongVT "thinking with long videos"
  line.</p>
