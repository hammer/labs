description: >
  <p>Ai2's open earth-observation foundation model line (entry filed at
  the v1.2 refresh; the line was previously untracked). Trained on
  Sentinel-1/2 and Landsat imagery in Nano/Tiny/Small/Base sizes (Base is
  a 114M ViT-Base; Small is new in v1.2). The v1.2 paper is an efficiency
  study: 3.0x fewer training GPU-hours and 2.9x fewer MACs at sustained
  benchmark performance. Released under the OlmoEarth Artifact License.
  On-thesis scientific FM for climate, agriculture, and disaster
  monitoring.</p>
