name: Raon-Speech
slug: raon-speech
lab: krafton
date: 2026-04-02
flagship: true
sources:
  - label: Demo / Project
    url: https://raon.krafton.ai
  - label: HuggingFace (Speech-9B)
    url: https://huggingface.co/KRAFTON/Raon-Speech-9B
  - label: HuggingFace (SpeechChat-9B)
    url: https://huggingface.co/KRAFTON/Raon-SpeechChat-9B
  - label: GitHub
    url: https://github.com/krafton-ai/Raon-Speech
