description: >
  <p>The efficiency companion to <a
  href="/outputs/thinking-machines/inkling">Inkling</a>, released as open
  weights two weeks after the flagship (it was Tinker-only at launch):
  <strong>276B total / 12B active MoE</strong> (42 layers, 6 of 256 routed
  experts + 2 shared, hybrid local/global attention), natively multimodal
  (text, image, audio in) with up to <strong>1M-token context</strong>.
  "Comparable performance to Inkling at a quarter of its size" &mdash; AA
  Intelligence Index v4.1.1: <strong>41</strong> vs the 975B flagship's 42, at
  $1.20/M output tokens vs $4.05.</p>

  <p>Own pretraining run with a revised data mix and recipe (trained on
  NVIDIA GB300 NVL72 systems), then post-trained from an earlier preview
  checkpoint partly via <strong>on-policy distillation with Inkling as
  teacher</strong>, plus two further weeks of agentic-coding RL &mdash; it
  <em>surpasses</em> the flagship on reasoning and agentic coding
  (SWE-bench Verified 80.2 vs 77.6) while Inkling keeps the edge on
  knowledge and factuality. Apache 2.0; NVFP4 checkpoint alongside;
  fine-tunable on Tinker; day-0 vLLM/SGLang support.</p>
