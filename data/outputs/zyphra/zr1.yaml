description: >
  <p>Compact reasoning model post-trained from
  <a href="https://huggingface.co/deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B">DeepSeek-R1-Distill-Qwen-1.5B</a>
  using <strong>PRIME (Process Reinforcement through IMplicit rEwards)</strong>
  with token-level RLOO on ~400k math + ~25k code samples (NuminaMath-CoT, APPS,
  CodeContests, TACO, Codeforces). Generation length ramped 12k &rarr; 24k tokens
  over training.</p>

  <p>Self-reported numbers: 88.34% MATH-500, 37.91% GPQA-Diamond, ~40% LeetCode
  &mdash; >50% improvement over the R1-Distill base at the same parameter count.
  An applied study in token-efficient reasoning at small scale. <em>Not currently
  scored on Artificial Analysis.</em></p>
