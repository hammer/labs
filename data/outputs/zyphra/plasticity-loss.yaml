description: >
  <p>Zyphra study of plasticity loss &mdash; the declining ability of
  networks to learn from new data over the course of training &mdash;
  showing it appears even in stationary pretraining (not just continual
  learning), and that scaling parameters has diminishing returns as a
  remedy. Relevant to continual-pretraining and long-run training-dynamics
  research.</p>
