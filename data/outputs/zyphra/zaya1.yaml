description: >
  <p>Zyphra's reasoning successor to Zamba2: an <strong>8B-total / 700M-active MoE</strong>
  trained <em>end-to-end on a full-stack AMD platform</em> &mdash; pretrain, midtrain,
  and SFT all on AMD Instinct MI300 GPUs with AMD networking and software. To Zyphra's
  knowledge this is the largest publicly released foundation model trained entirely on
  AMD silicon, and the companion paper documents the systems-level co-design.</p>

  <p>Reported benchmarks (with their <em>Markovian RSA</em> test-time compute method):
  <strong>91.9% AIME'25</strong>, <strong>89.6% HMMT'25</strong>. Zyphra claims it
  matches or exceeds DeepSeek-R1-0528 on math and coding despite having under 1B
  active parameters. <em>Not currently scored on Artificial Analysis &mdash;
  numbers above are self-reported from the technical report.</em></p>
