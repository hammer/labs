description: >
  <p>Zyphra's flagship architectural family. <strong>Zamba</strong> (May 2024)
  introduced a compact 7B hybrid combining a <strong>Mamba SSM backbone</strong>
  with a <em>single shared attention module</em>, capturing most of the benefit of
  attention at minimal parameter cost. <strong>Zamba2</strong> (November 2024)
  extends this to a 1.2B / 2.7B / 7.4B suite trained on up to 3T tokens, with
  several improvements: Mamba1 &rarr; Mamba2 backbone, two alternating shared
  attention blocks (instead of one) with LoRA projectors for depth specialization,
  and rotary position embeddings.</p>

  <p>Because attention is shared, Zamba2 stores KV caches only at the (~1:6)
  attention positions &mdash; <strong>~6x smaller KV footprint</strong> than a
  pure Transformer of similar quality, with correspondingly lower inference
  latency and memory cost. Open weights (Apache 2.0). <em>Note: not currently
  scored on Artificial Analysis; benchmark claims are self-reported.</em></p>
