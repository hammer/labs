description: >
  <p>Scientific foundation model for <strong>electroencephalography (EEG)</strong>:
  a 380M-parameter <em>masked diffusion autoencoder</em> trained on a harmonized
  corpus of <strong>208 public datasets</strong> spanning ~2 million channel-hours.
  Tokenizes multichannel EEG into short temporal windows and uses
  <strong>4D rotary positional encoding over (x,y,z,t)</strong> to inject
  spatiotemporal structure, allowing inference on arbitrary channel subsets and
  electrode positions.</p>

  <p>Performs masked channel infilling and EEG superresolution, with explicit
  cross-dataset / cross-electrode-layout generalization &mdash; the paper shows
  it can be applied directly to novel datasets and problems without retraining,
  outperforming spherical-spline interpolation and prior deep-learning methods.
  Open weights. A clear demonstration that Zyphra's hybrid-architecture toolkit
  extends beyond language into scientific domains.</p>
