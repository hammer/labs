description: >
  <p>hi lab's first vision-language model: a 1.2B-parameter
  <strong>NaViT vision encoder trained entirely from scratch</strong>
  (dynamic resolution, joint visual + text supervision) paired with a
  DeepSeek-V3 MoE language model. Near-SOTA open-source multimodal
  performance at release &mdash; MMMU 80.1, MathVision 69.6, DocVQA 96.5.
  MIT-licensed.</p>
