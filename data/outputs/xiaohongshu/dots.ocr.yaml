description: >
  <p>Compact 3B vision-language model that parses document layout, text,
  tables, and formulas in ~100 languages within a single model &mdash; a
  breakout open-source hit for hi lab, with ~9K GitHub stars, 1.3K+
  HuggingFace likes, and 275K+ downloads. Built on a 1.7B LLM with a
  vision encoder, MIT-licensed and adopted into serving frameworks like
  SGLang. Succeeded by <a href="/outputs/xiaohongshu/dots.mocr">dots.mocr</a>
  in March 2026.</p>
