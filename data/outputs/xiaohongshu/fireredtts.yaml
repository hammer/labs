description: >
  <p>LLM-empowered foundation text-to-speech system and the FireRed
  team's first open release, launched well before the dots family.
  FireRedTTS2 (September 2025, <a
  href="https://arxiv.org/abs/2509.02020">arXiv:2509.02020</a>) extended
  the line to long-form streaming TTS for multi-speaker dialogue
  generation. The TTS stack underpins FireRedChat, the team's
  self-hosted full-duplex voice interaction system.</p>
