description: >
  <p>2B-parameter continuous autoregressive text-to-speech foundation
  model that models speech in a continuous latent space (autoregressive +
  flow-matching), with zero-shot voice cloning. Released as a base model
  plus the post-trained "soar" variant, Apache-2.0 licensed, with a
  technical report.</p>
