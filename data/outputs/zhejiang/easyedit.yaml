description: >
  <p>The de-facto knowledge-editing framework for LLMs (~2.9K&#9733;,
  ACL 2024): ships the KnowEdit benchmark and implementations of most
  editing methods (ROME, MEMIT, and successors), making it the standard
  harness for the field. <strong>EasyEdit2</strong> (2025) extends the
  line into test-time behavior steering &mdash; safety, sentiment,
  persona &mdash; via activation steering vectors instead of weight
  edits. From ZJUNLP, led by
  <a href="/people/ningyu-zhang">Ningyu Zhang</a> and
  <a href="/people/huajun-chen">Huajun Chen</a>.</p>
