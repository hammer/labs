description: >
  <p>Real-time 4D view synthesis at 4K resolution (CVPR 2024) &mdash;
  the widely-cited seed (~1.8K&#9733;) of the zju3dv volumetric-video
  line from <a href="/people/xiaowei-zhou">Xiaowei Zhou</a>'s group at
  the State Key Lab of CAD&amp;CG. Successor
  <strong>FreeTimeGS</strong> (CVPR 2025) places free 4D Gaussian
  primitives at any time and place for real-time dynamic-scene
  reconstruction; siblings Street Gaussians and StreetCrafter carry the
  approach into driving-scene reconstruction.</p>
