description: >
  <p>7B/72B multimodal <strong>table-native</strong> LLM with a
  dedicated table encoder alongside the language backbone, built on
  Qwen2.5 bases. Extended by TableGPT-R1 (RL for tabular reasoning,
  Dec 2025) and the tablegpt-agent framework. Authored by Zhejiang
  University's Institute of Computing Innovation (Junbo Zhao et al.)
  &mdash; a ZJU-driven model, not an Alibaba release.</p>
tags:
