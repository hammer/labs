description: >
  <p>A SenseTime preview of a <strong>looped</strong> multimodal language
  model, released October 30, 2026 under Apache 2.0 for long-context and
  agentic work (text and images in, text out). Its 32 distinct decoder
  layers hold about 9B parameters, but the middle block of 24 layers (layers
  4&ndash;27) runs <strong>twice with shared weights</strong>, so each
  forward pass executes 56 layers, about 14.6B parameters' worth of compute,
  while storing only 32. Inside the loop, two residual streams are joined by
  <strong>manifold-constrained hyper-connections (mHC)</strong>: learned
  mappings, with the stream-mixing matrix Sinkhorn-normalized over 20
  iterations, decide how each layer reads from and writes back to the two
  streams. Attention is hybrid, three linear-attention layers to every
  full-attention layer, with loop boundaries aligned to those four-layer
  groups. Training sequences reach 262,144 tokens and include text, images,
  code and tool trajectories. The card does not say whether the decoder was
  pretrained from scratch. Its 248,320-token vocabulary and
  three-linear-to-one-full layout match Qwen3.5's.</p>

  <p>The card's benchmark chart covers agentic and office work (BIRD-Dev,
  WorkBuddy Bench, AIDABench, TeamBench, Terminal-Bench 2.1, T&sup3;-Banking,
  AutomationBench and SenseTime's own RaccoonPPTBench), and the showcase
  demos come from SenseTime's Raccoon Work agent. MTP speculative decoding
  shipped with the Preview, and the card said DSpark and DFlash2 draft heads
  were still training. The technical report and a Transformers
  implementation were listed as "TBD".</p>

  <p>The <strong>official SenseNova-Loop-9B</strong> followed on
  <strong>17 November 2026</strong>, with BF16 weights, a launch-day official
  AWQ 4-bit build and its MTP draft, and GGUF quantizations on 18 November.
  It keeps the 32-layer, 56-execution looped block and two-stream mHC (hidden
  size 4,096, FFN 12,288, 16 attention heads and 4 KV heads on the full-attention
  layers), and the README now says the training recipe extends context to
  <strong>512K tokens</strong>. SenseTime reports gains over the Preview on all
  seven benchmarks shown: AutomationBench 14.33 &rarr; <strong>36.67</strong>,
  Terminal-Bench 2.1 40.45 &rarr; <strong>59.55</strong>, GAIA 37.86 &rarr;
  <strong>69.90</strong>, and BIRD 71.38 &rarr; 72.34. Against Qwen3.8-27B it
  ties AutomationBench (36.67), edges AIDABench (65.31 vs 65.01) and trails
  NL2Repo (41.36 vs 44.60). A loop-scaling ablation, which holds the data
  fixed and varies the loop count from 1 to 4, finds the best results at three
  or four loops: LiveCodeBench v6 +8.10% and AIDABench visualization +8.55%
  relative to a single pass. The release keeps two loops for inference cost.
  With 4-bit weights and an 8-bit KV cache, the README estimates about 15 GiB
  of GPU memory at 256K context. The release BF16 weights are gated on
  HuggingFace. Still no technical report, and Artificial Analysis has not
  scored either checkpoint.</p>
