description: >
  <p>Long-context vision-language benchmark (NeurIPS 2025 spotlight;
  repo EdinburghNLP/MMLongBench): <strong>13,331 examples</strong>
  across 5 task categories at 8K&ndash;128K context lengths, with 46
  models evaluated at release. An adopted benchmark for long-context
  VLM evaluation, from Pasquale Minervini's group with external
  coauthors; Edinburgh-hosted.</p>
