    description: >
      <p>Document-aligned parallel corpus covering ~50 language pairs
      with hundreds of millions of aligned document pairs with quality
      scores, released CC0.</p>
    dataset:
      license: CC0
      huggingface_url: https://huggingface.co/HPLT/DocHPLT
