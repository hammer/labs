description: >
  <p>"The Sparse Frontier: Sparse Attention Trade-offs in Transformer
  LLMs" &mdash; the largest empirical study of training-free sparse
  attention (<strong>6 methods, contexts up to 128K</strong>), showing
  that large-sparse models beat small-dense ones on the compute Pareto
  frontier. Adopted as an evaluation framework by follow-on work.
  Edinburgh-led (Nawrot, <a
  href="/people/edoardo-m-ponti">Ponti</a>) with Cohere and Meta
  coauthors.</p>
