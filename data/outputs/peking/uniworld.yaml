description: >
  <p>PKU-YuanGroup's unified understanding+generation line:
  UniWorld-V1 (June 2025) builds joint visual understanding,
  generation, and editing on high-resolution semantic encoders;
  UniWorld-V2 / Edit-R1 (Oct 2025) adds RL post-training for image
  editing via diffusion negative-aware finetuning with implicit MLLM
  feedback. Fed by the group's ImgEdit unified image-editing
  dataset+benchmark (NeurIPS 2025 D&amp;B).</p>
