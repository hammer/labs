description: >
  <p>Muhan Zhang's group (Institute for AI): SVD-initialized LoRA
  (NeurIPS 2024) &mdash; initializing adapters with the principal
  singular values and vectors of the frozen weight matrices converges
  faster and outperforms vanilla LoRA at identical cost. Merged
  upstream into Hugging Face PEFT
  (<code>init_lora_weights="pissa"</code>), making it one of the few
  academic PEFT variants with default-library distribution.</p>
