  base_model: deepseek-r1
  license: Apache 2.0
paper:
  arxiv: "2503.04872"
notes: >
  The arXiv ID 2505.17320 sometimes cited for FairyR1 resolves to an
  unrelated TTS paper; the correct method paper is TinyR1
  (arXiv:2503.04872).
