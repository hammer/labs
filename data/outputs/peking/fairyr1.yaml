description: >
  <p>PKU-DS-LAB's (Tong Yang) branch-merge distillation applied to
  DeepSeek-R1-Distill-Qwen-32B: specialized math and code branches are
  trained separately, then merged, reaching roughly R1-671B-level AIME
  and LiveCodeBench scores at ~5% of the parameters (102 HF likes).
  The method paper is TinyR1-32B-Preview (joint with Qihoo360). The
  same lab followed with iFairy / Fairy2i, the first 2-bit
  complex-valued LLMs (weights in {&plusmn;1, &plusmn;i}).</p>
tags:
