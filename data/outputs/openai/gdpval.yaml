name: GDPval
slug: gdpval
lab: openai
type: eval
date: 2025-10-01
sources:
  - label: Paper (arXiv)
    url: https://arxiv.org/abs/2510.04374
  - label: HuggingFace (Gold Subset)
    url: https://huggingface.co/datasets/openai/gdpval
  - label: Artificial Analysis Leaderboard (GDPval-AA)
    url: https://artificialanalysis.ai/evaluations/gdpval-aa
description: >
  <p><strong>1,320 real-world professional tasks across 44 occupations</strong> in
  the 9 largest US GDP-contributing industries (real estate, government, manufacturing,
  healthcare, finance, etc.). Tasks produce actual deliverables: legal briefs, financial
  analyses, presentations, spreadsheets. Created by industry professionals averaging
  14 years of experience. Scored via blind pairwise comparison against human expert
  baselines. 220-task gold subset open-sourced.</p>

  <p>Carried the <strong>highest weight (20%) in AA Intelligence Index v4.1</strong> and
  keeps a 10% weight in v4.2 (via GDPval-AA v2, Artificial Analysis' independent re-evaluation using
  their Stirrup agentic harness). Represents a shift toward measuring economic value
  of AI capability rather than academic task performance. Inter-rater reliability is
  a known weakness (~66-71% agreement). By Patwardhan, Dias, Proehl et al.
  (OpenAI).</p>
tags:
  - benchmark
  - evaluation
  - agentic
paper:
  arxiv: "2510.04374"
eval:
  num_tasks: 1320
  domains:
    - real estate
    - manufacturing
    - professional/scientific/technical services
    - government
    - healthcare
    - finance & insurance
    - retail trade
    - wholesale trade
    - information
  scoring_method: blinded expert pairwise comparisons vs. human expert deliverables (win/tie rate) on
    the 220-task open-sourced gold subset; experimental automated grader (66% agreement with expert
    graders, vs. 71% human inter-rater agreement)
  used_in:
    - AA Intelligence Index v4.1 (as GDPval-AA v2, 20%)
    - AA Intelligence Index v4.2 (as GDPval-AA v2, 10%)
  leaderboard_url: https://artificialanalysis.ai/evaluations/gdpval-aa
