description: >
  <p>OpenAI's rubric-graded benchmarks for open-ended health conversations.
  <strong>HealthBench</strong> (May 2025) has <strong>5,000 multi-turn
  conversations</strong> with lay users and health professionals, graded
  against <strong>48,562 conversation-specific rubric criteria</strong>
  written by <strong>262 physicians</strong>. The conversations cover seven
  themes, from emergency referrals to global health, and each criterion is
  tagged with one of five axes: accuracy, completeness, communication quality,
  context awareness and instruction following. <strong>HealthBench
  Professional</strong> (arXiv April 2026, released with ChatGPT for
  Clinicians) is a smaller, harder companion: <strong>525 real clinician
  conversations</strong> in three use cases (care consult, writing and
  documentation, medical research). About a third are deliberate adversarial
  testing by physicians, and examples that were hard for OpenAI's own models
  were sampled at roughly 3.5x their rate in the 15,079-example pool. Both
  sets ship in OpenAI's open simple-evals repo.</p>

  <p>The original paper showed fast progress on OpenAI's own models: GPT-3.5
  Turbo 16%, GPT-4o 32%, o3 60%. It also released HealthBench Consensus (34
  physician-validated behaviours) and HealthBench Hard (top score 32% at
  release). In the Professional paper, <strong>GPT-5.4 inside ChatGPT for
  Clinicians scored 59.0 against 43.7 for physicians</strong> (specialist-matched,
  unlimited time, web access) and 48.1 for base GPT-5.4. That result is
  vendor-run, and the benchmark was sampled for difficulty against OpenAI's
  models.</p>

  <p><strong>Artificial Analysis added both as standalone evaluations on
  2026-10-19</strong> (not part of the Intelligence Index). AA reports OpenAI's
  length-adjusted score, which penalises replies over 2,000 characters, and
  uses OpenAI's graders: GPT-4.1 for HealthBench and GPT-5.4 (low) for
  Professional. On Professional, GPT-6 Astra (max) leads at
  <strong>66.0%</strong>, then GPT-6.1 Sol 65.1% and Claude Sonnet 5.5 63.0%.
  Claude Opus 5.5 has the highest raw score (71.4%) but falls to 59.9% after
  the length adjustment, because it averages about 5,900 characters per
  answer. On HealthBench, Claude Sonnet 5.5 leads at 62.1%, ahead of DeepSeek
  V4.1 Flash 60.9% and GPT-6.1 Sol 58.5%. Vendor launch tables now quote
  Professional often:
  <a href="/outputs/spacexai/grok-4.7">Grok 4.7</a> 56.7%,
  <a href="/outputs/meta/muse-wonder">Muse Wonder</a> 62.3 vs Opus 5.5 65.6,
  and <a href="/outputs/openai/gpt-6-astra">GPT-6 Astra</a> (claimed state of
  the art). Medical models such as
  <a href="/outputs/baichuan/baichuan-m2">Baichuan-M2</a> and
  <a href="/outputs/baichuan/baichuan-m3">Baichuan-M3</a> report the original
  set. The authors (Rahul Arora, Jason Wei, Karan Singhal and others) are
  OpenAI's health team, so the lab whose models top the Professional board
  also built the benchmark, chose its difficulty sampling and supplies its
  grader models.</p>
