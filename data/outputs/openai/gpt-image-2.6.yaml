date: 2026-11-04
sources:
  - label: Announcement (Introducing Images 2.6)
    url: https://openai.com/index/introducing-images-2-6
  - label: System Card (ChatGPT Images 2.6)
    url: https://deploymentsafety.openai.com/chatgpt-images-2-6
  - label: API reference (Sunburst)
