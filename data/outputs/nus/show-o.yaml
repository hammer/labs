description: >
  <p><strong>One single transformer unifying multimodal understanding and
  generation</strong> (ICLR 2025): Show-o mixes autoregressive text
  modeling with discrete-diffusion image generation in one model &mdash;
  one of the first credible academic demonstrations of the native unified
  multimodal architecture that frontier labs later pursued. 2.0K&#9733;,
  first in the Show-o series.</p>

  <p>From <a href="/people/mike-zheng-shou">Mike Zheng Shou</a>'s ShowLab
  at NUS, joint with <a href="/labs/bytedance-seed">ByteDance</a>,
  NUS-led. The initial model builds on a small pretrained LM backbone
  (Phi-1.5 class) with a unified discrete tokenizer; the successor
  <a href="/outputs/nus/show-o2">Show-o2</a> scales the recipe
  natively.</p>
