description: >
  <p><strong>Improved native unified multimodal models</strong> (NeurIPS
  2025): autoregressive modeling for text plus flow matching for visual
  generation, operating on a 3D-causal-VAE latent space with dual-path
  spatial(-temporal) fusion &mdash; extending unified understanding and
  generation to both images and video. Released as 1.5B and 7B
  checkpoints (with video-understanding variants) under ShowLab's
  HuggingFace org.</p>

  <p>Joint ShowLab (<a href="/people/mike-zheng-shou">Mike Zheng
  Shou</a>) / <a href="/labs/bytedance-seed">ByteDance</a> work, NUS-led
  &mdash; the scaled successor of
  <a href="/outputs/nus/show-o">Show-o</a>.</p>
