description: >
  <p>The large open-weights member of the Nemotron 3.5 line and the one that
  carries the architecture argument: <strong>120B total / 12B active</strong>
  in a <strong>Mamba-2 &ndash; Transformer hybrid MoE with 512 routed experts
  per MoE layer</strong>, over a <strong>1M-token context</strong>, taking
  text, images and video. The hybrid-SSM direction that
  <a href="/outputs/nvidia/nemotron-3.5-lightning">Nemotron 3.5 Lightning</a>
  ran at 30B/3B is here at four times the scale, with native
  <strong>Multi-Token Prediction</strong> for speculative decoding and
  configurable reasoning modes. The foundation corpus is over <strong>20
  trillion tokens</strong> across English, 19 further languages and 43
  programming languages, plus synthetic data from several stronger models.</p>

  <p>NVIDIA reports across 50-plus benchmarks; the representative set is
  <strong>GPQA-Diamond 89.52</strong>, LiveCodeBench v6 88.22, WMT24++ 84.80,
  MathVision 78.16, MMLU-ProX 76.91, <strong>SWE-bench Verified 71.10</strong>
  and SWE-bench Pro 51.78. Two of those deserve reading together: SWE-bench
  Verified at 71.10 is frontier-adjacent for an open model, while
  <strong>Video-MME v2 at 32.85</strong> is low for a model that lists video as
  a first-class input &mdash; the vision-language claim is much stronger on
  documents and stills than on video, and the published table says so.</p>

  <p>Released under <strong>OpenMDW-1.1</strong>, a genuine open licence rather
  than a revenue-gated one &mdash; a different posture from
  <a href="/outputs/meta/muse-spark-open">Muse Spark Open</a>, which shipped the
  same week under a bespoke licence with a $20M notification clause. Not yet
  scored by Artificial Analysis at filing; the Nemotron 3.5 family's only AA
  entry remains Lightning at 13.</p>
