description: >
  <p>"An Open Recipe for IMO Gold: Training Nemotron for Olympiad
  Mathematics." NVIDIA's Nemotron Labs released the full stack behind an
  ensemble that reached a <strong>gold-medal level score at the 2026
  International Mathematical Olympiad</strong>: two post-trained variants of
  <a href="/outputs/nvidia/nemotron-3-ultra">Nemotron 3 Ultra</a> (550B-A55B)
  specialized to solve hard problems and to find mistakes in proofs
  (Ultra-Math-SFT and Ultra-Math-RL), the Nemotron-Math-Proofs-v3 SFT and RL
  datasets, the Nemotron-IMO-Bench evaluation set, and the test-time-scaling
  recipe in NeMo-Skills. Weights and data ship under OpenMDW 1.1 for
  commercial and non-commercial use; the report posted to arXiv on
  September 9 (Ivan Moshkov, Stephen Ge et al.).</p>
