description: >
  <p>A compact 4B edge world model in the Cosmos 3 physical-AI family
  (two-tower Mixture-of-Transformers, Nemotron-based): on-device vision
  reasoning and robot-policy generation on Jetson, adaptable to a new
  robot in about a day. Extends the June Cosmos 3 launch toward edge
  robotics, with domain rollouts (surgical, neural reconstruction, DROID
  policy) alongside.</p>
