description: >
  <p>3B vision-language grounding model from NVIDIA's LPR group. Introduces
  <strong>Parallel Box Decoding</strong> &mdash; a non-autoregressive box-output
  head that improves throughput <strong>~2.5&times;</strong> over standard VLM
  detection while handling object detection, phrase grounding, GUI element
  grounding, and OCR in a single model.</p>

  <p>Trained on <strong>12M images / 785M boxes</strong>. Open weights; project
  page includes demos and benchmarks.</p>
