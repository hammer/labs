description: >
  <p>NVIDIA's physical-AI flagship, billed as the "world's first fully open
  omnimodel": a unified Mixture-of-Transformers combining autoregressive
  and diffusion generation across text, image, video, audio, and action,
  trained on ~20T multimodal tokens. Ships in Super and Nano variants with
  a "Cosmos Coalition" of robotics and simulation partners. Launched at GTC
  Taipei June 1 (backfilled); the technical report was revised through late
  June. The companion <strong>Cosmos3-DROID</strong> release repackages the
  DROID robot corpus in LeRobotDataset v3.0 format &mdash; 71,907 episodes /
  22M frames / 707GB under OpenMDW-1.1.</p>
