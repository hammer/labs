description: >
  <p>NVIDIA Labs <strong>tri-mode LLM</strong> family: at each step the model
  can run as <em>autoregressive</em>, <em>diffusion</em>, or
  <em>self-speculation</em>, with a learned controller picking the regime.
  Reports <strong>2.6&ndash;6.4&times; throughput</strong> over AR baselines
  while matching or beating Qwen3 accuracy on standard benchmarks.</p>

  <p>Three sizes (3B / 8B / 14B), each with Base, Instruct, and VL variants;
  eight model uploads total on May 23. Released under the Nemotron Open
  Model License.</p>

  <p><strong>NLD-Uni</strong> (paper October 27, 2026, with weights on
  HuggingFace and code at NVlabs) extends the line to a unified discrete
  diffusion LLM for both visual understanding and generation. Two changes
  carry it. A <em>cross-paradigm</em> on-policy distillation transfers
  understanding from autoregressive VLMs and image generation from
  continuous flow models into one diffusion LLM. A progressive
  self-refining diffusion process corrupts each token over several steps
  instead of jumping straight from a clean image token to a mask, which
  lets the model commit to a token at an intermediate step and refine it
  later. NVIDIA reports state-of-the-art results among unified diffusion LLMs
  on VQA, multimodal reasoning, grounding, text-to-image and image
  editing.</p>
