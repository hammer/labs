description: >
  <p>NVIDIA Labs <strong>tri-mode LLM</strong> family: at each step the model
  can run as <em>autoregressive</em>, <em>diffusion</em>, or
  <em>self-speculation</em>, with a learned controller picking the regime.
  Reports <strong>2.6&ndash;6.4&times; throughput</strong> over AR baselines
  while matching or beating Qwen3 accuracy on standard benchmarks.</p>

  <p>Three sizes (3B / 8B / 14B), each with Base, Instruct, and VL variants;
  eight model uploads total on May 23. Released under the Nemotron Open
  Model License.</p>

  <p><strong>NLD-Uni</strong> (paper October 27, 2026, with weights on
  HuggingFace and code at NVlabs) extends the line to a unified discrete
  diffusion LLM for both visual understanding and generation. Two changes
  carry it. A <em>cross-paradigm</em> on-policy distillation transfers
  understanding from autoregressive VLMs and image generation from
  continuous flow models into one diffusion LLM. A progressive
  self-refining diffusion process corrupts each token over several steps
  instead of jumping straight from a clean image token to a mask, which
  lets the model commit to a token at an intermediate step and refine it
  later. NVIDIA reports state-of-the-art results among unified diffusion LLMs
  on VQA, multimodal reasoning, grounding, text-to-image and image
  editing.</p>

  <p><strong>Nemotron-Labs-Sigma</strong> (paper October 2, 2026, arXiv
  2610.02665; v2 and the public weights November 12) is the
  <em>continuous</em>-diffusion sibling. NVIDIA calls it "the first family of
  large-scale (3B/8B) continuous dLMs": instead of masking tokens it denoises
  Gaussian-corrupted token embeddings in a learned 16-dimensional space,
  trained blockwise by likelihood on the same backbone, data and Mistral-NeMo
  tokenizer as NLD, so the families are parameter- and FLOP-matched. It is
  not from scratch: each model is warm-started from an in-house AR baseline
  pretrained on 1T tokens, then trained for over 300B tokens (about 9,600 and
  19,200 GB200 GPU-hours for 3B and 8B), with classifier-free guidance and
  score temperature at inference. The paper reports it beats masked-diffusion
  and AR baselines after pretraining on GSM8K, Minerva, HumanEval and MBPP,
  with the largest gains on coding. Phased distribution-matching distillation
  gives about 8&times; acceleration on math and 4&times; on coding with
  negligible accuracy loss, and the distilled-plus-drafter
  <code>Sigma-distill-spec</code> models decode up to 3.18&times; (3B) and
  4.20&times; (8B) faster than AR decoding. Base, instruct, distilled
  (NFE 2/4/8/16) and spec checkpoints are on HuggingFace under the Nemotron
  Open Model License; context is 4,096 tokens.</p>
