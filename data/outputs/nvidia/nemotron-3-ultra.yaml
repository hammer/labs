description: >
  <p>The largest model in the Nemotron 3 family (Nano / Super / Ultra),
  shipped on HuggingFace <strong>June 4, 2026</strong> after a Computex
  Taipei pre-announcement by Jensen Huang on June 1. <strong>550B total
  parameters with 55B active per token</strong> (~90% sparsity), trained
  on <strong>20T text tokens</strong> in <strong>NVFP4</strong> on
  Blackwell.</p>

  <p><strong>Architecture:</strong> hybrid <strong>Mamba-2 / Attention
  Mixture-of-Experts</strong> with <strong>LatentMoE</strong> (hardware-aware
  expert design with a 2,048-dim latent compression), <strong>108 total
  layers</strong>, <strong>512 experts per layer activated top-22</strong>,
  64 query / 2 KV heads (GQA), and <strong>Multi-Token Prediction (MTP)</strong>
  with 2 shared-weight heads for native speculative decoding. Context window
  <strong>1M tokens</strong> after a long-context extension phase. Post-trained
  with SFT + multi-environment RLVR + <strong>Multi-teacher On-Policy Distillation
  (MOPD)</strong>, with explicit reasoning-budget control.</p>

  <p><strong>Throughput:</strong> 5.9× / 4.8× / 1.6× higher inference throughput
  than GLM-5.1-754B-A40B, Kimi-K2.6-1T-A32B, and Qwen-3.5-397B-17B respectively
  on the 8K-input / 64K-output setting, at on-par accuracy across agentic and
  reasoning benchmarks. AA frames Ultra as the leading US open-weights model
  on its composite at launch.</p>

  <p><strong>Headline benchmarks (BF16, post-trained):</strong> MMLU-Pro 86.8,
  GPQA (no tools) 87.0, LiveCodeBench v6 89.0, SWE-Bench Verified 71.9,
  Terminal-Bench 2.1 56.4, RULER @ 1M 94.7, AA Intelligence Index v4.0
  <strong>= 48</strong> served at 300+ tokens/s.</p>

  <p><strong>Released as four checkpoints</strong> under the Linux Foundation
  <strong>OpenMDW-1.1</strong> license: <code>Base-BF16</code> (pretrained-only),
  <code>BF16</code> (post-trained), <code>NVFP4</code> (quantized for faster
  inference), and <code>GenRM</code> (the generative reward model used during
  RL). Distribution targets: HuggingFace, ModelScope, OpenRouter, and
  build.nvidia.com. The same release ships the Nemotron-Pretraining-Code-v3
  (173B tokens), Nemotron-Pretraining-Legal-v1,
  Nemotron-Pretraining-Specialized-v1.2, and Nemotron-Posttraining-v3 datasets,
  plus the Nemotron-RL-* training blends.</p>
