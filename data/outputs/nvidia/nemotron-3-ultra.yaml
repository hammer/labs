description: >
  <p>The largest member of the <a href="https://arxiv.org/abs/2512.20856">Nemotron
  3 family</a> (Nano / Super / Ultra), announced by Jensen Huang at Computex
  Taipei (June 1, 2026) and scheduled to ship on HuggingFace
  <strong>June 4, 2026</strong>. Per Artificial Analysis's launch coverage,
  Ultra is <strong>~550B total parameters with ~55B active per token</strong>
  (~90% sparsity); NVIDIA's December 2025 family debut press release had
  earlier stated "about 500 billion parameters and up to 50 billion active per
  token," so the published number tightened between announcement and launch.</p>

  <p><strong>Architecture</strong> (per the Nemotron 3 white paper):
  hybrid <strong>Mamba&ndash;Transformer Mixture-of-Experts</strong> with
  <strong>LatentMoE</strong> (a hardware-aware expert design that improves
  accuracy without sacrificing throughput), <strong>MTP layers</strong> for
  faster long-form generation, and <strong>NVFP4 training</strong> on
  Blackwell. Post-trained via multi-environment reinforcement learning with
  granular reasoning-budget control. Context window <strong>up to 1M
  tokens</strong>.</p>

  <p><strong>Headline benchmark:</strong> <strong>AA Intelligence Index v4.0
  = 48</strong>, served at <strong>300+ tokens/second</strong>. AA frames it
  as the leading US open-weights model on its composite at launch.</p>

  <p><strong>Status as of today:</strong> announced, white paper out, model
  weights not yet uploaded to HuggingFace (the
  <code>nvidia/NVIDIA-Nemotron-3-Ultra-*</code> repo slugs return 401 as of
  June 2); no per-model AA page is live yet either. NVIDIA's announced
  distribution targets are HuggingFace, ModelScope, OpenRouter, and
  build.nvidia.com.</p>
