description: >
  <p>NVIDIA's compact execution model for long-running agents, designed to
  handle high-volume tool calls, result validation, and specialized tasks
  after larger models perform planning. It has <strong>30B total / 3B active
  parameters</strong> in a hybrid <strong>Mamba-2 + Attention MoE</strong>:
  52 backbone layers interleave Mamba-2, attention, and MoE blocks with 128
  routed experts (top-6) plus one shared expert. <strong>Multi-Token Prediction
  (MTP)</strong> supplies an additional attention/MoE prediction layer and
  native speculative decoding.</p>

  <p>The model was pretrained from scratch by NVIDIA on <strong>more than 20T
  tokens</strong> using an NVFP4 recipe, then continued-pretrained for MTP,
  supervised fine-tuned, and post-trained with asynchronous multi-environment
  <strong>GRPO</strong> across math, code, science, instruction following,
  multi-step tool use, multi-turn conversation, and structured-output tasks.
  It supports up to a <strong>1M-token context</strong> and can deploy on one
  80GB H100 or A100; BF16 reference, NVFP4 inference, pretrained-base, and
  DSpark/DFlash speculative-drafter checkpoints shipped under
  <strong>OpenMDW-1.1</strong>.</p>

  <p>NVIDIA's reproducible release evaluation reports MMLU-Pro 81.94,
  GPQA Diamond 75.44, SWE-Bench Verified 51.56, Terminal-Bench 2.1 24.58,
  PinchBench 85.37, IFBench 71.88, and AA-LCR 52.0. NVIDIA positions Lightning
  below larger frontier planners but as a faster, customizable executor for
  always-on agent workflows, with reasoning enabled or disabled through its
  chat template.</p>
  <p>The <strong>technical report</strong> covering this model landed with the
  larger siblings on 2026-10-15, two months after the weights: <em>NVIDIA
  Nemotron 3.5 Super VL and Lightning Technical Report</em>. The line now spans
  <a href="/outputs/nvidia/nemotron-3.5-super-vl">Super VL</a> at 120B/12B and
  <a href="/outputs/nvidia/nemotron-3.5-bolt">Bolt</a> at 74B/9B, with
  Lightning the smallest at 30B/3B.</p>

  <p>The joint <strong>technical report</strong> for Lightning and Super
  (<a href="https://arxiv.org/abs/2610.38095">arXiv 2610.38095</a>, October
  28, 2026) describes both as built with large-scale distillation,
  long-context training and native speculative decoding. Super adds Indic
  continued pretraining, which NVIDIA says lifts Indian-language benchmarks by
  up to 9.82 points, and agentic software-engineering mid-training. Its
  post-training runs SFT, RLVR and RLHF plus specialized teachers and
  multi-teacher on-policy distillation, which is what turns the text-only base
  into a multimodal agent. The report gives Super <strong>51.78% on SWE-bench
  Pro</strong>, above Nemotron 3 Ultra with about 4.6&times; fewer active
  parameters. MTP boosting after post-training lengthens speculative-decoding
  acceptance by up to 21.8%, NVFP4 keeps a 99.62% median accuracy recovery
  against BF16, and serving reaches up to 4,856 output tokens/s per GB200 GPU
  at 50+ tokens/s per user.</p>

