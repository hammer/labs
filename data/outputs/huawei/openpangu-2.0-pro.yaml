description: >
  <p>Huawei's open-weight flagship: a <strong>~505B-total / ~18B-active
  MoE</strong> with 512K context, trained on ~34T tokens &mdash; claimed as
  the first ~500B-class model <strong>fully pretrained on Ascend 910B</strong>
  with no NVIDIA hardware anywhere in the run. Released under the OPENPANGU
  MODEL LICENSE 2.0 via GitCode and ModelArts (not HuggingFace). Continues
  the compute-sovereignty arc alongside GLM-5 (Ascend 910B) and DeepSeek-V4
  (Ascend 950PR).</p>

  <p>Huawei Cloud stopped selling the hosted version on 2026-11-06 and takes
  it offline on 2026-11-30, telling Pro customers to migrate to Zhipu's
  GLM-5.3 (<a href="https://www.ithome.com/1/021/526.htm">IT&#x4E4B;&#x5BB6;</a>,
  on a notice dated 2026-11-01). The GitCode weights remain available, and a
  successor <strong>openPangu-2.1-Pro</strong> appeared in Huawei's Xiaoyi
  Work app on 2026-11-05 with no specifications published.</p>

  <p><em>Active-parameter figure per the primary GitCode page (~18B); some
  press reports "180B active" &mdash; treat as an error.</em></p>
