description: >
  <p>Second-generation openPangu family, announced at Huawei Developer
  Conference 2026 (June 12) with weights arriving June 30: two MoE models,
  both with 512K context, trained and served on Ascend 910C-class hardware
  &mdash; <strong>Pro</strong> (505B total / 18B active) and
  <strong>Flash</strong> (92B total / 6B active, ~2x single-card throughput
  claim). Notably open for Huawei: from June 30 the team began progressively
  open-sourcing seven components including pre-training and post-training
  code and custom training operators. Flash weights (BF16) are on GitCode;
  Pro weight availability and the license name were not yet confirmed at
  sweep time.</p>

  <p>Huawei Cloud retired the hosted family four months later. A notice dated
  2026-11-01 stopped MaaS sales of both openPangu-2.0-Flash and
  openPangu-2.0-Pro on <strong>2026-11-06</strong> and takes them fully
  offline on <strong>2026-11-30</strong>, after which existing customers can
  no longer call them; the migration guidance points Flash users at
  DeepSeek-V4.1-Flash-1017 and Pro users at Zhipu's GLM-5.3 rather than at
  another Pangu model (<a href="https://www.ithome.com/1/021/526.htm">IT&#x4E4B;&#x5BB6;</a>).
  Huawei says new openPangu versions are planned; a flagship
  <strong>openPangu-2.1-Pro</strong> surfaced in Huawei's Xiaoyi Work app on
  2026-11-05 and is reported for a MaaS update on 2026-11-15, with no specs
  published. The open weights on GitCode are unaffected by the hosted
  retirement.</p>
