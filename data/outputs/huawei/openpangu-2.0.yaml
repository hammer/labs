description: >
  <p>Second-generation openPangu family, announced at Huawei Developer
  Conference 2026 (June 12) with weights arriving June 30: two MoE models,
  both with 512K context, trained and served on Ascend 910C-class hardware
  &mdash; <strong>Pro</strong> (505B total / 18B active) and
  <strong>Flash</strong> (92B total / 6B active, ~2x single-card throughput
  claim). Notably open for Huawei: from June 30 the team began progressively
  open-sourcing seven components including pre-training and post-training
  code and custom training operators. Flash weights (BF16) are on GitCode;
  Pro weight availability and the license name were not yet confirmed at
  sweep time.</p>
