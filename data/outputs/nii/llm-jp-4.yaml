description: >
  <p>Latest generation with MoE and "thinking" variants. 32B/3.8B
  active MoE (128 routed experts, top-8, 32 layers, 2560 hidden, 40
  heads). 65K context. Trained on <strong>11.7T tokens</strong> with
  llm-jp-tokenizer v4.0. Apache 2.0.</p>

  <p>Also includes dense 8B (9B params) with base and thinking
  variants. MT-Bench JA: 7.57-7.82, MT-Bench EN: 7.70-7.86.
  Evaluated using GPT-5.4 as judge. Built by the NII LLM Research
  Center, which UCL's <a href="/people/pontus-stenetorp">Pontus
  Stenetorp</a> co-leads &mdash; joint NII/UCL attribution. A dense
  <strong>33B</strong> (64 layers, hidden size 5,120) joined the series in
  August 2026, trained on the same 11.7T-token pre- and mid-training
  pipeline.</p>

  <p><strong>LLM-jp-4.1</strong> (thinking models for all three sizes on
  HuggingFace September 15&ndash;16, 2026; technical blog September 28)
  redoes only the post-training. The SFT set grows to about 12B tokens,
  trained for three epochs (~35B tokens, about three times LLM-jp-4's), with
  far more STEM data whose reasoning and answers were regenerated by
  gpt-oss-120b, and adds the series' first <strong>tool calling</strong>
  (NVIDIA Nemotron agentic data plus a Japanese translation); DPO follows,
  with no RL. Average scores rise over LLM-jp-4 at every size, mostly in math,
  science and instruction following, and safety (AnswerCarefully) improves
  while MT-Bench stays flat or dips as answers get shorter. On NII's averages
  the 33B thinking model beats Olmo-3.1-32B-Think and Qwen3-32B and roughly
  matches gpt-oss-120b, but trails Qwen3.8-27B, Gemma-4-31B-it and
  Muse-Glimmer-30B. The SFT and DPO data are released alongside the Apache
  2.0 weights; the 33B SFT run took about 67 hours on 16 nodes of 8&times;H200.</p>
