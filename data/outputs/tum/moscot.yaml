description: >
  <p>moscot (multi-omics single-cell optimal transport) is an
  <strong>optimal-transport framework</strong> for mapping cells through time and
  space, scaling OT to <strong>millions of cells</strong> with multimodal support.
  As a headline demonstration it reconstructed a <strong>1.7M-cell mouse-embryo
  developmental trajectory across 20 timepoints</strong>.</p>

  <p>From Fabian Theis's group (<em>joint&rarr;Helmholtz Munich + Hebrew University
  (Nitzan) + Apple ML Research</em>); published in <strong>Nature</strong> (2025).</p>
