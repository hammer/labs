description: >
  <p>OneProt is a <strong>multimodal protein foundation model</strong> that aligns
  protein <strong>sequence, structure, binding-site and text</strong> modalities in
  a shared latent space via an ImageBind-style alignment (a frozen sequence encoder
  anchoring the other modalities). It supports retrieval and cross-modal transfer
  across protein representations without retraining per task.</p>

  <p>From the Theis group's Helmholtz AI "PROFOUND" effort
  (<em>joint&rarr;Helmholtz Munich</em>); published in <strong>PLOS Computational
  Biology</strong> (2025).</p>
