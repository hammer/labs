description: >
  <p>GaussianAvatars builds <strong>photorealistic, fully controllable head
  avatars</strong> by rigging <strong>3D Gaussians</strong> to a parametric face
  mesh (FLAME), so expression, pose and viewpoint can be animated with high
  fidelity from monocular video. From Matthias Nie&szlig;ner's lab;
  <strong>CVPR 2024 Highlight</strong> (preprint Dec 2023). The follow-up GASP
  (arXiv:2412.07739) adds synthetic priors for head-avatar generation.</p>
