description: >
  <p>Ant Group's Venus Team second-generation GUI agent: one closed-loop
  model for mobile, web, and desktop, post-trained on
  <a href="/outputs/alibaba/qwen3.5">Qwen3.5-9B</a> through a three-stage
  pipeline of multimodal mid-training, offline step-level RL per domain, and
  multi-teacher on-policy distillation, aimed at the gap between
  benchmark-tuned agents and dependable real-world use (environment
  coverage, task construction, reward verification). The report cites an
  OSHarm attack success rate of 11.3% against 25.3% for the base model. The
  report posted August 27, 2026 and the 9B weights on September 2 in the
  UI-Venus repository (1,040 stars, active since August 2025; the first
  UI-Venus is not tracked here). Filed late.</p>
