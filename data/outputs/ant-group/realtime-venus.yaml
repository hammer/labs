model:
  architecture: dense
  # Derivative: both checkpoints are adapted from OpenBMB's MiniCPM-o 4.5
  # (paper sec. 4; HF card "Base architecture: MiniCPM-o 4.5 / Omni-Flow";
  # Audio config.json declares MiniCPMO, version 4.5). No `parameters` set.
  base_model: minicpm-o4.5
  context_window: 40960
  license: Apache 2.0
  benchmark_scores:
    - benchmark: StreamingBench
      score: "70.2%"
      mode: Realtime-Venus-Omni
    - benchmark: OVO-Bench
      score: "64.7%"
      mode: Realtime-Venus-Omni
    - benchmark: Daily-Omni
      score: "81.3%"
      mode: Realtime-Venus-Omni
    - benchmark: MMAU
      score: "78.0%"
      mode: Realtime-Venus-Audio
    - benchmark: MMAU-Pro
      score: "63.2%"
      mode: Realtime-Venus-Audio
    - benchmark: Full-Duplex-Bench v3 (tool selection F1)
      score: "86.0%"
      mode: Realtime-Venus-Omni
  variants:
    - name: Realtime-Venus-Omni
      notes: "9B; audio-visual full-duplex frontend; adapted from MiniCPM-o 4.5 (Qwen3-8B language backbone)"
    - name: Realtime-Venus-Audio
      notes: "9B; audio-only full-duplex frontend; adapted from MiniCPM-o 4.5 (Qwen3-8B language backbone)"
