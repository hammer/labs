  - name: SingGuard-NSFA models
    type: model
    date: 2026-07-10
    sources:
      - label: HuggingFace
        url: https://huggingface.co/inclusionAI/SingGuard-NSFA-9B
    model:
      base_model: qwen3.5
      license: Apache 2.0
      variants:
        - name: SingGuard-NSFA-0.8B
          parameters: 0.8B
        - name: SingGuard-NSFA-2B
          parameters: 2B
        - name: SingGuard-NSFA-4B
          parameters: 4B
        - name: SingGuard-NSFA-9B
          parameters: 9B
  - name: NSFA_Benchmarks
    type: dataset
    date: 2026-07-13
    sources:
