name: LLaDA2.2-flash
slug: llada2.2-flash
lab: ant-group
type: model
date: 2026-07-22
sources:
  - label: HuggingFace
    url: https://huggingface.co/inclusionAI/LLaDA2.2-flash
  - label: HuggingFace (LLaDA2.2-mini)
    url: https://huggingface.co/inclusionAI/LLaDA2.2-mini
  - label: Technical Report (PDF)
    url: https://github.com/inclusionAI/LLaDA2.X/blob/main/LLaDA2_2_tech_report.pdf
description: >
  <p>The first <strong>agentic diffusion language model</strong> in Ant's
  LLaDA2 line: Levenshtein-style editing with DELETE/INSERT tokens, 128K
  context via Block Routing, and L-EBPO agentic RL. SWE-bench Verified
  49.28 under a Claude Code scaffold at ~519 tokens/sec &mdash; roughly
  1.7&times; its autoregressive sibling's speed.</p>
tags:
  - open-weight
  - agents
  - efficiency
  - research
model:
  context_window: 128000
  variants:
    - name: LLaDA2.2-flash
      parameters: 100B
      notes: "Jul 22 2026; the file's anchor"
    - name: LLaDA2.2-mini
      parameters: 16B
      active_parameters: 1.4B
      notes: "Sep 5 2026; lightweight variant on the LLaDA2.0-mini architecture with the same Levenshtein editing, Block Routing 128K context, and L-EBPO agentic RL; 256 experts, 8 active; Apache 2.0"
