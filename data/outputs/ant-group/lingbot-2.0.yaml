description: >
  <p>A coordinated embodied-AI stack release from Ant Group's Robbyant
  unit (HF org <code>robbyant</code>), July 6&ndash;8: four model lines
  covering the perception&rarr;world-model&rarr;action pipeline.
  <strong>LingBot-Vision</strong>: self-supervised ViT family to ~1B with
  masked-boundary-modeling for dense spatial perception (Apache-2.0;
  report pending). <strong>LingBot-World 2.0 "Infinity"</strong>: a 14B
  causal interactive world model at 720p/60fps with unbounded horizon
  (CC-BY-NC-SA). <strong>LingBot-Video</strong>: embodied video-generation
  FMs (MoE 30B-A3B + 1.3B dense) with a published paper, "Scaling
  Mixture-of-Experts Video Pretraining for Embodied Intelligence."
  <strong>LingBot-VLA 2.0</strong>: a 6B vision-language-action model.
  Several component reports are still "coming soon" &mdash; only the
  Video paper is on arXiv at filing time.</p>
