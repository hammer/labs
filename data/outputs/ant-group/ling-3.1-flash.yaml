description: >
  <p>inclusionAI's newest Ling, and a reminder that "flash" has stopped meaning
  small. It is a hybrid-reasoning MoE with <strong>560B total parameters and
  25B active</strong>. Two months earlier <a
  href="/outputs/ant-group/ling-3.0">Ling 3.0</a> carried the same tier name
  at 124B total and 5.1B active, so this is roughly <strong>4.5&times; the
  total parameters and 5&times; the active</strong>. Artificial Analysis
  scores it <strong>41</strong> on Intelligence Index v4.3.2 against Ling
  3.0's 20, a doubling of measured intelligence inside a single minor version
  number. The API lists $0.30 in / $0.90 out per million tokens. Ant positions
  it for agent workloads, search, office software and vertical
  applications.</p>

  <p>It launched on <strong>September 30, 2026</strong> as a two-week free
  API trial, served on OpenRouter by Novita, with nothing published by
  inclusionAI itself. The weights followed on <strong>October 13</strong> on
  HuggingFace and ModelScope under the <strong>MIT license</strong>. The FP8
  checkpoint uses e4m3 weights in 128&times;128 blocks and includes one MTP
  (NEXTN) layer for speculative decoding. The model card describes a
  <strong>hybrid-linear MoE</strong>: <strong>63 <a href="/outputs/moonshot-ai/kimi-linear">KDA</a> (Kimi Delta Attention)
  linear-attention layers and 9 gated MLA layers</strong> in a 7:1 ratio
  across 72 layers, the first 4 dense, then 512 routed experts plus one
  shared expert with 8 active per token. Hidden size is 4096, with 64 heads
  and a 157,184-token vocabulary. The card says it "builds upon
  Ling-3.0-flash with improvements in architecture", but at 4.5&times; the
  size it cannot be a simple continuation of that checkpoint, and inclusionAI
  does not say how the two relate. The EU AI Act training-content summary
  lists no model dependencies, more than 10T text tokens of public, licensed,
  synthetic and human-written data, and a data cutoff of about July 2026. It
  gives no exact token count, hardware or recipe. There is still no technical
  report.</p>

  <p><strong>Context length is where the claims need reading
  carefully.</strong> The card advertises a "1M-token context window", but
  config.json sets <code>max_position_embeddings</code> to
  <strong>262,144</strong>, and the trial API served 256K. The SGLang
  cookbook explains the gap: 262,144 is the native context, and 1,048,576 is
  reached by a 4&times; YaRN RoPE override. SGLang reports verifying this on
  H200 and GB300 with exact retrieval of a fact planted at token 700K of a
  900K prompt, and recommends enabling it only beyond 256K. The structured
  field below records the native figure. The card's benchmark results
  (Terminal-Bench 4.0, SWE-bench Pro, FrontierSWE, GDPVal-AA v2.1,
  HealthBench Professional, MCP-Atlas and others) are published only as
  images, so the AA score is still the main number that can be checked
  independently. The card also introduces <strong>LingCode</strong>, a
  long-horizon coding harness built on the open-source Pi agent, which
  inclusionAI is "considering open-sourcing".</p>

  <p>A second checkpoint, <strong>Ling-3.1-flash-1019</strong>, appeared on
  Artificial Analysis on October 22. AA scored it 44 on v4.3.2, three points
  above the open release, and <strong>29</strong> on <strong>v5.0</strong>
  (October 27; AA had not yet rescored the open release), at the same price and with a
  1,048,576-token context. It was first served only through inclusionAI's API
  (release slug <code>ling-3-1-flash-rc5</code>), and its MIT weights
  followed on HuggingFace on October 27, two days after a
  Ling-3.1-flash-base checkpoint. It has its own entry as <a
  href="/outputs/ant-group/ling-3.1-flash-1019">Ling-3.1-flash-1019</a>; the
  top-level score here stays on the original checkpoint this file names.</p>
