description: >
  <p>xAI's dedicated <strong>agentic coding model</strong> &mdash; "the same
  model that powers <a href="/outputs/spacexai/grok-build">Grok Build</a>",
  the terminal coding agent xAI launched in beta on May 14, 2026 and
  open-sourced in July. Served as <code>grok-build-0.1</code>, it is
  "specifically trained for agentic coding tasks, including web development,
  debugging, and MCP support", accepts text and image input, supports
  function calling, structured outputs and reasoning, and has a
  <strong>256K-token context window</strong>. xAI says it is "served at a
  blazing-fast 100+ tokens/second" and "performs best in agentic harness like
  Grok Build, Cursor, Hermes Agent, OpenClaw, Kilo Code, or OpenCode". It
  appeared on OpenRouter on May 20 and entered public beta on the xAI API on
  May 29 at <strong>$1 / $2 per million input / output tokens</strong>
  ($0.20 cached; doubled above 200K-token prompts). Parameter count,
  architecture and training data are undisclosed; weights are
  proprietary.</p>

  <p>The xAI docs list <code>grok-code-fast-1</code>, <code>grok-code-fast</code>
  and <code>grok-code-fast-1-0825</code> as aliases, so it succeeds and
  replaces the August 2025 Grok Code Fast 1 (15 on the AA Intelligence
  Index v4.2). Artificial Analysis scores the June 16, 2026 snapshot
  ("Grok Build 0.1 0616") at <strong>32 on the Intelligence Index v4.2</strong> (41 on v4.1.1, where it ranked #65 of 187), characterizing it as above-average
  intelligence and well priced but "notably slow and very verbose" in its
  measurements (50 tokens/s output, 0.5 s to first token); xAI publishes no
  benchmark scores for it. Not to be confused with the Grok Build harness
  entry, which tracks the Apache-2.0 Rust agent itself.</p>
