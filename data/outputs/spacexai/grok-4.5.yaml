description: >
  <p>SpaceXAI's first model since the IPO, the Cursor acquisition, and the
  July rebrand &mdash; and its first <strong>built with Cursor</strong>.
  Pitched by Musk as "an Opus-class model, but faster, more token-efficient
  and lower cost," aimed at coding and agentic knowledge work: it builds
  complex Excel models with live web research and produces diagrams and
  slide content, with finance and legal capabilities co-developed with
  Cursor. Reportedly the first model shipped on the ground-up "V9"
  foundation stack, with V9-based variants planned on a monthly cadence.
  500K context; $2/$6 per million input/output tokens ($0.50 cache hits).
  Available in Grok Build, Cursor (all plans), and the SpaceXAI console;
  not yet available in the EU. Proprietary. AA Intelligence Index
  <strong>45</strong> (v4.2, "high" reasoning) &mdash; #4 overall at
  release on v4.1.1, up from Grok 4.3's 29.</p>
