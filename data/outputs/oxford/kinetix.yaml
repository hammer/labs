description: >
  <p>Kinetix (ICLR 2025 <strong>Oral</strong>): an open-ended space of 2D
  physics-based control tasks for training general agents &mdash; the
  flagship FLAIR open-endedness result. Agents pretrained across
  procedurally generated Kinetix levels transfer zero-shot to unseen
  handmade tasks, demonstrating open-ended task spaces as a route to general
  control. From <a href="/people/jakob-foerster">Foerster</a>'s FLAIROx.</p>
