description: >
  <p>A harder version of MMMU, the college-level multimodal benchmark (11.5K
  questions, 30 subjects in six disciplines). Users reported that text-only
  LLMs could answer some MMMU questions without looking at the image.
  <strong>MMMU-Pro</strong> fixes this in three steps. It
  <strong>removes questions that text-only LLMs can answer</strong>, it
  <strong>expands the options from 4 to up to 10</strong> to cut guessing, and
  it adds a <strong>vision-only setting</strong> in which the question and
  options are inside a screenshot or photo, so the model has to read and see
  at once. The result is <strong>1,730 questions</strong>, each in standard
  format and as an image (3,460 items). The headline score is the average of
  the 10-option standard setting and the vision setting.</p>

  <p>Scores fell sharply from MMMU: models lost <strong>16.8 to 26.9
  points</strong>. GPT-4o (0513) dropped from 69.1 on MMMU validation to 54.0
  (standard, 10 options) and 49.7 (vision). OCR prompts made little
  difference, and chain-of-thought generally helped. The paper was published
  at ACL 2025 (main) and is the standard multimodal row in launch tables
  (e.g. <a href="/outputs/google/gemma-4-12b">Gemma 4</a>,
  <a href="/outputs/meta/muse-glimmer">Muse Glimmer</a>,
  <a href="/outputs/cohere/command-a-plus">Command A+</a> and
  <a href="/outputs/shanghai-ai-lab/intern-s2-preview">Intern-S2</a>).
  <strong>Artificial Analysis runs it as an additional evaluation</strong>
  outside the Intelligence Index, on the 1,730-question 10-option set, single
  pass with regex extraction. The top AA scores are now in the high 80s:
  Claude Opus 5.5 (max) 87.7%, GPT-6 Astra (max) 86.9%, GPT-6.1 Sol (max)
  86.0%.</p>

  <p>The paper is credited to the "MMMU Team" and lists no institutions. It is
  filed under CMU because the corresponding author, Xiang Yue
  (xyue2@andrew.cmu.edu), and the senior author,
  <a href="/people/graham-neubig">Graham Neubig</a>, are at CMU. The other
  authors include the original MMMU group at Ohio State (Huan Sun, Yu Su) and
  Waterloo (Wenhu Chen), which are not tracked. The original MMMU (2023) was
  led by Ohio State and is not filed separately. The GitHub repo is Apache
  2.0.</p>
