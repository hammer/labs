description: >
  <p>The first mixture-of-experts models in the SEA-LION family, built with
  NVIDIA on the Nemotron 3 hybrid Mamba-2 architecture and released under MIT
  with base and post-trained checkpoints plus FP8, NVFP4, and GGUF builds.
  <strong>Nemotron-SEA-LION-v4.8-120B-A12B</strong> starts from <a
  href="/outputs/nvidia/nemotron-3-super">Nemotron 3 Super</a> (88 layers, 512
  routed experts with 22 active plus a shared expert, multi-token prediction)
  and <strong>30B-A3B</strong> from <a
  href="/outputs/nvidia/nemotron-3-nano">Nemotron 3 Nano</a> (128 experts, 6
  active). The 30B received continued pretraining on <strong>150B tokens</strong>
  of Southeast Asian instruction, reasoning, code, and parallel data in NeMo
  Megatron Bridge; the 120B on 33.5B tokens in NeMo AutoModel; both keep the
  Nemotron tokenizer and the 1M-token pretraining context, with post-training
  run at 128K and the cards stating a 262,144-token context. Post-training
  combines supervised fine-tuning with <strong>online on-policy
  distillation</strong> from an FP8 <a
  href="/outputs/nvidia/nemotron-3-ultra">Nemotron 3 Ultra 550B-A55B</a>
  teacher, followed by merging with <a
  href="/outputs/nvidia/nemotron-3.5-lightning">Nemotron 3.5 Lightning</a> (30B)
  or Nemotron 3 Super (120B). The CPT corpus weights Indonesian, Malay, Burmese,
  Tamil, and Vietnamese instruction data, parallel data across eleven regional
  languages down to Javanese and Sundanese, and Thai medical reasoning.</p>

  <p>On SEA-HELM the 120B rises from Nemotron 3 Super's 49.30 to
  <strong>63.44</strong> overall and the 30B from Nemotron 3.5 Lightning's 46.06
  (Nano's 46.89) to <strong>51.57</strong>; the largest moves are in the languages
  the base models handled worst, Burmese 4.98 to 31.35 and Tamil 21.83 to 56.35
  at 120B. The 48-author report (16 September 2026) also documents where the
  adapted models remain no better than their Nemotron parents, and the SEA-HELM
  scores are point estimates from the lab's own leaderboard. Not scored on
  Artificial Analysis.</p>
