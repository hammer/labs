description: >
  <p>Liquid AI's 2026 on-device generation, built on the <a
  href="/outputs/liquid-ai/lfm2">LFM2</a> hybrid backbone (double-gated short
  convolution blocks interleaved with grouped-query attention) and rolled out
  as a series of releases from January to August 2026. LFM2.5 is a
  <strong>continued-pretraining + RL refresh of the LFM2 checkpoints</strong>
  rather than a new pretrain: the 1.2B and 350M extend LFM2's 10T-token budget
  to 28T, the 8B-A1B MoE goes from 12T to 38T, and the 2.6B to 34T; the
  vocabulary was doubled to 128K by extending the existing BPE merges in place
  ("rather than retraining the model from scratch") followed by embedding-only
  and then full-model continued pretraining. Every text release then gets
  large-scale multi-stage RL. Weights ship under the
  <strong>LFM Open License v1.0</strong> (Liquid's Apache-derived open-weight
  license), with GGUF / MLX / ONNX exports and day-one llama.cpp, vLLM, SGLang
  and LEAP support.</p>

  <p>Members: <strong>LFM2.5-1.2B</strong> Base / Instruct / Thinking / JP
  (Jan 2026, 32K context, 65K vocab), <strong>LFM2.5-VL-1.6B</strong> and
  <strong>LFM2.5-Audio-1.5B</strong> (Jan; native speech I/O with an 8&times;
  faster LFM-based audio detokenizer), <strong>LFM2.5-350M</strong> (Mar),
  <strong>LFM2.5-VL-450M</strong> (Apr), <strong>LFM2.5-8B-A1B</strong> (May;
  8.3B total / 1.5B active, 32 experts &times; top-4, 18 conv + 6 GQA layers,
  128K context, reasoning-only with explicit CoT, plus an avg@k abstention
  reward that cut the AA-Omniscience hallucination penalty from &minus;78 to
  &minus;25), <strong>LFM2.5-230M</strong> (Jun; 19T tokens, smallest LFM),
  Embedding/ColBERT-350M retrievers and Encoder-230M/350M bidirectional
  encoders (Jun&ndash;Jul), <strong>LFM2.5-2.6B</strong> (Aug; 22 conv + 8 GQA
  layers, 128K context, four-stage agentic post-training &mdash; SFT, teacher
  specialization, multi-domain on-policy distillation, agentic GRPO inside
  Hermes Agent / OpenClaw harnesses via verl + SGLang), <strong>LFM2.5-VL-3B</strong>
  (Aug; 2.6B backbone + SigLIP2 NaFlex 400M), and <strong>DSpark</strong>
  speculative-decoding drafters (Aug; 296&ndash;328M, up to 3.2&times; decode
  speedup, upstreamed to llama.cpp and SGLang).</p>

  <p>LFM2.5-8B-A1B: IFEval 91.84, IFBench 56.47, Multi-IF 79.93, AIME25 42.53,
  BFCL v3 64.36 / v4 48.50, &tau;&sup2;-Telecom 88.07 &mdash; +12 to +74 points
  over LFM2-8B-A1B. LFM2.5-2.6B: AIME25 51.87, LiveCodeBench v6 59.41, IFBench
  59.17, BFCL v4 56.88, ToolSandbox 77.83, beating Gemma-4-E4B and matching
  Qwen3.5-4B at 220 tok/s on an M5 Max. AA Intelligence Index v4.1.1:
  <strong>8</strong> (8B-A1B), 11 (2.6B), 2 (1.2B-Instruct / Thinking) &mdash;
  all above LFM2-24B-A2B's 5.</p>
