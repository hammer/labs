name: LFM2 (Liquid Foundation Models 2)
slug: lfm2
lab: liquid-ai
type: model
date: 2025-11-28
flagship: true
sources:
  - label: Paper (arXiv)
    url: https://arxiv.org/abs/2511.23404
  - label: HuggingFace
    url: https://huggingface.co/LiquidAI
  - label: OpenRouter
    url: https://openrouter.ai/liquid/lfm2-24b-a2b
  - label: Artificial Analysis
    url: https://artificialanalysis.ai/models/lfm2-24b-a2b
description: >
  <p>Efficient foundation models using a hybrid backbone combining <strong>gated short
  convolutions with grouped query attention</strong>. 350M to 24B parameters (MoE,
  2.3B active). Optimized for edge and on-device deployment.</p>

  <p>LFM2-24B achieves 239 tok/s (#3 speed ranking on AA). Also includes vision-language
  (LFM2.5-VL), speech, and pharmaceutical variants (with Insilico Medicine). AA
  Intelligence Index: <strong>5</strong> (24B). Apache 2.0.</p>
tags:
  - open-weight
  - on-device
  - moe
