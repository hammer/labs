description: >
  <p>The <strong>first open "medical o1"</strong> &mdash; complex
  reasoning for medicine via a two-stage recipe: construct verifiable
  medical problems from exam questions, learn complex reasoning trajectories
  through a medical verifier, then RL against verifier rewards. With only
  40K verifiable problems it outperformed general and prior medical
  baselines, and the verifiable-medical-problems + verifier-RL recipe
  became the heavily cited template for domain reasoning models.</p>

  <p>From <a href="/people/benyou-wang">Benyou Wang</a>'s
  FreedomIntelligence group (<strong>CUHK-Shenzhen</strong>). Models are
  RL-tuned open bases (Llama-3.1 8B/70B and Qwen2.5 7B/72B), not
  from-scratch pretrains. The line continues in
  <a href="/outputs/cuhk/huatuogpt-3">HuatuoGPT-3</a>.</p>
