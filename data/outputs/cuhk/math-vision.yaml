description: >
  <p><strong>Standard multimodal math-reasoning benchmark</strong>
  (NeurIPS 2024): 3,040 competition-sourced mathematical problems with
  visual contexts, spanning 16 mathematical disciplines across 5
  difficulty levels &mdash; built to fix the subject/diversity limits of
  MathVista. It exposed a wide gap between LMMs and humans at release and
  became a fixture in frontier VLM model cards (Gemini, Qwen-VL, InternVL
  releases all report MATH-V).</p>

  <p>Pre-window arXiv date, listed for in-window adoption; from
  <a href="/people/hongsheng-li">Hongsheng Li</a>'s MMLab-CUHK / MathLLM
  group.</p>
