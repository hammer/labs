description: >
  <p><strong>Website-generation-from-scratch benchmark for coding
  agents</strong>: 101 natural-language instructions for building
  interactive, functional websites, graded by 647 UI-agent-executed test
  cases &mdash; the agent actually operates the generated site rather than
  string-matching its code. Frontier agents scored well under half of
  tests passed at release, and the benchmark spawned the WebGen-Agent
  follow-up line.</p>

  <p>From Zimu Lu and <a href="/people/hongsheng-li">Hongsheng Li</a>
  (MMLab-CUHK), sibling to the group's
  <a href="/outputs/cuhk/mathcoder2">MathCoder2</a> math line.</p>
