description: >
  <p>Third-generation medical LLM from
  <a href="/people/benyou-wang">Benyou Wang</a>'s FreedomIntelligence
  group (<strong>CUHK-Shenzhen</strong>): <strong>RL-only domain
  adaptation directly from base models</strong> via off-policy seeding
  ("SeedRL"), skipping the SFT stage that
  <a href="/outputs/cuhk/huatuogpt-o1">HuatuoGPT-o1</a> still used.
  Released as 8B and 32B checkpoints plus a 7B variant on a Pangu base
  (HuatuoGPT-3-7B-Pangu).</p>

  <p>HuggingFace-first release &mdash; the technical report was still
  "coming soon" as of mid-2026; details beyond the model cards remain
  undisclosed, and the entry joins the paper-backfill work-list.
  Derivatives of open bases, not from-scratch pretrains.</p>
