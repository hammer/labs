description: >
  <p><strong>From-scratch reproduction of the full DeepSeek-R1
  pipeline</strong> at small scale &mdash; pretraining, SFT, and RL &mdash;
  replicating the DeepSeek architecture stack: Multi-head Latent Attention
  (MLA), auxiliary-loss-free load balancing, and Multi-Token Prediction.
  Ships 0.5B and 3.3B base models with intermediate checkpoints, training
  code, and data recipes, all Apache 2.0.</p>

  <p>Tracked as a rarity rather than for adoption: a genuine
  <strong>university from-scratch pretrain</strong> of a modern
  DeepSeek-style stack, from
  <a href="/people/benyou-wang">Benyou Wang</a>'s FreedomIntelligence
  group (<strong>CUHK-Shenzhen</strong>). No arXiv paper yet
  (paper-backfill work-list).</p>
