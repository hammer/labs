description: >
  <p>New Gemini model family launched at I/O 2026: <strong>image + audio + video
  + text in &rarr; video out</strong>. Distinct from the LLM-tier
  <a href="/outputs/google/gemini-3.5-flash">Gemini 3.5 Flash</a> &mdash;
  positioned as a "create anything from any input" world-simulating generator
  with grounding in real-world physics.</p>

  <p>Initial release is <strong>Gemini Omni Flash</strong>: 10-second video
  cap, SynthID-watermarked. Available globally to Gemini app subscribers
  (AI Plus / Pro / Ultra) and Google Flow; free tier via YouTube Shorts and
  YouTube Create. Direct competitive answer to Sora / Veo separation.</p>
