    url: https://arxiv.org/abs/2602.02734
  - label: HuggingFace (dataset)
    url: https://huggingface.co/datasets/google/WaxalNLP
description: >
  <p>One of the largest openly-licensed speech corpora for
  <strong>Sub-Saharan African languages</strong> — ~1,250 hours of
  transcribed natural ASR speech plus ~235 hours of single-speaker TTS
  recordings across <strong>24 languages</strong> (Hausa, Yoruba, Igbo,
  Swahili, Amharic, Twi, Luganda, Lingala, and more) spoken by 100M+
  people. Built with four African academic/community partners and framed
  as inclusive speech-tech and digital-preservation infrastructure; a large
  Google effort (authors include Jeff Dean, Yossi Matias, Moustapha Cissé,
  Avinatan Hassidim). Surfaced in the weekly sweep as a prior-month gap.</p>
