description: >
  <p>Google's new <strong>agentic workhorse</strong> in the Gemini 3 family,
  built on <a href="/outputs/google/gemini-3.6-flash">Gemini 3.6 Flash</a>
  with algorithmic improvements to its reasoning foundation. The proprietary,
  natively multimodal model accepts text, images, video, audio, and PDFs in a
  <strong>1,048,576-token context window</strong>, produces up to 65,536 tokens,
  and supports low, medium, and high thinking levels plus function calling,
  search, code execution, and computer use.</p>

  <p>Google reports <strong>43.6%</strong> on FrontierCode 1.1, 65.3% on
  DeepSWE v1.1, 85.8% on Terminal-Bench 2.1, 47.9% on OSWorld 2.0, and 53.6%
  on HLE-Verified. Artificial Analysis scores the highest/default checkpoint
  at <strong>45</strong> on Intelligence Index v4.2. Google launched it at
  $0.75 per million input tokens and $3.75 per million output tokens through
  December 2026; architecture, parameter count, and training scale remain
  undisclosed.</p>
