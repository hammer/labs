description: >
  <p>Google's third Flash release in six weeks and its <strong>most intelligent
  workhorse model</strong> for coding and agents, built on
  <a href="/outputs/google/gemini-3.7-flash">Gemini 3.7 Flash</a> and shipped
  September 2, 2026 alongside the restricted
  <a href="/outputs/google/gemini-3.8-flash-cyber">Gemini 3.8 Flash Cyber</a>.
  The change Google describes is diligence rather than architecture: the model
  "works harder" on complex tasks, executing extra reasoning steps and calling
  tools iteratively, at the cost of more output tokens; low, medium, and high
  thinking levels let developers trade that overhead against cost and latency.
  Natively multimodal (text, images, video, audio, PDFs in; text out) with a
  <strong>1,048,576-token context window</strong> and 65,536 output tokens,
  function calling, code execution, search grounding, and computer use (preview).
  Knowledge cutoff March 2026 per the model card.</p>

  <p>Google's evaluation sheet (September 2026, high thinking, pass@1) reports
  <strong>73.7%</strong> on DeepSWE v1.1 with a mini-swe-agent harness (3.7 Flash
  65.3%, Claude Opus 5 74.0%, GPT-5.6 Sol 72.7%), <strong>61.4%</strong> on Vals
  Finance Agent V2 (3.7 Flash 59.0%, Opus 5 58.6%), 10.0% on Harvey's Legal
  Agent Benchmark (3.7 Flash 8.8%, Opus 5 6.7%), <strong>54.9%</strong> on
  HLE-Verified (GPT-5.6 Sol 54.5%, Opus 5 54.4%), Terminal-Bench 2.1 89.4%,
  CharXiv Reasoning 86.2%, LVBench 87.8%, LABBench2 86.2%, and a GDPval-AA v2
  Elo of 1545 (Opus 5 1824). The gaps to the frontier are on the general-agent
  and computer-use rows: Terminal-Bench 4.0 19.1% (Opus 5 51.8%, Sol 37.3%) and
  OSWorld 2.0 59.0% (Opus 5 75.4%). Google also cites more than three times as
  many completed tasks as 3.7 Flash on long-running document-heavy workflows.
  Launch coverage put it at 59 on the then-current AA Intelligence Index
  v4.1.1, level with GPT-5.6 Sol and Grok 4.6; on <strong>AA Intelligence
  Index v4.3 it scores 41</strong> at high effort (40 medium, 33 low), #32 of
  202 at last check and Google's highest score on the index, and the fastest
  model AA measures at 328.8 output tokens/s. Pricing holds at $0.75 per
  million input tokens and $3.75 per million
  output tokens through December 31, 2026, doubling to $1.50/$7.50 on January
  1, 2027. Available in the Gemini API, AI Studio, Antigravity, Android Studio,
  Stitch, Gemini Enterprise, and the Gemini app for Pro and Ultra subscribers;
  proprietary, with architecture, parameter count, and training scale
  undisclosed.</p>
