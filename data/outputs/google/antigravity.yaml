description: >
  <p>Standalone agent-first platform announced at I/O 2026 (May 19), backed by
  <a href="/outputs/google/gemini-3.5-flash">Gemini 3.5 Flash</a>. Comprises a
  desktop app, a Go-based <strong>Antigravity CLI</strong> (replacing the
  deprecated Gemini CLI), an <strong>Antigravity SDK</strong>, and a
  <strong>Managed Agents API</strong> that provisions a remote Linux
  environment per call. The enterprise tier ships as the Gemini Enterprise
  Agent Platform.</p>

  <p>Google's direct counter to Claude Code / Codex / Cursor / xAI's Grok Build.
  The forced Gemini CLI &rarr; Antigravity CLI migration makes this a meaningful
  forcing function across Google's developer ecosystem.</p>
