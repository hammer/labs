description: >
  <p>Four-variant family released under <strong>Apache 2.0</strong> (a notable license
  upgrade from prior Gemma releases). Includes a 31B dense flagship, 26B-A4B MoE
  (4B active), and edge variants E4B and E2B. <strong>256K token context</strong>
  for the larger models. Multimodal: text, image, video, audio.</p>

  <p>Architecture features alternating attention, dual RoPE, Per-Layer Embeddings (PLE),
  and shared KV cache. Gemma 4 31B achieves <strong>85.2% MMLU Pro, 89.2% AIME 2026,
  80.0% LiveCodeBench v6</strong>, and Codeforces Elo 2,150. Ranked #3 open model on
  Arena AI text leaderboard. Crossed 2M downloads shortly after release.</p>

  <p>The <strong>Gemma 4 Technical Report</strong> (arXiv, July 2, 2026;
  300+ authors) details the family: dense and MoE architectures from 2.3B
  to 31B, improved vision and audio encoders at every size, the unified
  <strong>encoder-free architecture</strong> of the
  <a href="/outputs/google/gemma-4-12b">12B variant</a> (raw audio and
  image patches in, no separate encoders), and a thinking mode generating
  reasoning traces before responding.</p>

  <p><strong>June 5, 2026:</strong> deployment-ready
  <strong>QAT (Quantization-Aware Training) 4-bit checkpoints</strong>
  shipped across the family on HuggingFace &mdash; including GGUF +
  unquantized + CT variants for E2B, E4B, 12B, 26B-A4B, and 31B
  (~20 repos total).</p>
