description: >
  <p><strong>Encoder-free unified multimodal Gemma</strong> &mdash; a
  <strong>~12B dense Transformer</strong> (11.95B per the model card) sitting
  between the E4B edge variant and the 26B-A4B MoE in the
  <a href="/outputs/google/gemma-4">Gemma 4</a> family. Targets 12&ndash;16 GB
  VRAM, the first mid-sized open-weight model with native audio input.
  Apache 2.0.</p>

  <p>The "unified" designation refers to its <strong>encoder-free
  architecture</strong>: instead of a separate vision tower or audio encoder,
  raw inputs project directly into the LLM's embedding space via lightweight
  linear maps. Per Maarten Grootendorst's visual guide, that means:</p>

  <ul>
    <li><strong>Vision</strong>: a ~35M-param embedder (vs ~550M in larger
    Gemma 4 variants) ingests <strong>48&times;48 pixel patches</strong>
    (6,912 raw pixel values per patch) through a single projection layer, with
    learnable 1120&times;3840 X/Y coordinate matrices for spatial position.</li>
    <li><strong>Audio</strong>: input is split into 40&nbsp;ms windows at
    16&nbsp;kHz (640 raw amplitude samples each) and linearly projected into
    token space &mdash; no encoder, no positional embeddings, processed
    "much like text sequences."</li>
    <li><strong>Text-side architecture</strong>: 48 layers, 3,840 hidden
    dimension, interleaved local-window attention with global attention
    (global always last), 1,024-token sliding window, 262K vocabulary,
    256K context. <strong>Multi-Token Prediction (MTP)</strong> drafters
    reduce latency. Training data cut-off January 2025.</li>
  </ul>

  <p>Reports on the HuggingFace model card: <strong>MMLU Pro 77.2%</strong>,
  <strong>AIME 2026 (no tools) 77.5%</strong>, <strong>LiveCodeBench v6
  72.0%</strong>, GPQA Diamond 78.8%, MMMU-Pro Vision 69.1%, CoVoST (audio)
  38.5%. Google positions it as approaching the larger 26B-A4B MoE on
  standard text benchmarks at &lt;50% of the memory footprint.</p>

  <p>Distribution: HF (Instruct + Base), Kaggle, LM Studio, Ollama, Google AI
  Edge Gallery App; toolchain support for Transformers, llama.cpp, MLX,
  SGLang, vLLM, Unsloth. Not yet scored on Artificial Analysis.</p>
