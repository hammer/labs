model:
  license: Proprietary (API)
  variants:
    - name: Gemini 3.8 Live Extended Thinking
      notes: "AA Speech-to-Speech Index 82.6 (#1, Sep 2026)."
    - name: Gemini 3.8 Live
      notes: "AA Speech-to-Speech Index 76.0."
    - name: Gemini 3.8 Live with Live Avatar
      notes: "Sep 24 2026, in Gemini Enterprise: a real-time animated avatar driven by the Live model, with lip-sync and expressions that stay synchronized across 97 languages; custom avatars from reference images through enterprise allowlisting only."
