description: >
  <p>Gemini-powered evolutionary coding agent for scientific and algorithmic discovery.
  Found the <strong>first improvement to Strassen's matrix multiplication in 56
  years</strong> (4&times;4 complex matrices in 48 multiplications).</p>

  <p>Also optimized Google data center scheduling, chip design, and LLM training
  kernels. Represents a new paradigm of <strong>AI-driven algorithm discovery</strong>
  where LLMs generate and evolve code solutions. By Novikov et al. (DeepMind).</p>

  <p>In August 2026 a DeepMind paper with academic co-authors, including Josh
  Alman and Virginia Vassilevska Williams, used AlphaEvolve to rewrite the
  optimization code behind the laser method's combination-loss analysis. It
  lowered the upper bound on the <strong>matrix multiplication exponent to
  &omega; &lt; 2.371177</strong>, from 2.371339, with rational-arithmetic
  certificates making the bound verifiable (arXiv 2608.16884). On 2026-11-04
  DeepMind opened the <code>google-deepmind/alphaevolve</code> repository. It
  contains a minimal local implementation of AlphaEvolve, the evolved &omega;
  optimization program with its verifier and a Colab notebook, and the initial
  programs and results for the earlier mathematical problems.</p>
