description: >
  <p>Google's July 21, 2026 "workhorse" refresh of its Flash tier
  (API <code>gemini-3.6-flash</code>). Intelligence is held flat &mdash;
  <strong>AA Intelligence Index v4.1.1: 52</strong>, the same as
  <a href="/outputs/google/gemini-3.5-flash">Gemini 3.5 Flash</a> &mdash; while
  the model gets dramatically more efficient: Google reports it roughly
  <strong>halves time-per-task</strong> (1.3 min vs 2.7 min) and uses ~17% fewer
  output tokens, with output pricing cut to <strong>$7.50 / 1M</strong> (from
  $9.00; input unchanged at $1.50). The knowledge cutoff moves up to March 2026.</p>

  <p>Multimodal input (text, image, video, audio, PDF), text output, a
  <strong>1M-token context</strong> and 64K max output. Google cites large agentic
  and coding gains over 3.5 Flash: DeepSWE 49% (vs 37%), MLE-Bench 63.9%
  (vs 49.7%), OSWorld-Verified 83.0% (vs 78.4%), GDPval-AA v2 1421 (vs 1349).
  Proprietary and API-only &mdash; GA in AI Studio, the Gemini API, Vertex AI /
  Gemini Enterprise, the Gemini app, Android Studio, and Antigravity.</p>
