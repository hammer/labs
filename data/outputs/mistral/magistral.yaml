description: >
  <p>Reasoning model family trained with <strong>pure reinforcement
  learning</strong> — no distillation from external reasoning models.
  ~50% boost in AIME-24 (pass@1) over the Mistral Medium 3 base
  checkpoint.</p>

  <p>RL on text maintains multimodal understanding, instruction
  following, and function calling. Magistral Small (24B, Apache 2.0)
  and Magistral Medium (proprietary).</p>
tags:
  - reasoning
  - open-weight
model:
  architecture: dense
  # Anchored to Magistral Small 1.2 (the AA URL in sources) — the open-weight
  # checkpoint AAOI scored; Medium's higher AAII lives in variants.
  intelligence_index: 11
  intelligence_index_version: "AA v4.1"
  openness_index: 50
  openness_index_version: "AA Openness Index v1.0"
  variants:
    - name: Magistral Small 1.2
      parameters: 24B
      notes: Apache 2.0 open weights; AA Intelligence Index 12, AAOI 50
    - name: Magistral Medium 1.2
      notes: Proprietary; AA Intelligence Index 20, AAOI 27.8
