description: >
  <p><strong>124B open-weights multimodal model</strong> (123B multimodal
  decoder + 1B vision encoder) "built on top of Mistral Large 2, i.e.,
  Mistral-Large-Instruct-2407" &mdash; extending the text flagship with
  frontier-class image understanding without compromising text performance.
  128K context fits at least 30 high-resolution images.</p>

  <p>At release it led MathVista (CoT: <strong>69.4</strong>, ahead of GPT-4o
  and Gemini-1.5 Pro), DocVQA (ANLS: 93.3), VQAv2 (80.9), and MM-MT-Bench
  (7.4, ahead of Claude 3.5 Sonnet), and was the best open-weights model on
  the LMSys Vision Arena by ~50 ELO. Mistral Research License (commercial
  license required for production use).</p>
