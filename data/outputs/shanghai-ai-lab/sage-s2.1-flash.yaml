description: >
  <p>Shanghai AI Laboratory's <strong>书生 (Sage) S2.1 Flash</strong> is a
  scientific multimodal agent model that the launch page describes as a
  "320-billion-parameter MoE" (3200 亿参数 MoE 架构). It was released on
  HuggingFace and ModelScope in mid-November 2026 in BF16 and FP8 under the
  MIT license. It is not a Shanghai AI Lab pretrain. The config.json declares
  <code>Glm5NextForConditionalGeneration</code> and has exactly
  <a href="/outputs/zai/glm-5.3-flash">GLM-5.3-Flash</a>'s geometry: 45
  layers, hidden size 4,096, 288 routed experts plus one shared, 8 active per
  token, mHC with 20 Sinkhorn iterations, a 154,880-token vocabulary and
  1,048,576 positions. The safetensors total is about 321.3B, and the
  deployment guide points to the GLM-5.3-Flash SGLang cookbook. So the
  parameter count belongs to Z.ai's pretraining. The 744B GLM-5.2-based
  <a href="/outputs/shanghai-ai-lab/atria-dawn-preview">Atria Dawn</a>, whose
  repository was renamed <code>internlm/Sage-S2.1</code>, is the larger
  sibling in the same S2.1 line.</p>

  <p>What the lab adds is scientific input. Through <strong>Sage
  SciPerception</strong>, a separately released set of scientific encoders
  and trainable projectors, more than ten kinds of scientific data are
  projected into the language model's input embedding space and served as
  <code>prompt_embeds</code>. These include molecular graphs, crystal
  structures, protein sequences and 3D structures, DNA and RNA sequences,
  spectra, mass spectra, X-ray diffraction, ECG, EEG and light curves. They
  support prediction, classification, site localization and structure
  inference. The page also credits large-scale verifiable-environment
  training for search, coding, tool use and professional-software operation
  with visual feedback. Its demos include 3D Slicer CT reconstruction,
  Blender/CAD modelling and Fiji cell segmentation. No technical report has
  been published.</p>

  <p>The card's 33-row table is self-reported, with the lab's own harnesses
  (mostly Claude Code). It compares the model with GLM-5.3-Flash,
  DeepSeek-V4.1-Flash-1017, Qwen3.8-Max, GPT-5.6 Sol and Claude Opus 5.
  Sage S2.1 Flash beats its GLM-5.3-Flash base on nearly every row:
  Terminal-Bench 2.1 <strong>87.9</strong> (84.3), SWE-bench Pro 60.6 (60.3),
  MLE-bench Lite <strong>90.3</strong> (84.3), GDPval 78.0 (67.7), OfficeQA
  Pro <strong>72.2</strong> (64.7), BrowseComp 91.2 (88.3), OSWorld-Verified
  85.2 (83.5) and BabyVision 75.8 (51.3). It still trails Opus 5 on coding:
  SWE-bench Pro 60.6 against 76.5 and NL2Repo-Bench 57.2 against 79.9. The
  table reports no scientific-modality benchmarks. Artificial Analysis had not
  scored it at filing: no articles-index entry and no leaderboard slug.</p>
tags:
