  architecture: moe
  # Derivative: config.json is GLM-5.3-Flash's (glm5_next, 45 layers, 288
  # experts, top-8, vocab 154,880); no `parameters` so the Scale column does
  # not credit Shanghai AI Lab with Z.ai's ~320B pretraining.
  base_model: glm-5.3-flash
  num_experts: 288
  top_k: 8
  license: MIT
  benchmark_scores:
    - benchmark: Terminal-Bench 2.1
      score: "87.9"
    - benchmark: SWE-bench Pro
      score: "60.6"
    - benchmark: DeepSWE
      score: "67.9"
    - benchmark: MLE-bench Lite
      score: "90.3"
    - benchmark: GDPval
      score: "78.0"
    - benchmark: OfficeQA Pro
      score: "72.2"
    - benchmark: BFCL v4
      score: "75.5"
    - benchmark: BrowseComp
      score: "91.2"
    - benchmark: OSWorld-Verified
      score: "85.2"
  variants:
    - name: Sage S2.1 Flash
      notes: "BF16, ~321.3B safetensors parameters; post-train of GLM-5.3-Flash"
    - name: Sage S2.1 Flash FP8
      notes: "FP8 build"
