  - math
  - reasoning
  - research
eval:
  num_questions: 245
  domains:
    - undergraduate mathematics
    - doctoral qualifying-exam mathematics
  scoring_method: >
    ProverBench: pessimistic AutoVerifier acceptance (a proof counts only if
    all eight judgments accept). VerifierBench: Balanced F1, the harmonic mean
    of TPR and TNR, over correct/incorrect polarity (Rough) and over agreement
    with expert error analyses (Meta-Verification, judged by gpt-oss-120b).
  top_scores:
    - model: GPT-5.5-xhigh
      score: "64.5 UG / 48.9 QE (ProverBench)"
    - model: Claude-Opus-4.8
      score: "59.0 UG / 40.0 QE (ProverBench)"
    - model: DeepSeek-V4-Pro
      score: "65.1 Meta Balanced F1 (VerifierBench)"
