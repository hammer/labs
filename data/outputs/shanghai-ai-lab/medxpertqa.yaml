description: >
  <p>A challenging benchmark for <strong>expert-level medical reasoning and
  understanding</strong>: <strong>4,460 questions spanning 17 specialties and 11
  body systems</strong>, sourced from professional medical exams and filtered to
  stress difficulty and reduce data leakage. It has two subsets &mdash;
  <strong>Text</strong> (text-only) and <strong>MM</strong> (multimodal, with
  clinical images) &mdash; and two question types, <strong>Reasoning</strong>
  (diagnostic/clinical reasoning) and <strong>Understanding</strong> (medical
  knowledge).</p>

  <p>Frontier models still find it hard: on the multimodal subset OpenAI's
  <strong>o1 reaches only 56.3%</strong> (GPT-4o 42.8%), and on the text subset
  reasoning models such as <strong>DeepSeek-R1 (37.8%)</strong> and o3-mini
  (37.3%) lead but remain far from saturation &mdash; making it a useful probe for
  medical reasoning in thinking models. Integrated into the
  <strong>OpenCompass</strong> evaluation framework. ICML 2025; MIT-licensed. By
  the <strong>Tsinghua C3I</strong> group (lead authors Yuxin Zuo, Shang Qu) and
  <a href="/labs/shanghai-ai-lab">Shanghai AI Laboratory</a> (senior author
  Bowen Zhou).</p>
