name: PengCheng-Mind
slug: mind
lab: pcl
type: model
date: "2023-09-21"
flagship: true
sources:
  - label: OpenI repo (PengCheng.Mind 200B + 7B)
    url: https://openi.pcl.ac.cn/PengChengMind/PengCheng.Mind
  - label: GitHub (mPengC.mind — multilingual 7B)
    url: https://github.com/PCLNLP-group/mPengC.mind
  - label: HuggingFace (mPengC.mind_gpu)
    url: https://huggingface.co/PCLNLP/mPengC.mind_gpu
  - label: HuggingFace (mPengC.mind_npu)
    url: https://huggingface.co/PCLNLP/mPengC.mind_npu
  - label: WWW 2025 paper (Peng Cheng Cloud Brain and Mind Series)
    url: https://dl.acm.org/doi/10.1145/3696410.3714543
description: >
  <p>PCL's flagship Chinese-focused autoregressive language model series &mdash;
  a <strong>201B-parameter dense Transformer</strong> alongside a 7B sibling,
  trained end-to-end on China's Computing Network using the
  <strong>MindSpore</strong> framework over <strong>Huawei Ascend 910</strong>
  silicon (Cloud Brain II). Both variants emphasize Chinese core capabilities
  while supporting English and additional languages, with the released
  checkpoint trained on ~<strong>1.5T tokens</strong>.</p>

  <p>The 200B checkpoint is sharded into <strong>3,456 model shards</strong>
  for distributed training and inference on Ascend; fine-tuning requires
  144 Ascend-910 cards. Weights are distributed via OpenI through an
  application gate, not on HuggingFace.</p>

  <p>A separate multilingual variant, <strong>mPengC.mind (7B)</strong>,
  applies multilingual incremental learning on top of the 7B base and is
  released openly on HuggingFace in both NPU and GPU builds.</p>
tags:
  - open-weight
  - nlp
  - multilingual
model:
  architecture: dense
  parameters: 200B
  training_tokens: 1.5T
  training_hardware: Ascend 910 (Cloud Brain II)
  variants:
    - name: PengCheng-Mind-200B
      parameters: 200B
      notes: Distributed via OpenI application gate; 3,456 model shards
    - name: PengCheng-Mind-7B
      parameters: 7B
    - name: mPengC.mind (multilingual 7B)
      parameters: 7B
      notes: Multilingual incremental-learning variant on the 7B base; HF NPU + GPU builds
related:
  - nebula
  - symphony-moe
