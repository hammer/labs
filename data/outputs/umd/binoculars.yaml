description: >
  <p>Zero-shot LLM-text detection (ICML 2024) by contrasting the
  perplexity of two related models (an "observer" and a "performer"):
  over 90% detection of machine text at a 0.01% false-positive rate with
  no training data from the target model. The standard open detector
  baseline, from Tom Goldstein's group with Abhimanyu Hans &mdash;
  pre-window preprint whose publication and adoption fall in window.</p>
