description: >
  <p>"Which of These Best Describes Multiple Choice Evaluation with
  LLMs?" (ACL 2025): Balepur, Rudinger, and Boyd-Graber import
  educational-testing theory to argue the MCQA format itself &mdash;
  forced choice, answer leakage, no generation &mdash; systematically
  mismeasures LLM ability, and propose constructed-response and
  rubric-based fixes. A seed paper of the benchmark-science /
  philosophy-of-evaluation thread.</p>
