description: >
  <p>A proteome-wide deep generative model that ranks variant
  deleteriousness by combining evolutionary sequence data with human
  population data, from the Marks Lab (of the EVE/Tranception lineage;
  Nature Genetics, Nov 2025). popEVE achieves SOTA rare-disease variant
  prioritization and nominated 123 novel candidate genes in a
  developmental-disorder cohort.</p>
