description: >
  <p>A universal representation foundation model for intermolecular
  interactions from <a href="/people/marinka-zitnik">Marinka Zitnik</a>'s
  lab, covering proteins, nucleic acids, small molecules, and ions.
  ATOMICA is trained by self-supervised denoising on ~2.04M molecular
  complexes and learns compositional, atomic-resolution embeddings that
  transfer across molecular classes. Pretrained from scratch by Harvard.</p>
