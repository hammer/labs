description: >
  <p>An 11B multimodal protein-phenotype foundation model from
  <a href="/people/marinka-zitnik">Marinka Zitnik</a>'s lab, combining
  sequence, structure, and language and trained on ProCyon-Instruct (33M
  instructions). ProCyon retrieves proteins by drug mechanism-of-action or
  disease context and generates phenotype descriptions for
  uncharacterized proteins.</p>
