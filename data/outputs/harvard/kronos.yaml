description: >
  <p>A panel-agnostic foundation model for multiplex spatial proteomics
  from the <a href="/people/faisal-mahmood">Mahmood Lab</a>: a ViT with
  marker-identity embeddings, self-supervised on 47M single-marker patches
  spanning 175 markers. KRONOS reaches SOTA on cell phenotyping,
  treatment-response prediction, and retrieval across 11 cohorts, and is
  the first FM to make multiplex-proteomics analysis segmentation-free.
  Pretrained from scratch by Harvard.</p>
