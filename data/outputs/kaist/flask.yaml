description: >
  <p>Fine-grained Language model evaluation based on Alignment SKill
  sets (ICLR 2024): decomposes instruction-following evaluation into
  12 instance-specific skills instead of a single holistic score,
  showing skill-level scoring improves both human&ndash;model and
  model&ndash;model evaluator agreement. The methodological start of
  the LK Lab evaluator line that produced
  <a href="/outputs/kaist/prometheus">Prometheus</a> and
  <a href="/outputs/kaist/biggen-bench">BiGGen Bench</a>.</p>
