description: >
  <p><strong>Korea's largest open-weights model</strong>: a 750B-total /
  37B-active MoE <strong>upcycled from K-EXAONE 236B</strong>, covering 10
  languages under Apache 2.0 &mdash; Phase 2 of the government's Sovereign
  AI project. Claims a 70.1 average over 24 benchmarks and 94.4 on
  OpenAI-MRCR; ships FP8, NVFP4, and "DSpark" speculative-decoding
  variants. The tech report shipped as a PDF in the HF repo and was later
  posted to arXiv (2608.04505).</p>

  <p><strong>K-EXAONE 2.5</strong> (9 November 2026, announced at NVIDIA AI
  Day Seoul) is described by LG as "a technology verification model that
  applies additional post-training to K-EXAONE 2.0", used to test the
  post-training methods planned for the third-stage sovereign model, which LG
  aims to complete as K-EXAONE 3.0 in January 2027. It is served free to
  anyone through LG's EXAONE API platform; no weights, parameter count or
  model card have been published. NVIDIA's post says it was developed using
  Nemotron datasets including Nemotron-Personas-Korea. LG's internal analysis
  claims a gain of more than 70% over the August model across 24 combined
  metrics. Self-reported scores against DeepSeek V4.1 Flash and GLM 5.3 Max:
  AutomationBench 74.6 (74.9 / 71.6), Claw-Eval 77.3 (75.8 / 77.6),
  BrowseComp 78.0 (75.8 / 79.0), SWE-Bench Pro 59.2 (58.4 / 64.0). Artificial
  Analysis does not list it yet.</p>
