description: >
  <p><a href="/labs/nex-agi">Nex-AGI</a>'s open-weight agentic model family,
  <strong>post-trained on the Qwen3.5 MoE series</strong> for first-tier coding
  and long-horizon agentic work. Two Apache-2.0 variants: <strong>Nex-N2-Pro</strong>
  (built on Qwen3.5-397B-A17B — 397B total / 17B active) and
  <strong>Nex-N2-mini</strong> (built on Qwen3.5-35B-A3B-Base — 35B / 3B active),
  both multimodal (image/video input).</p>

  <p>Its core is an <strong>"Agentic Thinking"</strong> framework that unifies
  reasoning, tool use, and environment execution into one closed loop:
  <em>Adaptive Thinking</em> (the model decides when and how deeply to think) and
  <em>Coherent Thinking</em> (one reasoning paradigm transferred across general
  and agentic tasks). Trained via Nex-AGI's own
  <a href="/outputs/nex-agi/nexrl">NexRL</a> stack and the environment-scaling
  recipe from <a href="/outputs/nex-agi/nex-n1">Nex-N1</a>. Self-reported
  Nex-N2-Pro: Terminal-Bench 2.1 75.3, SWE-Bench Verified 80.8, SWE-Bench Pro
  58.8, GDPval 1585, TAU3 71.1 — pacing GPT-5.5 / Opus 4.7 on coding and
  long-horizon tasks. Not yet on the AA Intelligence Index.</p>
