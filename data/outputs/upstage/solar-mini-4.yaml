model:
  open_weights: false
  # Upstage's docs give 35B total / 3B active; OpenRouter's listing calls it
  # a mixture-of-experts. parameters/active_parameters are deliberately unset:
  # Upstage has not said whether Solar Mini 4 was pretrained from scratch or
  # derived from another checkpoint (earlier Solar models were depth-up-scaled
  # from external bases), so the figures stay in the description until
  # provenance is disclosed. pretrained_from_scratch: false keeps its AAII
  # out of Upstage's from-scratch Intelligence ranking: there is no
  # primary-source from-scratch claim, and 35B-A3B matches Qwen3.5/3.6-35B-A3B.
  architecture: moe
  pretrained_from_scratch: false
  context_window: 524288
  intelligence_index: 24
  intelligence_index_version: "AA v4.3.2"
  license: Proprietary
related:
