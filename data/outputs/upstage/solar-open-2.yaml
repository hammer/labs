description: >
  <p>Upstage's new open-weight flagship and the successor to
  <a href="/outputs/upstage/solar-open-100b">Solar Open 100B</a>: a
  <strong>250B-total / 15B-active Hybrid-Attention MoE</strong>. Its 48 layers
  interleave softmax and linear attention in a <code>[Softmax, Linear&times;3]
  &times;12</code> pattern (75% linear), with <strong>321 experts</strong>
  (320 routed, top-8, plus one shared). Because the linear-attention layers
  encode token order in their recurrent state, positional encoding is dropped
  entirely (<strong>NoPE</strong>) and only 12 of the 48 layers keep a KV cache
  &mdash; delivering a <strong>1M-token context</strong> at roughly a quarter of
  an all-softmax model's long-context memory. Released 22 July 2026 on Hugging
  Face under the <strong>Upstage Solar License</strong> (commercial use,
  fine-tuning, and distillation permitted).</p>

  <p>Trained cost-efficiently by <strong>selective weight transfer from Solar
  Open 1 (102B)</strong> &mdash; only the ~2.3% of weights that survive the
  architectural change are carried over, and everything else is randomly
  initialized. Officially supports <strong>English, Korean, and Japanese</strong>,
  with a Korean-optimized tokenizer that encodes text in ~50&ndash;80% of the
  tokens global models use.</p>

  <p>Reported benchmarks (self-reported): <strong>MMLU-Pro 86.2</strong>,
  GPQA-Diamond 86.3, LiveCodeBench v6 92.4, HMMT 93.9, IFBench 80.0,
  MCP-Atlas 58.2, and KMMLU-Pro 78.4 &mdash; competitive with DeepSeek-V4-Flash
  and MiMo-V2.5 in Upstage's comparison table, and a large jump over Solar Open
  100B (LiveCodeBench +36, HMMT +25). <strong>AA Intelligence Index v4.1.1:
  37</strong> (scored August 2026), versus 15 for Solar Open 100B.</p>
