description: >
  <p>Fully transparent, permissive self-alignment for code LLMs (NeurIPS
  2024): the model generates its own instruction data (concepts &rarr;
  tasks &rarr; responses, validated by self-generated tests) with no human
  annotation and no distillation from larger proprietary models. Produced
  <strong>StarCoder2-Instruct</strong>, the first fully self-aligned open
  code LLM. UIUC-led (Yuxiang Wei, Lingming Zhang) within the BigCode
  consortium, with Snowflake and Hugging Face &mdash; joint BigCode
  attribution; StarCoder2 itself is ServiceNow/HF-led and not booked
  here.</p>
