description: >
  <p>A physics benchmark built from unpublished research problems.
  <strong>CritPt</strong> ("Complex Research using Integrated Thinking &ndash;
  Physics Test", read as "critical point") has <strong>71 composite research
  challenges</strong>, each meant to simulate an entry-level research project,
  split into <strong>190 checkpoint tasks</strong>. <strong>More than 50 active
  physicists</strong> wrote the problems from their own research, across
  condensed matter, quantum, AMO, astrophysics, high-energy, mathematical,
  statistical and nuclear physics, nonlinear and fluid dynamics, and
  biophysics. Each problem has a guess-resistant, machine-checkable answer
  (number arrays, symbolic expressions, Python functions), graded by a
  physics-specific pipeline. One example challenge is public. The answers to
  the other <strong>70 test challenges are private</strong> and graded on an
  online server, which limits contamination.</p>

  <p>In the paper, the best base model, GPT-5 (high), averaged
  <strong>5.7%</strong> on full challenges, rising to about 10% with code
  tools. CritPt joined the <strong>Artificial Analysis Intelligence Index in
  v4.0</strong> (January 2026) and was a 10% component through v4.3.2, in the
  Scientific Reasoning category next to HLE. <strong>In v5.0</strong> (27 October
  2026) AA replaced it, at the same 10% in the renamed Science category, with a
  <strong>private 40-question hard subset of CritPt v2</strong>: the 70 v2
  challenges minus the 30 that seven frontier models solved in all five
  attempts at launch, run in AA's Stirrup harness with a Python sandbox. GPT-6
  Astra (high) leads that subset at 72%, then GPT-6.1 Sol (max) at 69% and
  Claude Opus 5.5 (max) at 61%. On the v1 set AA ran pass@1 over five repeats
  through the official grading server, and its top scores were near a
  third: Muse Wonder Full (max) 32.9%, then GPT-6 Astra, GPT-6.1 Sol and
  Claude Opus 5.5 tied at 31.7%. The authors now maintain
  <strong>CritPt v2</strong>, a revision of the 70 test challenges in which
  the authors and outside physicists fixed underspecified statements, errors
  and typos. AA also runs the full v2 set as a standalone evaluation,
  in its Stirrup agentic harness with a Python sandbox and no internet. The
  authors' own v2 leaderboard (average over 5 runs) is far higher: GPT-6 Astra
  83.1, GPT-6.1 Sol 82.0, Claude Opus 5.5 77.7. The v1 index scores and the
  v2 numbers measure different task versions and harnesses, so they should
  not be compared directly.</p>

  <p>Minhui Zhu (Argonne) and Minyang Tian (UIUC) are the equal-contribution
  lead and corresponding authors, and Nicolas Chia, Eliu Huerta and
  <a href="/people/hao-peng">Hao Peng</a> (Argonne / UIUC / UChicago) are the
  senior authors. The paper has 65 authors from more than 30 institutions.
  It is filed under UIUC because Argonne is not tracked. The same group built
  <a href="/outputs/uiuc/scicode">SciCode</a>. arXiv v4 (May 2026) is the
  current revision.</p>
