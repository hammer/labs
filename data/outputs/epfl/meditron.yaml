description: >
  <p>Meditron is EPFL's flagship <strong>open medical-LLM lineage</strong>,
  originating in the epfLLM group <em>before</em> the Swiss National AI Institute
  existed. The <strong>Meditron-3</strong> suite (8B and 70B, built on Llama&nbsp;3.1,
  July 2024) is co-developed with <strong>Yale</strong> (Mary-Anne Hartley's LiGHT
  lab) and the <strong>ICRC</strong>, with additional Gemma&nbsp;2 / Qwen&nbsp;2.5 /
  Phi&nbsp;4 base-model variants (2025). It is one of the leading open medical
  LLMs and appears in the Stanford AI Index.</p>

  <p>Meditron sits at the sharpest EPFL/SNAI boundary. Later versions run on the
  CSCS Alps supercomputer, and the 2026 <strong>MeditronFO</strong> generation
  (<code>Apertus-70B-MeditronFO</code> / <code>-8B-MeditronFO</code>) is a
  field-optimized fine-tune <strong>on top of the Apertus base model</strong>. We
  keep the Meditron fine-tunes in this EPFL entry and credit the Apertus base model
  to <a href="/labs/swiss-ai">Swiss AI</a>. The <code>Meditron-CHUV</code> variant
  (2025) is a hospital-specific fine-tune with CHUV (Lausanne University Hospital),
  a concrete clinical-adoption signal.</p>
