description: >
  <p>Demonstrates that <strong>simple, adaptive attacks</strong> &mdash; a crafted
  prompt template plus random search over an adversarial suffix, tailored per model
  &mdash; achieve <strong>~100% attack success</strong> on leading safety-aligned
  LLMs including GPT-4o, Claude and Llama. A standard red-teaming baseline that
  reframed how jailbreak robustness is measured. From EPFL's TML lab (Flammarion /
  Andriushchenko); <strong>ICLR 2025</strong> (~390&#9733;).</p>
