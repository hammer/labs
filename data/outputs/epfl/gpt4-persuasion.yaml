description: >
  <p>A pre-registered <strong>randomized controlled trial</strong> of AI persuasion:
  in live text debates, <strong>GPT-4 given basic sociodemographic information about
  its opponent out-persuaded human debaters in ~64% of debates</strong> (81.2%
  higher odds of shifting the opponent's agreement), while without personalization
  it was not reliably more persuasive than humans. One of the most-covered results
  on AI persuasion and microtargeting. From Robert West's dlab; published in
  <strong>Nature Human Behaviour</strong> (2025).</p>
