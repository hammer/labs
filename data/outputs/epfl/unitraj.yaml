description: >
  <p>UniTraj is a <strong>unified framework for vehicle trajectory prediction</strong>
  that standardizes training and evaluation across multiple driving datasets
  (nuScenes, Waymo, Argoverse), assembling one of the largest unified trajectory
  corpora and serving as a standard baseline harness for the field. From Alexandre
  Alahi's VITA lab; ECCV 2024.</p>
