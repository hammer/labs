description: >
  <p>Architectural experiment from IBM: a single Granite 4.1 base checkpoint
  embeds <strong>12 independently-trained activated-LoRA adapters</strong>
  (RAG, safety, explainability, etc.) that the model dynamically selects at
  inference time via control tokens. IBM calls the pattern <em>"coarse-grained
  expert switching"</em> &mdash; avoids both the N-copies-per-task overhead and
  the joint-training compromises of standard MoE adapter merging.</p>

  <p>Three sizes (3B / 8B / 30B Preview) all built on Granite 4.1 base with
  128K context. Apache 2.0. Discovered via HF org probe &mdash; no
  announcement blog at release.</p>
