description: >
  <p>Architectural experiment from IBM: a single Granite 4.1 base checkpoint
  embeds <strong>12 independently-trained activated-LoRA adapters</strong>
  (RAG, safety, explainability, etc.) that the model dynamically selects at
  inference time via control tokens. IBM calls the pattern <em>"coarse-grained
  expert switching"</em> &mdash; avoids both the N-copies-per-task overhead and
  the joint-training compromises of standard MoE adapter merging.</p>

  <p>Three sizes (3B / 8B / 30B Preview) all built on Granite 4.1 base with
  128K context. Apache 2.0. The previews were found through an HF org
  probe and had no announcement blog.</p>

  <p>The non-preview <strong>granite-switch-4.1-30b</strong> and
  <strong>-8b</strong> followed on October 14, 2026 with a launch blog
  ("Chat, Decisions, and Speech from One Endpoint"). They carry a slimmer
  bundle: two aLoRA adapters, <code>decision</code> (returns a softmax over
  labelled options in one forward pass) and <code>guardian-core</code> (safety
  risk detection), plus an embedded 470M English ASR model,
  granite-speech-5.0-470m-turboctc. Audio is transcribed in a cascade and the
  transcript is spliced into the chat context. The card says the speech
  encoder and the LLM "are not yet jointly trained." On the public Decision
  Index v0.3 fast subset (1,068 rows), IBM reports an overall 50.1 for the
  30B decision adapter and 42.9 for the 8B. The full Granite Libraries bundle
  stays in the preview checkpoints.</p>
