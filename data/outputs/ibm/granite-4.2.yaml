description: >
  <p>IBM's first family of native <strong>reasoning</strong> Granite models:
  dense decoder-only Transformers in <strong>3B, 8B and 30B</strong>, each with
  a built-in <code>&lt;think&gt;</code> chain-of-thought that can be toggled per
  request (full thinking, non-thinking, or a "low-effort" short budget) plus
  reasoning-augmented native tool calling. All three are
  <strong>post-trained on the Granite 4.1 base checkpoints</strong> (the model
  cards declare <code>base_model: granite-4.1-{3b,8b,30b}-base</code>; the 4.1
  bases were pretrained on ~15T tokens with a five-phase curriculum) rather
  than being a fresh pretrain. Same GQA/RoPE/SwiGLU/RMSNorm shapes as 4.1
  (30B: 64 layers, hidden 4096, MLP 32768, 32 heads / 8 KV heads, 100K vocab),
  128K native context with 512K long-context extension. <strong>Apache
  2.0</strong>.</p>

  <p>The new work is the post-training pipeline. SFT uses ~7.2M samples
  (~100B tokens), 31.6% agentic &mdash; mostly software-engineering
  trajectories collected through OpenHands, OpenCode, Terminus-2, SWE-agent,
  Codex, Gemini CLI, Goose and other harnesses &mdash; with the 30B getting a
  second agentic-coding SFT phase. Then a staged, asynchronous
  <strong>GRPO</strong> curriculum on NeMo RL / NeMo Gym: RLVR and skill
  boosters for all sizes; for 8B and 30B an <em>agentic RL</em> block that runs
  SWE (OpenHands, hidden-test rewards) &rarr; terminal (Harbor/Terminus-2, up to
  64 environment turns) &rarr; deep-research search agents in real sandboxes;
  and a closing RLHF phase. IBM also cites 1T tokens of CodeAlchemy synthetic
  code and a mid-training step. Trained on a CoreWeave GB200 NVL72 cluster.
  FP8, NVFP4, MXFP4 (LLM Compressor) and GGUF quants ship for every size.</p>

  <p>30B results: SWE-bench Verified 57.0, SWE-bench Pro 33.3, Terminal-Bench
  2.1 29.2, &tau;&sup3;-bench 62.0, BFCL v4 61.4, AIME25 89.2, GPQA 66.4,
  LiveCodeBench v6 75.8, MMLU-Pro 77.6, RULER-128K 81.4. AA Intelligence Index
  v4.2: <strong>17</strong> (30B), 14 (8B), 11 (3B) &mdash; versus 3 / 1 / 1
  for the non-reasoning Granite 4.1 instruct models on the same bases. Released
  alongside Granite Speech 5.0 Turbo CTC (470M, no LLM backbone, ~12,600 RTFx
  on one H200).</p>
