description: >
  <p><strong>Graph-based retrieval-augmented generation framework</strong>
  (EMNLP 2025) from <a href="/people/chao-huang">Chao Huang</a>'s Data
  Intelligence Lab (HKUDS): incorporates a graph text-index with
  dual-level (low/high-level) retrieval to capture entity relationships
  that flat chunk retrieval misses, with incremental index updates. At
  37.8K&#9733; it is among the most-adopted academic RAG stacks anywhere,
  extended by the multimodal <strong>RAG-Anything</strong>
  (22.3K&#9733;).</p>

  <p>The same lab ships the AutoAgent zero-code agent framework
  (9.5K&#9733;), the AI-Researcher scientific-discovery agent (NeurIPS
  2025), and the OpenCity spatio-temporal foundation model &mdash;
  the highest-adoption OSS portfolio at HKU.</p>
