description: >
  <p>The dominant open <strong>RL post-training framework for LLMs</strong>
  (22.5K&#9733;), born as the HybridFlow paper (EuroSys 2025): a hybrid
  programming model that decouples single-controller orchestration from
  multi-controller computation, making PPO/GRPO-style RLHF pipelines
  flexible and efficient at scale. It became the default infrastructure
  for the open RL-for-reasoning wave (used by SimpleRL, DAPO, and many
  R1-replication efforts).</p>

  <p><strong>Joint HKU / <a href="/labs/bytedance-seed">ByteDance
  Seed</a> co-development</strong> that ships under ByteDance branding
  (originally <code>volcengine/verl</code>, now
  <code>verl-project/verl</code>) &mdash; filed here per the co-development
  attribution, not a sole-HKU artifact.</p>
