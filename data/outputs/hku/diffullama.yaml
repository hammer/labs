description: >
  <p><strong>The AR&rarr;diffusion adaptation recipe</strong> (ICLR 2025):
  shows autoregressive checkpoints (GPT-2, LLaMA-2 7B) can be continually
  adapted into discrete diffusion language models with modest compute
  (under 200B tokens), by connecting the two objectives rather than
  pretraining diffusion models from scratch. DiffuGPT and DiffuLLaMA
  scaled diffusion LMs to 7B at a time when open diffusion LLMs barely
  existed.</p>

  <p>The direct methodological seed of hkunlp's Dream family
  (<a href="/outputs/huawei/dream-7b">Dream 7B</a>,
  <a href="/outputs/hku/dream-coder">Dream-Coder/DreamOn</a>). hkunlp-led
  (<a href="/people/lingpeng-kong">Lingpeng Kong</a>'s group) with
  multi-institution co-authors.</p>
