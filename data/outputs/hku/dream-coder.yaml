description: >
  <p>The HKU-led continuation of hkunlp's <strong>Dream diffusion-LLM
  family</strong>: Dream-Coder 7B is an open discrete-diffusion code model
  adapted from a pretrained AR checkpoint, with emergent any-order
  generation (sketch-first, left-to-right, or interleaved decoding chosen
  per task); the instruct model reaches 21.4% pass@1 on LiveCodeBench.
  <strong>DreamOn</strong> (Feb 2026) adds variable-length code infilling
  via <code>&lt;expand&gt;</code>/<code>&lt;delete&gt;</code> tokens,
  breaking diffusion's fixed-canvas constraint.</p>

  <p>The line keeps extending on the <code>Dream-org</code> HuggingFace
  org: DreamReasoner-8B, Dream-VL-7B, and Dream-VLA-7B (2026, papers
  pending). The base <a href="/outputs/huawei/dream-7b">Dream 7B</a>
  &mdash; a joint HKU (<a href="/people/lingpeng-kong">Lingpeng
  Kong</a>'s hkunlp) / Huawei Noah's Ark release, HKU-led &mdash; is filed
  under Huawei; the AR&rarr;diffusion adaptation recipe came from
  <a href="/outputs/hku/diffullama">DiffuGPT/DiffuLLaMA</a>.</p>
