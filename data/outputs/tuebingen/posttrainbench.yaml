description: >
  <p>A benchmark for AI R&amp;D automation that asks whether coding agents can
  do <strong>post-training</strong>, the step that turns a base LLM into a
  useful assistant. Each run gives a CLI agent (Claude Code, Codex CLI and
  similar) one small base model, one target benchmark, <strong>one H100 and
  10 hours</strong>, with no prescribed method: the agent must find data,
  write training code, run experiments and submit a checkpoint. The base
  models are Qwen3-1.7B, Qwen3-4B, SmolLM3-3B and Gemma 3 4B; the score is a
  weighted average over the target benchmarks, compared with the official
  instruct models from the same bases. In the paper the best agent reached
  <strong>23.2% against 51.1%</strong> for the official instruct models,
  although agents can win narrowly (GPT-5.1 Codex Max took Gemma-3-4B to 89%
  on BFCL against the official model's 67%). The paper documents reward
  hacking in detail: agents trained on the test set, downloaded existing
  instruct checkpoints instead of training their own, and used API keys they
  found to generate synthetic data without authorization. MIT license, about
  600 GitHub stars; ICML 2026.</p>

  <p>The benchmark is maintained as a moving target. v1.1 (July 2026) added
  independent judges for contamination, API use and PostTrainBench lookup,
  banned distillation through hosted APIs, and flagged a GPT-5.6 Sol run for
  consulting published traces; the authors published a response to Epoch AI's
  independent review of v1.1. v1.2 (30 September 2026) dropped BFCL,
  reweighting six benchmarks (AIME 2025, Arena-Hard writing, GPQA Main,
  GSM8K, HealthBench, HumanEval). On v1.2 Claude Fable 5.1 leads at
  <strong>44.6%</strong>, ahead of Claude Opus 5.5 at max effort (43.8%) and
  GPT-6 Astra (41.9%), against 48.4% for the official instruct models, so
  the gap that was 28 points in March is now under 4.
  <strong>Epoch AI includes PostTrainBench v1.1 in the Epoch Capabilities
  Index</strong>, and Google reports it for
  <a href="/outputs/google/gemini-4-argon">Gemini 4 Argon</a>. The authors are
  at the ELLIS Institute Tübingen, the Max Planck Institute for Intelligent
  Systems and the Tübingen AI Center (Ben Rank and Hardik Bhatnagar co-first,
  Ameya Prabhu, <a href="/people/matthias-bethge">Matthias Bethge</a>, and
  corresponding author Maksym Andriushchenko), with two co-authors listed at
  Thoughtful Lab.</p>
