description: >
  <p>Bethge and Geiping (ICML 2025): the CAPA probabilistic similarity
  metric shows model mistakes grow more correlated as capability rises
  &mdash; undermining LLM-as-judge and weak-to-strong oversight, which
  assume errors are independent. A load-bearing result for AI-oversight
  research and a pillar of the cluster's evaluation-science line.</p>
