description: >
  <p>Andreas Geiger's data-driven, non-reactive autonomous-vehicle
  simulation benchmark (NeurIPS 2024) &mdash; the basis of the CVPR
  Autonomous Grand Challenge (143 teams in 2024). NAVSIM v2
  ("Pseudo-Simulation for Autonomous Driving", CoRL 2025) adds two-stage
  pseudo-simulation that correlates strongly with closed-loop evaluation
  and anchored the CVPR 2025 challenge.</p>
