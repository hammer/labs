description: >
  <p><strong>Equivariant Neural Fields</strong> (ICLR 2025) &mdash;
  geometry-grounded conditional neural fields built on <a
  href="/people/erik-j-bekkers">Bekkers</a>' PONITA weight-sharing
  framework (PONITA itself ICLR 2024). The <strong>Equivariant Eikonal
  Networks</strong> follow-up (2025-05, preprint-stage) does grid-free
  seismic travel-time prediction that generalizes across velocity
  models. AMLab UvA (Wessels, Knigge, Vadgama, <a
  href="/people/efstratios-gavves">Gavves</a>, Bekkers).</p>
