description: >
  <p><strong>TULIP: Token-length Upgraded CLIP</strong> (ICLR 2025)
  &mdash; breaks CLIP's 77-token caption limit via relative positional
  encodings plus distillation, with released checkpoints; adopted by the
  open image-generation community for long-caption retrieval and
  generation. All-UvA author list (Najdenkoska, Derakhshani, Asano, van
  Noord, Worring, <a href="/people/cees-g-m-snoek">Snoek</a>); Asano has
  since left UvA.</p>
