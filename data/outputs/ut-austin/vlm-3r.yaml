description: >
  <p>Vision-language model augmented with instruction-aligned
  <strong>monocular 3D-reconstruction tokens</strong> (CVPR 2026): fuses
  geometry from video directly into the VLM for spatial reasoning without
  depth sensors, and introduces the VSTI benchmark for visual
  spatial-temporal intelligence (427&#9733;). VITA group work continuing
  under Zhangyang Wang's UT students while he is on leave at XTX
  Markets.</p>
