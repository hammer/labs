description: >
  <p>Humanoid manipulation from a <strong>single human RGB-D video</strong>
  (CoRL 2024): object-aware retargeting generates a manipulation plan from
  one demonstration and adapts humanoid motion to new object locations at
  test time. From Yuke Zhu's Robot Perception &amp; Learning lab with
  NVIDIA co-authors &mdash; joint attribution; the NVIDIA-branded GR00T
  stack Zhu co-leads at GEAR is tracked under NVIDIA, not here.</p>
