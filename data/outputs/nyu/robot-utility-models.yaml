description: >
  <p>Zero-shot-deployable general robot policies from NYU's Pinto/
  Shafiullah robotics group (with Hello Robot and Meta). Robot Utility
  Models achieve ~90% success in 25 novel environments with no
  per-environment fine-tuning, demonstrating that carefully collected
  multi-environment demonstration data yields robot policies that
  generalize out of the box.</p>
