description: >
  <p>A spatially-grounded video MLLM family (0.5B&ndash;7B) from
  <a href="/people/saining-xie">Saining Xie</a>'s group with Stanford,
  adding predictive-sensing memory for long video understanding. Released
  with the VSI-590K training data and the VSI-SUPER stress test; weights
  and data are on HuggingFace (Cambrian-S-3M, ~13K downloads).
  <a href="/people/yann-lecun">Yann LeCun</a> is a co-author at his NYU
  exit. Successor to <a href="/outputs/nyu/cambrian">Cambrian-1</a> on the
  <a href="/outputs/nyu/vsi-bench">VSI-Bench</a> spatial-intelligence
  agenda.</p>
