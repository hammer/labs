description: >
  <p>A 1M-FPS GPU-accelerated multi-agent driving simulator built on the
  Madrona engine, from Eugene Vinitsky's Emerge Lab (ICLR 2025,
  ~600&#9733;). GPUDrive makes large-scale multi-agent reinforcement
  learning for driving tractable on a single GPU; it continued as
  PufferDrive (2025) with a self-play robustness follow-up (2026).</p>
