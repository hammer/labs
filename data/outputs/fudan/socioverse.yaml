description: >
  <p>Social-simulation "world model" backed by a pool of <strong>10
  million real users</strong>, aligning LLM-agent populations to
  real-world survey and behavioral distributions for large-scale social
  simulation (200+&#9733;). From FudanDISC
  (<a href="/people/zhongyu-wei">Zhongyu Wei</a>), the group's anchor
  social-agent artifact.</p>

  <p><strong>SocioVerse2</strong> (September 21, 2026, with the Shanghai
  Innovation Institute) extends the framework to longitudinal, dynamic
  simulation under a human&ndash;AI co-evolutionary paradigm, with an open
  SocioVerse Challenge running through October 31.</p>
