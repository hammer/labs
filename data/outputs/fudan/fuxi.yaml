description: >
  <p>Family of ML weather/ocean forecasting foundation models from the
  Fudan AI Innovation &amp; Incubation Institute (Hao Li group).
  <strong>FuXi-2.0</strong> couples atmosphere and ocean surface for
  practical medium-range forecasting, beating ECMWF HRES on key
  variables including wind power. <strong>FuXi-Ocean</strong> (2025) is
  the first data-driven global ocean forecast at eddy-resolving
  1/12&deg; resolution, sub-daily, down to 1500m depth, with a
  Mixture-of-Time module. <strong>FuXi-ENS</strong> (Science Advances
  2025) is a VAE-based ML ensemble that beats the ECMWF ensemble's CRPS
  on <strong>98.1%</strong> of variable/lead-time combinations &mdash;
  with strong adoption in the AI-weather community.</p>
