description: >
  <p>Unified <strong>any-to-any multimodal LLM</strong> handling text,
  speech, image, and music via discrete sequence modeling &mdash; all
  modalities tokenized into a shared vocabulary, trained without
  architecture changes to the base LLM. A widely-cited early omni-modal
  LLM (ACL 2024) from <a href="/people/xipeng-qiu">Xipeng Qiu</a> and
  <a href="/people/tao-gui">Tao Gui</a>'s Fudan/OpenMOSS groups.</p>
