description: >
  <p>The serving system that introduced <strong>iteration-level
  scheduling</strong> &mdash; now known as continuous batching &mdash;
  plus selective batching for transformer inference (Gyeong-In Yu et
  al., <a href="/people/byung-gon-chun">Byung-Gon Chun</a>'s group;
  36.9x throughput over FasterTransformer at equal latency). The
  foundational technique beneath vLLM, TGI, TensorRT-LLM, and
  effectively every modern LLM serving stack. Legacy anchor: Chun now
  builds serving infrastructure full-time at FriendliAI, with his SNU
  professorship on leave.</p>
