description: >
  <p>ICML 2025: post-training LLM quantization that injects
  <strong>end-loss gradient information</strong> into the layer-wise
  quantization objective, improving weight-only scalar, weight-only
  vector, and weight-and-activation quantization at 2&ndash;4 bits.
  From Hyun Oh Song's MLLab, with the Q-Palette follow-up
  (fractional-bit quantizers, NeurIPS 2025) extending the line.</p>
