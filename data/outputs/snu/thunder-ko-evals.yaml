description: >
  <p>Localized Korean benchmark set from the Thunder Research Group:
  SNU_Ko-GSM8K, Ko-IFEval, Ko-ARC, Ko-EQ-Bench, Ko-WinoGrande,
  Ko-LAMBADA, and Ko-MuSR &mdash; careful Korean localizations of
  standard reasoning/instruction benchmarks rather than raw
  translations &mdash; plus the Thunder-NUBench / Thunder-KoNUBench
  negation-understanding benchmarks (the Korean one evaluated across
  47 LLMs). Built to evaluate <a
  href="/outputs/snu/thunder-llm">Thunder-LLM</a> and other Korean
  models, released 2024-12 through 2025.</p>
