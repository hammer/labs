description: >
  <p>EMNLP 2025 Findings: the first Korean legal de-identification
  dataset &mdash; ~27K annotated entities across 595 fine-grained
  types over court judgments &mdash; paired with SNU_Thunder-DeID
  encoder models (340M/750M/1.5B) that set state of the art on
  court-judgment de-identification. Part of the Thunder group's
  Korean data stack around <a
  href="/outputs/snu/thunder-llm">Thunder-LLM</a>.</p>
