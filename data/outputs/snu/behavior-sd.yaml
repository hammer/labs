description: >
  <p>NAACL 2025 <strong>Senior Area Chair Award</strong> (Speech/SLU):
  108K full-duplex spoken dialogues (2,164 hours) with per-utterance
  annotation of conversational behaviors &mdash; backchannels,
  interruptions, filler words &mdash; plus <strong>BeDLM</strong>, a
  behavior-conditioned full-duplex dialogue LM trained on it. From
  <a href="/people/gunhee-kim">Gunhee Kim</a>'s Vision &amp; Learning
  Lab; a rare large-scale resource for naturalistic speech-to-speech
  modeling.</p>
