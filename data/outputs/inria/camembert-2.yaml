description: >
  <p>The reference French encoder line from Inria ALMAnaCH. The original
  CamemBERT (2019, with FAIR and Sorbonne) still sees ~1.05M downloads a
  month; <strong>CamemBERT 2.0</strong> (2024, RoBERTa + DeBERTaV3
  variants on 275B tokens) and <strong>ModernCamemBERT</strong> (2025, a
  ModernBERT port on 1T high-quality French tokens with a controlled
  architecture study) refresh it. The encoder foundation beneath the
  generative <a href="/outputs/inria/gaperon">Gaperon</a> line.</p>
