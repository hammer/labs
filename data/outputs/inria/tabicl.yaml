description: >
  <p>Inria Soda's tabular foundation models &mdash; Europe's counterweight
  to TabPFN. <strong>TabICL</strong> (ICML 2025, 1.2K&#9733;) uses
  column-then-row attention to scale in-context learning to 500K rows,
  beating TabPFNv2 and CatBoost on large tables; <strong>CARTE</strong>
  (ICML 2024) models each row as a star-graph with string embeddings,
  enabling cross-table transfer without column matching. Genuine transfer
  FMs for the most common data modality in the enterprise.</p>
