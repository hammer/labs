description: >
  <p>A life-cycle interactive environment for legal agents (with Fudan
  DISC): simulates Chinese civil litigation across five causally connected
  stages, grounded in ~75K real judgments, with memory infrastructure and
  skill libraries; evaluation involved 200+ legal professionals. Notable
  as domain-expert agentic-environment work &mdash; the legal analogue of
  the medical and coding environment lines &mdash; and as RL-environment
  inventory for legal-domain agents.</p>
