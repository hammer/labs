description: >
  <p>"Scaling FP8 Training to Trillion-Token LLMs" (ICLR 2025
  <strong>Spotlight</strong>): the first FP8 training run at trillion-token
  scale, exposing late-training instabilities &mdash; SwiGLU-induced outlier
  amplification &mdash; that are invisible in the short runs prior FP8 work
  relied on. Joint with Intel but university-led by
  <a href="/people/daniel-soudry">Daniel Soudry</a>.</p>
