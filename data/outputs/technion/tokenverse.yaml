description: >
  <p>"TokenVerse: Versatile Multi-concept Personalization in Token Modulation
  Space" (SIGGRAPH 2025 <strong>Best Paper</strong>): disentangles distinct
  concepts &mdash; objects, materials, lighting, poses &mdash; in a
  DiT's per-token modulation space from single images, then recombines them
  for controllable generation. A Google DeepMind / Weizmann Institute
  collaboration with <a href="/people/tomer-michaeli">Tomer Michaeli</a>'s
  group.</p>
