description: >
  <p>"An Edit Friendly DDPM Noise Space: Inversion and Manipulations"
  (CVPR 2024): the foundational edit-friendly DDPM inversion that anchors
  <a href="/people/tomer-michaeli">Tomer Michaeli</a>'s 2024&ndash;26
  image-editing series. The seed predates our tracking window but anchors the
  line, and it has been heavily adopted as a base for diffusion-editing
  methods.</p>

  <p>In-window continuations: <strong>FlowEdit</strong> (ICCV 2025 Oral;
  inversion-free, optimization-free, model-agnostic flow editing,
  <a href="https://arxiv.org/abs/2412.08629">arXiv 2412.08629</a>, widely
  reimplemented in ComfyUI) and <strong>SAEdit</strong>
  (<a href="https://arxiv.org/abs/2510.05081">arXiv 2510.05081</a>;
  sparse-autoencoder token-level control for continuous image editing).</p>
