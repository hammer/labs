  training_tokens: 10T
  training_hardware: TPU v4
  license: OpenMDW-1.1
  variants:
    - name: snowball-67b-a2b-base-262k-qk157
      notes: "Naive long-context extension, QK multiplier 1.57"
    - name: snowball-67b-a2b-base-262k-qk175
      notes: "Raised attention scale for 262K context (QK multiplier 1.75)"
    - name: snowball-67b-a2b-base-262k-qk175-skew2 / skew4 / skew8
      notes: "QK 1.75 with long-context documents upsampled 2x, 4x or 8x during the extension"
