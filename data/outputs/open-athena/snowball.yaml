description: >
  <p>Marin's <strong>67B-total, roughly 2B-active</strong> mixture-of-experts
  model, built in Marin's own "Grug MoE" architecture and pretrained from scratch on <strong>10T tokens</strong> on TPU
  v4 by the Marin team at <a href="/labs/open-athena">Open Athena</a>. It has 26
  layers, a hidden size of 2,560, grouped-query attention with 20 query and 5
  key-value heads, and 256 routed experts with four selected per token plus a
  shared expert, over a 128,256-token vocabulary; router biases from Marin's
  quantile-balancing scheme are folded into the exported weights.</p>

  <p>Context was then extended to <strong>262,144 tokens</strong> in a
  1,000-step run (steps 156,000 to 157,000), and on September 9, 2026 Open
  Athena published five BF16 base checkpoints from that comparison on
  HuggingFace under the OpenMDW-1.1 license: two attention-scaling settings
  (QK multiplier 1.57 and 1.75) and three that upsample long documents 2&times;,
  4&times; or 8&times;. They are base models with no instruction tuning, and
  serving them needs Marin's vLLM fork, which registers the GrugMoE
  architecture. Supervised fine-tuning at 262K context and RLVR runs on
  top of Snowball followed as further public experimental checkpoints in
  September; the team also built an end-to-end post-training pipeline
  for it. Snowball sits between the dense
  <a href="/outputs/open-athena/marin">Marin 32B</a> and the 535B-total,
  23B-active MoE that Marin began pretraining in August 2026.</p>

  <p>The first named post-trained release, <strong>Marin Snowball 67B-A2B
  v0.1</strong>, appeared on October 19. The card labels it a "research
  artifact" that "has not been properly tested or evaluated." It starts from
  a DARE-TIES merge of three Grug-67B-A2B / Snowball RLVR checkpoints, then
  runs 14 updates of asynchronous RLOO-N (a leave-one-out policy gradient with
  truncated importance sampling) on 64 H100s for policy training plus 48 for
  inference. The 69,487 training tasks are 12,123 NVIDIA Nemotron tasks and
  57,364 "structural closure" tasks, and both the task files and the configs
  are public. On the team's own development validation set, which it has
  inspected repeatedly, combined pass@1 rose from 41.2% to 50.2%: NVIDIA-task
  reward improved and structural reward fell from 39.1 to 32.9. The card
  states plainly that its inline BFCL-Parity, SWE-bench Verified and OT-TBLite
  runs "encountered endpoint errors and timeouts. They do not establish valid
  benchmark performance." <strong>v0.1.1</strong> (October 22) adds a
  low-learning-rate identity SFT. It raises the 60-question identity panel
  from 7/60 to 45/60 but regresses MATH500 from 461 to 449 of 500 and GSM8K
  from 1,224 to 1,038 of 1,319, and the card calls it "not a regression-free
  replacement." Both are OpenMDW-1.1 and need Marin's vLLM build.</p>
