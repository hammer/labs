description: >
  <p><a href="/labs/china-mobile">China Mobile</a>'s Jiutian LLM line reaches
  frontier-adjacent territory: <strong>JT-4.1 Flash</strong> is a
  <strong>236B-total / 21B-active MoE</strong> with a
  <strong>256K-token context</strong>. Artificial Analysis scores it
  <strong>34 on Intelligence Index v4.3.2</strong> with reasoning and 27 in
  non-reasoning mode (two AA pages, both dated July 9) &mdash; a notable result for a
  model from a state-owned telecom's in-house AI brand rather than a dedicated
  frontier lab. Released 9 July 2026.</p>

  <p><em>Weights are not publicly available; the 21B active-parameter figure
  follows China Mobile's "236B A21B" model-naming convention. The 236B/21B
  MoE config matches DeepSeek-V2's published architecture, but the Jiutian
  team's documented pattern is adopting open architectures while pretraining
  from scratch (JT-Coder-8B-Base is stated "from-scratch" with a
  Qwen-compatible design, and JT-Safe/arXiv 2510.17918 documents the sibling
  JT-35B-Base's full in-house pretraining pipeline on domestic clusters) —
  no source claims weight-level derivation.</em></p>
