description: >
  <p>"Democratizing protein language model training, sharing and
  collaboration" (<em>Nature Biotechnology</em> 2025). SaprotHub lets
  bench biologists <strong>train and share PLM adapters without
  coding</strong>, turning SaProt into reusable, community-contributed
  building blocks. Co-authored with Sergey Ovchinnikov (OpenFold), it is
  the transfer/adoption infrastructure layer of
  <a href="/people/fajie-yuan">Fajie Yuan</a>'s protein-FM stack.</p>
