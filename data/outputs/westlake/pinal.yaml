description: >
  <p><strong>Text-to-protein de novo design</strong> from
  <a href="/people/fajie-yuan">Fajie Yuan</a>'s lab: a
  <strong>16B-parameter</strong> model trained on 1.7B protein-text
  pairs that generates novel proteins from a natural-language
  specification via a two-stage (language&rarr;structure&rarr;sequence)
  process, beating ProteinDT, Chroma and ESM3. Featured in
  <em>Nature News</em>; a flagship generative science FM in the lab's
  protein-design line.</p>
