name: SaProt
slug: saprot
lab: westlake
type: model
date: 2024-05-07
flagship: true
sources:
  - label: GitHub
    url: https://github.com/westlake-repl/SaProt
  - label: OpenReview (ICLR 2024)
    url: https://openreview.net/forum?id=6MRm3G4NiU
