description: >
  <p>An open-source <strong>dual-system Vision-Language-Action
  model</strong> for robot manipulation from
  <a href="/people/donglin-wang">Donglin Wang</a>'s Machine Intelligence
  Lab (MiLAB), released with a survey/empirical analysis of dual-system
  VLA design. OpenHelix is <strong>SOTA among dual-system VLAs on CALVIN
  ABC-D</strong>, extending the lab's embodied-FM line (QUAR-VLA).</p>
