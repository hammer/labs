description: >
  <p>Zhipu / <a href="/labs/zai">Z.ai</a>'s flagship <strong>coding-first
  agentic model</strong> and successor to
  <a href="/outputs/zai/glm-5.1">GLM-5.1</a> — a <strong>744B MoE (40B active; ~753B by
  safetensors count) with
  DeepSeek Sparse Attention (DSA)</strong> and the <strong>highest-scoring
  open model on the AA Intelligence Index at release (53 on v4.1.1, #1 of 92; 43 on v4.2)</strong>.
  Launched 2026-06-13 on the GLM Coding Plan tiers; full <strong>MIT open
  weights</strong>, standalone API, and benchmarks followed 2026-06-16. First
  GLM with a "solid" <strong>1M-token context</strong> (131,072 max output),
  with High/Max thinking-effort presets (Max recommended for coding).</p>

  <p>Architecture: introduces
  <strong><a href="/outputs/zai/indexshare">IndexShare</a></strong>
  (<a href="https://arxiv.org/abs/2603.12201">arXiv 2603.12201</a>) — reusing
  one lightweight sparse-attention indexer across every four layers to cut
  per-token FLOPs <strong>2.9× at 1M context</strong> — plus an improved MTP
  layer that lifts speculative-decoding acceptance length up to 20%.
  Self-reported benchmarks: AIME 2026 99.2, GPQA-Diamond 91.2, IMOAnswerBench
  91.0, SWE-bench Pro 62.1, Terminal-Bench 2.1 82.7 (best harness), DeepSWE
  46.2, FrontierSWE 74.4 — a large jump over GLM-5.1 and competitive with
  Claude Opus 4.8 / GPT-5.5 / Gemini 3.1 Pro at far lower cost. Pure MIT
  license, no regional limits.</p>
