description: >
  <p>The first multimodal (text + speech + visual) cultural
  question-answering benchmark for African languages &mdash; ACL 2026
  Social Impact Award. The v1 paper covers ~7.5K QA pairs across 15
  languages (since expanded to ~8K/16 per MBZUAI's coverage); models that
  answer correctly in English routinely fail the same cultural questions
  asked in African languages, quantifying a compounding
  language-and-culture gap.</p>
