    - name: K2-Horizon-MoVA-36B-A4B
      parameters: 36B
      active_parameters: 4B
      notes: "48 layers; 100 FFN experts (top-8) plus MoVA with 64 attention-value experts (top-4). Terminal-Bench 2.1 58.6, GPQA Diamond 80.8, HLE 25.2, tau3-Banking 26.8. GGUF released."
    - name: K2-Horizon-32B
      parameters: 32B
      notes: "Dense, 64 layers, hidden 5,120. Hugging Face hosts the Stage-1 checkpoint at launch; the final checkpoint is marked as forthcoming. FP8 and GGUF released."
