description: >
  <p>The training data behind <a href="/outputs/mbzuai/k2-horizon">K2
  Horizon</a>, released by IFM under CC-BY-4.0 from August 24, 2026:
  <strong>TxT360-v2</strong>, the successor to
  <a href="/outputs/mbzuai/txt360">TxT360</a> with web-high, medium, and QA
  subsets, plus Code-Reasoning (seven subsets), Math-Reasoning (five),
  SFT-Reasoning, and Pretrain-Behaviors. A PR-based agentic-code synthesis
  pipeline (PRism-synthesis) followed on GitHub in September. Filed late;
  the K2 Horizon entry had listed its training data as forthcoming.</p>
