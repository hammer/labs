name: "Omni-Embed-Mini: Binding Modalities Without Forgetting via Dense Distillation"
slug: omni-embed-mini
lab: mbzuai
type: model
date: 2026-10-01
sources:
  - label: Paper (arXiv)
    url: https://arxiv.org/abs/2610.02148
  - label: HuggingFace (0.9B)
    url: https://huggingface.co/MBZUAI/Omni-Embed-Mini-0.9B
  - label: HuggingFace (2.3B)
    url: https://huggingface.co/MBZUAI/Omni-Embed-Mini-2.3B
  - label: HuggingFace (Omni-Sets)
