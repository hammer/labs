description: >
  <p>Zero-shot time-series foundation model from Amazon Science.
  <strong>120M parameters</strong>, T5-style <strong>encoder-only</strong>
  with a group-attention mechanism. Unlike its predecessors, Chronos-2 unifies
  <strong>univariate, multivariate, and covariate-informed</strong> forecasting
  in one model and produces multi-step quantile forecasts.</p>

  <p>State-of-the-art zero-shot accuracy among public models on
  <strong>fev-bench</strong>, <strong>GIFT-Eval</strong>, and the
  <strong>Chronos Benchmark II</strong>. Max context 8,192; max prediction
  1,024 steps. Over 300 series-per-second on a single A10G. Apache 2.0.
  Crossed 13M downloads within days of the HuggingFace push (highest-volume
  time-series FM on the platform).</p>
