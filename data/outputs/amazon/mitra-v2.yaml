description: >
  <p>Amazon's tabular foundation model for classification and regression,
  trained <strong>only on synthetic data</strong> from a pretraining
  distribution far larger and more diverse than Mitra-v1's. A small 2D
  Transformer backbone handles longer contexts and wider feature spaces, and
  the report evaluates on more than 300 real-world datasets across TabArena and
  TALENT under two protocols, claiming state of the art on the full TabArena
  benchmark for problems from credit-risk scoring and clinical prediction to
  equipment failure and house prices. Released 3 September 2026 with weights
  under the AutoGluon organisation.</p>
