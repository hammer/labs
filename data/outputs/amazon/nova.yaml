name: Amazon Nova
slug: nova
lab: amazon
type: model
date: 2024-12-03
flagship: false
sources:
  - label: Announcement
    url: https://techcrunch.com/2024/12/03/amazon-announces-nova-a-new-family-of-multimodal-ai-models/
  - label: Technical Report
    url: https://www.amazon.science/publications/the-amazon-nova-family-of-models-technical-report-and-model-card
  - label: Technical Report (arXiv)
    url: https://arxiv.org/abs/2506.12103
  - label: Artificial Analysis (Pro)
