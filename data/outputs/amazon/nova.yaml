description: >
  <p>Initial Nova family launched at AWS re:Invent 2024. <strong>Nova Pro</strong>
  (multimodal, 300K context), <strong>Nova Lite</strong> (multimodal, 300K, low cost),
  <strong>Nova Micro</strong> (text-only, 128K, fastest). Also includes Nova Canvas
  (image generation) and Nova Reel (video generation). Superseded as the AGI org's
  flagship by <a href="/outputs/amazon/nova-premier">Nova Premier</a> (April 2025)
  and then <a href="/outputs/amazon/nova-2">Nova 2</a> (December 2025).</p>

  <p>AA Intelligence Index v4.1: <strong>8</strong> (Pro), <strong>5</strong>
  (Micro). AA's Nova Pro page now points users to Nova 2 Pro Preview as the
  current recommended replacement. Proprietary, available via Amazon Bedrock.</p>

  <p><em>Parameter counts below are third-party estimates by Alan D. Thompson
  (LifeArchitect.ai) &mdash; Amazon does not publish official parameter counts
  for the Nova family.</em></p>
tags:
  - frontier
  - multimodal
