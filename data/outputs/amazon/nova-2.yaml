description: >
  <p>Generational successor to the Nova 1 family, launched at AWS re:Invent 2025
  (December 2). Adds <strong>extended thinking with three configurable budgets</strong>
  (low / medium / high), a <strong>1M-token context window</strong> across the
  reasoning tiers, and built-in web grounding plus a code interpreter. Authored
  by the Amazon AGI org under <a href="/people/peter-desantis">Peter DeSantis</a>
  (heading the unified AGI/Silicon/Quantum group from December 2025).</p>

  <p>The family covers four models. <strong>Nova 2 Pro</strong> (preview only) is
  the most capable reasoner. <strong>Nova 2 Lite</strong> is the cost-tier reasoner
  at the same context length. <strong>Nova 2 Omni</strong> is a unified multimodal
  reasoner that accepts text, images, video, and audio as input and produces both
  text and image outputs &mdash; the first Nova entry with native image generation
  inside a reasoning loop. <strong><a href="/outputs/amazon/nova-sonic">Nova 2
  Sonic</a></strong> is the speech-to-speech model (its own page).</p>

  <p>Top AA Intelligence Index v4.2 score in the family is <strong>16</strong>
  (Nova 2 Pro Preview, medium thinking) &mdash; a meaningful jump over the
  Nova Premier predecessor (13). Proprietary, available via Amazon Bedrock.</p>
