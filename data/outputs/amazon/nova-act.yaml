description: >
  <p>Browser-control agent &mdash; the first public product from Amazon's AGI lab
  under <a href="/people/pieter-abbeel">Pieter Abbeel</a> and David Luan
  (ex-Adept). Released March 31, 2025 as a research preview, then re-released
  at re:Invent 2025 as a GA service backed by a <strong>custom-trained Nova 2
  Lite</strong> specialized for browser control. Reports
  <strong>90%+ task reliability at scale</strong> with automatic containerization
  and deployment to AWS AgentCore Runtime.</p>

  <p>On <strong>ScreenSpot Web Text</strong> (UI element grounding), Nova Act
  scored <strong>94%</strong> at launch, ahead of OpenAI's CUA (88%) and
  Anthropic's Claude 3.7 Sonnet (90%). The SDK provides an action API for
  composing browser tasks and a live browser view for execution logging.
  Available via Amazon Bedrock and AgentCore.</p>
tags:
