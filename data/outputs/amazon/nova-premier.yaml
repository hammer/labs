description: >
  <p>Top of the Nova 1 family and distillation teacher for the smaller Nova variants.
  <strong>1M token context</strong>; processes text, images, and video. Held the
  AGI org's flagship slot from launch (April 2025) until
  <a href="/outputs/amazon/nova-2">Nova 2</a> superseded it at re:Invent 2025
  (December 2). Still active on Bedrock.</p>

  <p>AA Intelligence Index v4.1: <strong>13</strong>.</p>

  <p><em>Parameter count is a third-party estimate &mdash; Amazon has never
  disclosed the size. The 470B figure originates in a June 2024
  <a href="https://fortune.com/2024/06/06/amazon-llm-2-trillion-parameters-olympus-arrika-rohit-prasad-ai/">Fortune
  report</a> on the in-progress "Olympus" model that became Nova Premier, and is
  cited as such by <a href="https://lifearchitect.ai/olympus/">LifeArchitect.ai</a>.</em></p>
