description: >
  <p><a href="/labs/sapiens-ai">Sapiens AI</a>'s flagship: a closed, paid,
  API-only multimodal reasoning model (text + image in, text out) for coding,
  scientific reasoning, long-context, and agentic workflows. Supports a
  <strong>1M-token context</strong> (max output ~65K). released as an "Alpha" on 24 July 2026 (its AA page reads <strong>27 on Intelligence Index v4.3</strong>); the <strong>Beta</strong> checkpoint of 26
  August 2026, priced at $0.10 per million input tokens and $0.30 per million
  output, scores <strong>35 on v4.3</strong> and is the entry's anchor.</p>

  <p><em>Architecture, parameter count, and base model are undisclosed; weights
  are proprietary (not open). Despite the company's "built from scratch"
  marketing, there is no evidence Agnes 2.5 Pro was pretrained from scratch: its
  own docs disclose no training method, and in a founder interview Bruce Yang
  describes their approach as "post-training from the pre-trained models like
  Qwen and DeepSeek" (and distilling from deployed SOTA models) rather than
  training a foundation model from scratch. Served via Sapiens AI's API.</em></p>
tags:
