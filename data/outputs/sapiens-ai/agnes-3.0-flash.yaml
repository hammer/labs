name: Agnes 3.0 Flash
slug: agnes-3.0-flash
lab: sapiens-ai
type: model
date: 2026-09-11
sources:
  - label: Artificial Analysis
    url: https://artificialanalysis.ai/models/agnes-3-0-flash
  - label: HuggingFace (Agnes-3.0-Flash Preview, open weights)
    url: https://huggingface.co/Agnes-AI/Agnes-3.0-Flash
  - label: HuggingFace (Agnes-3.0-Qwen, open weights)
