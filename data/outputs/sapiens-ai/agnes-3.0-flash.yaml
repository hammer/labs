  - multimodal
  - open-weight
  - agentic
model:
  open_weights: true
  architecture: dense
  # Preview open-weight checkpoint; the API model's size is undisclosed.
  parameters: "33B"
  context_window: 1000000
  # Base undisclosed; config matches Qwen3.5-27B plus eight layers (see description).
  pretrained_from_scratch: false
  intelligence_index: 36
  intelligence_index_version: "AA v4.3.2"
  license: "Apache 2.0 (Preview weights); API model proprietary"
  variants:
    - name: Agnes 3.0 Flash (API)
      notes: "Proprietary reasoning model, 1M context, $0.05/$0.15 per million tokens; AA Intelligence Index v4.3: 36 (listed 11 Sep 2026)."
    - name: Agnes-3.0-Flash Preview (open weights)
      parameters: 33B
      notes: "Apache 2.0 checkpoint on HuggingFace (11 Sep 2026): 72 layers, hidden 5120, 262,144 context, image and video input; not the checkpoint AA scored."
    - name: Agnes-3.0-Qwen (open weights)
      notes: "10 Oct 2026; post-trained derivative of Qwen3.8-Flash-Next (base_model qwen3.8-flash-next): ~180B total hybrid-attention MoE, 512 experts / 10 active, 1M context, text+image+video in; Qwen Community License 1.0; self-reported Terminal-Bench 2.1 87.8, IFBench 79.6; not scored by AA."
