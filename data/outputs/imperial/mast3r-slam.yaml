description: >
  <p>The first real-time dense SLAM system built on 3D-reconstruction
  foundation priors (CVPR 2025; 3.1K&#9733;, ~240 citations) &mdash; the
  Dyson Robotics Lab's marquee artifact of the foundation-prior era,
  with a clear follow-on ecosystem. The prior itself (MASt3R) is
  Naver's; Imperial's contribution is the real-time SLAM system on top.
  The lineage continues with 4DTAM (CVPR 2025, first full 4D SLAM via
  dynamic surface Gaussians) and KV-Tracker.</p>
