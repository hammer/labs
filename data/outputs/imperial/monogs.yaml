description: >
  <p>Co-launched the Gaussian-splatting-SLAM subfield (CVPR 2024
  Highlight + <strong>Best Demo Award</strong>; 2.1K&#9733;, ~620
  citations): the first monocular live SLAM formulated directly on 3D
  Gaussians. Dated by the award venue; the arXiv preprint (Dec 2023)
  slightly predates our window. Distinct from GS-SLAM (Yan et al.) and
  CMU's SplaTAM.</p>
