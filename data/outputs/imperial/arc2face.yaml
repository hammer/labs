description: >
  <p>ID-consistent human-face foundation model from Zafeiriou's group
  (ECCV 2024 <strong>Oral</strong>; 800&#9733;, weights on HF): a Stable
  Diffusion backbone retrained on WebFace42M to generate from ArcFace
  identity embeddings, with an active downstream ecosystem (Arc2Avatar,
  blendshape variants). Derivative backbone, so no parameters recorded;
  dated by venue (arXiv March 2024). Zafeiriou splits time with
  Google.</p>
