description: >
  <p>The multimodal successor to <a href="/outputs/swiss-ai/apertus">Apertus</a>,
  released 24 July 2026 in <strong>8B and 70B</strong> sizes. Produced by
  <strong>continued pretraining of Apertus 1.0</strong> &mdash; adding a
  multimodal mix of <strong>4T tokens to the 8B and 2T to the 70B</strong> on
  top of the original 15T &mdash; so it keeps the same architecture: a
  decoder-only transformer with the <strong>xIELU</strong> activation and the
  <strong>AdEMAMix</strong> optimizer, trained exclusively on fully open data.</p>

  <p>Three firsts for the family: <strong>native multimodal input</strong>
  (image <em>and</em> audio understanding, text output), an optional
  <strong>thinking mode</strong> for reasoning tasks, and a
  <strong>262,144-token context</strong> (a 4&times; jump over Apertus 1.0's
  65K). The improved post-training recipe also strengthens instruction-following
  and tool use. Still Apache 2.0, still positioned as Switzerland's fully open,
  transparent, EU-AI-Act-aligned sovereign model line.</p>

  <p>The promised results arrived with the <strong>technical report on
  2026-10-11</strong>, eleven weeks after the weights &mdash; <em>Apertus 1.5:
  From Open Text Models to Open Multimodal Reasoners</em>
  (<a href="https://arxiv.org/abs/2610.15542">arXiv:2610.15542</a>), 169+
  authors across ETH Zurich, EPFL, HES-SO Valais-Wallis, FHNW, SDSC, CSCS,
  Zurich and Bern. It confirms the architecture is unchanged and that
  multimodality was integrated <strong>through the tokenizer</strong> rather
  than a separate encoder stack, with text-only output retained. The 8B gains
  <strong>up to 20 points on mathematical reasoning</strong> in thinking mode,
  and the family improves on nearly every benchmark against Apertus 1.0,
  leading the <em>fully open</em> field on knowledge, instruction-following and
  cultural benchmarks. Models, training recipes, data-preparation details and
  evaluation suites all ship under permissive licences, trained only on openly
  available data &mdash; the claim the project exists to make. Still not scored
  on the Artificial Analysis Intelligence Index.</p>
