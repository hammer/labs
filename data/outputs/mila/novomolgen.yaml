description: >
  <p>A <strong>molecular-generation foundation-model family</strong> pretrained
  from scratch on 1.5B molecules, achieving state of the art on both de-novo and
  goal-directed generation. Released as multiple HuggingFace checkpoints, from
  <a href="/people/sarath-chandar">Sarath Chandar</a>'s lab. NovoMolGen studies
  how molecular-language-model pretraining scales and transfers to downstream
  drug-discovery objectives. (Per-checkpoint parameter counts are not
  individually disclosed.)</p>
