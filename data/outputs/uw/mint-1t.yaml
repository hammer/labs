description: >
  <p>The first 1T-token multimodal <em>interleaved</em> dataset &mdash;
  3.4B images together with text drawn from HTML, PDFs, and arXiv &mdash;
  roughly 10&times; the scale of prior open interleaved corpora (NeurIPS
  2024). UW-led (Anas Awadalla, mlfoundations) with Salesforce, Stanford,
  UT Austin, and Berkeley collaborators; a core resource for training
  open multimodal models.</p>
