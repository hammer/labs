description: >
  <p>A self-synthesis method for alignment data that prompts an aligned
  LLM "with nothing" &mdash; feeding only the chat template's pre-query
  tokens &mdash; to make the model emit both instruction and response
  (ICLR 2025). The resulting datasets are widely reused for SFT
  (magpie-align/magpie, ~873&#9733;). UW-led (Zhangchen Xu et al.).</p>
