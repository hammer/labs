description: >
  <p>A "superword" tokenizer that lets BPE merge across whitespace,
  producing tokens that span multiple words (COLM 2025). SuperBPE improves
  average performance by 4.0% across 30 tasks (+8.2% MMLU) while using 27%
  less inference compute at fixed model size. Clean UW attribution
  &mdash; Alisa Liu, Jonathan Hayase, Sewoong Oh,
  <a href="/people/noah-a-smith">Noah A. Smith</a>, and Yejin Choi.</p>
