description: >
  <p>Cohere's first <strong>fully Apache-2.0-licensed open model</strong> (the
  prior <a href="/outputs/cohere/command-a">Command A</a> was CC-BY-NC).
  <strong>218B total / 25B active MoE</strong> with vision-language input,
  128K context (64K output), 48 languages (up from 23), agentic tool use, and
  native citation generation via embedded grounding-span tags that link every
  factual claim to its source document.</p>

  <p>Two infrastructure stories sit alongside the model. First, the W4A4
  variant runs on <strong>one NVIDIA B200 or two H100s</strong> at negligible
  quality loss from BF16 &mdash; Cohere only quantizes the MoE experts to
  4-bit while keeping attention pathways at full precision, recovered via
  <em>quantization-aware distillation</em> (a KL-divergence distill from the
  BF16 teacher). Second, the model is positioned for <em>sovereign critical
  infrastructure</em> deployment, the first artifact under the combined
  Cohere &times; <a href="https://aleph-alpha.com/">Aleph Alpha</a> banner
  following their April 2026 merger.</p>

  <p>Self-reported benchmarks: <strong>τ²-Bench Telecom 85%</strong> (up from
  37% on Command A Reasoning), <strong>Terminal-Bench Hard 25%</strong> (up
  from 3%), agentic QA +20% over Command A Reasoning, MMMU 75.1, MMMU-Pro 63,
  MathVista 80.6. <strong>AA Intelligence Index v4.1: 29</strong>. 270 tok/s output speed.</p>
