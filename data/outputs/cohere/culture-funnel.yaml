description: >
  <p>Cohere Labs study showing that explicit cultural signals decline
  sharply through post-training pipelines &mdash; the "cultural data
  funnel" &mdash; with implications for multilingual and multicultural
  model behavior. Ships with <strong>CultureMarkers</strong>, a 5.6M-sample
  culturally-tagged dataset. Continues the Aya line's multilingual-equity
  research agenda.</p>
