description: >
  <p>Song-group benchmark: can agents reproduce and discover exploits
  across 1,507 real-world vulnerabilities from 188 OSS projects? Became
  a reference eval for offensive-cyber capability tracking in
  frontier-model safety assessments. Its successor,
  <a href="/outputs/berkeley/cybergym-e2e">CyberGym-E2E</a> (2026), closes the
  defensive loop from discovery to patch and anchors Artificial Analysis's
  Cyber Index.</p>
