description: >
  <p>The Sky Computing Lab's Agentica team scaled pure RL down and up:
  <strong>DeepScaleR-1.5B</strong> (Feb 2025) surpassed o1-preview on
  AIME via iterative-context GRPO; <strong>DeepCoder-14B</strong> (Apr
  2025) hit o3-mini-level coding; <strong>DeepSWE</strong> (Jul 2025,
  Qwen3-32B) reached then-SOTA open-weight 59% on SWE-bench Verified with
  test-time scaling. Fully open recipes and datasets via the rLLM
  framework; joint with Together AI (compute/marketing) — partial
  company co-attribution.</p>
