  - label: HuggingFace (9B)
    url: https://huggingface.co/tencent/WeMM-Embedding-9B
description: >
  <p>WeChat Vision's universal multimodal embedding family: text, images,
  videos, visual documents and arbitrarily interleaved inputs mapped to a
  shared space with <strong>flexible output dimensions</strong>, in 2B, 4B
  and 9B variants (weights on HuggingFace, August 26, 2026). Trained in two
  stages &mdash; large-scale multimodal alignment, then refinement with
  curated data, fine-grained relevance supervision and cross-scale knowledge
  transfer &mdash; and reports leading results on public multimodal-embedding
  benchmarks.</p>
