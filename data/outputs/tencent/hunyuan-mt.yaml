description: >
  <p>Open-source translation model series supporting 33 languages. Hunyuan-MT-7B
  won first place in 30 of 31 categories at WMT25. <strong>Hy-MT2</strong>
  (May 21, 2026) extends the family with 1.8B / 7B / 30B-A3B variants &mdash;
  the 7B and 30B-A3B reportedly outperform <a href="/outputs/deepseek/deepseek-v4">DeepSeek-V4-Pro</a>
  and <a href="/outputs/moonshot-ai/kimi-k2.6">Kimi K2.6</a> on translation,
  while the 1.8B quantizes to 440MB at 1.25-bit. Ships with <strong>IFMTBench</strong>,
  a companion instruction-following translation benchmark.</p>
