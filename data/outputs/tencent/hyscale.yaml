name: "HyScale: Scaling Long-Context Training for Learned Sparse Attention"
slug: hyscale
lab: tencent
type: paper
date: 2026-11-04
sources:
  - label: Paper (arXiv)
    url: https://arxiv.org/abs/2610.32057
  - label: FlashTopK (GitHub)
    url: https://github.com/Tencent-Hunyuan/FlashTopK
description: >
  <p>A long-context <strong>training</strong> system for learned sparse
  attention, the DeepSeek-V3.2-style design in which a lightweight indexer
  scores every earlier token and attention reads only the top-<em>k</em>. At
  million-token lengths, the selection step becomes the training bottleneck,
  not the attention it feeds. The indexer scores all previous tokens while
  attention reads only <em>k</em> of them, current systems materialize the
  full score table, and activation recomputation repeats the selection. The
  paper's observation is that the output of selection is a set of indices,
  not an activation. Two components follow from it:</p>
  <ul>
    <li><strong>FlashTopK:</strong> a fused kernel that finds each query's
    exact top-<em>k</em> on the fly without materializing a score table. It is
    deterministic and compatible with context parallelism.</li>
    <li><strong>Selection replay:</strong> reuses the forward pass's indices
    during recomputation instead of selecting again.</li>
  </ul>
  <p>Results:</p>
  <ul>
    <li><strong>End to end:</strong> training
    <a href="/outputs/zai/glm-5.1">GLM-5.1</a> on 1M-token sequences runs
    <strong>2.07&times; faster than Megatron-LM on 512 H20
    GPUs</strong>.</li>
    <li><strong>Other sparse-attention layers, at 1M tokens on 32 H800
    GPUs:</strong> 2.01&times; on the CSA layers of
    <a href="/outputs/deepseek/deepseek-v4-flash">DeepSeek-V4-Flash</a> and
    1.57&times; on the QSA layers of
    <a href="/outputs/alibaba/qwen3.8-flash-next">Qwen3.8-Flash-Next</a>.</li>
    <li><strong>FlashTopK alone:</strong> its README reports full-prefill
    selection 1.7&ndash;3.3&times; faster than dense scoring plus FlashInfer
    top-<em>k</em> on trained indexers, and 1.2&ndash;2.0&times; on untrained
    ones.</li>
  </ul>
  <p>The authors are from the University of Edinburgh and Tencent Hunyuan, with
  Luo Mai as senior author. The paper was first submitted on October 23 and
  revised to v3 on November 4. FlashTopK was released as open source on
  November 5 under <code>Tencent-Hunyuan</code>. The paper uses other labs'
  models, and it does not say whether Tencent's own
  <a href="/outputs/tencent/hy4">Hy4</a> was trained with it.</p>
