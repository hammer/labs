model:
  # Video DiT initialized from Helios-base (arXiv 2603.04379, Peking
  # University / PKU-YuanGroup). Helios has no slug of its own — it is covered
  # inside data/outputs/peking/open-sora-plan.yaml — so base_model can't
  # express it. Parameter count is not disclosed, so none is recorded.
  pretrained_from_scratch: false
  license: Custom (Tencent, academic use only)
  benchmark_scores:
    - benchmark: Revisit LPIPS (vs. Lyra 2.0's 0.487)
      score: "0.255"
      mode: WorldCrafter
    - benchmark: Revisit PSNR (vs. Lyra 2.0's 14.050)
      score: "18.016 dB"
      mode: WorldCrafter
    - benchmark: VBench overall (custom-input mode)
      score: "81.910"
      mode: WorldCrafter
  variants:
    - name: WorldCrafter-Base
      notes: >-
        Full-step base model; best camera-control accuracy and best VBench
        overall score
    - name: WorldCrafter-Fast
      notes: >-
        Pyramid-distilled high-noise/low-noise pair; best revisit consistency
        and 16 fps streaming generation on a 4-GPU machine
