description: >
  <p>Tencent Hunyuan (Ziniu Li and colleagues) works the batch-size axis of
  RL scaling: with square-root learning-rate scaling under Adam, GRPO and
  PPO curves become batch-size invariant in samples, so the decision rule
  reduces to throughput gain against the samples-to-target penalty of
  larger batches. Filed late.</p>
