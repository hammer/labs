description: >
  <p>A 3D CT vision-language foundation model from Stanford MIMI
  (Chaudhari lab), pretrained on paired EHR and radiology reports, with
  zero-shot and transfer evidence on phenotype prediction and retrieval
  (Nature 2026). Sibling: MedVAE generalizable medical-image
  autoencoders (MIDL 2025). The medical-FM face of the entry.</p>
