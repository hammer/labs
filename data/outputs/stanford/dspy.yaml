description: >
  <p>Stanford NLP's "programming, not prompting" framework
  (36K&#9733;) &mdash; declarative LM pipelines with automatic prompt/
  weight optimization; the dominant open LM-pipeline toolkit. Originated
  by Omar Khattab (2023); flagship development continued through the
  window. Sibling interpretability stack: pyvene/pyreft (ReFT) and
  AxBench, which showed simple steering baselines beat SAEs.</p>
