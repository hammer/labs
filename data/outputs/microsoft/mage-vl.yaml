description: >
  <p>"Mage-VL: An Efficient Codec-Native Streaming Multimodal Foundation
  Model" &mdash; a 4B VLM that allocates visual tokens like codec bits:
  <strong>&gt;75% fewer visual tokens</strong> and up to 3.5&times; speedup
  while beating Qwen3-VL-4B on all reported video benchmarks, with an
  event-gated live-commentary mode. The <strong>Mage-ViT</strong> encoder is
  trained from scratch; the language decoder is Qwen3-4B. Apache 2.0;
  435K downloads in its first ten days.</p>
