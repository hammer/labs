description: >
  <p>Microsoft's first major foundation model push, releasing <strong>three MAI
  models</strong> in Azure Foundry in April 2026 &mdash; a direct shot at OpenAI
  and Google dependencies &mdash; then refreshing the whole stack at Build 2026
  (June 2) alongside the new <a href="/outputs/microsoft/mai-thinking-1">MAI-Thinking-1</a>
  reasoning model and <a href="/outputs/microsoft/mai-code-1-flash">MAI-Code-1-Flash</a>
  coding model.</p>

  <p><strong>Original April release:</strong> MAI-Transcribe-1 (STT, 25 languages,
  #1 by FLEURS in 11 core languages, beating Whisper-large-v3 and Gemini 3.1
  Flash-Lite); MAI-Voice-1 (TTS, 60 s of audio in &lt;1 s on a single GPU);
  MAI-Image-2 (T2I, debuted #3 on Arena.ai).</p>

  <p><strong>Build 2026 refresh:</strong> <strong>MAI-Transcribe-1.5</strong>
  expands to 43 languages and retains its #1 FLEURS spot (adds content biasing,
  $0.36/hour); <strong>MAI-Voice-2</strong> brings voice cloning and voice
  prompting to 15+ languages ($22/M characters), with a faster
  <strong>MAI-Voice-2-Flash</strong> coming soon; <strong>MAI-Image-2.5</strong>
  adds image-to-image editing and re-debuts at #3 on Arena.ai for image
  families ($1.75/M input tokens, $33/M image output), with a more efficient
  <strong>MAI-Image-2.5-Flash</strong> shipped same day.</p>

  <p><strong>October 1 update:</strong> <strong>MAI-Transcribe-2-Streaming</strong>
  is Microsoft's first streaming ASR model. It covers 60 languages with
  continuous language detection, emits first partials "just over 100ms"
  after receiving audio, and costs $0.54 per hour introductory through year-end.
  Microsoft says it ranks first on Artificial Analysis for accuracy on both
  final and partial transcripts. <strong>MAI-Voice-2.1</strong> extends TTS
  and voice cloning to 23 languages (26 locales), letting one voice speak all of
  them, at $22 per million characters. <strong>MAI-Voice-2.1-Flash</strong>
  keeps those languages at $15 per million characters with a vendor-claimed
  150 ms end-to-end latency. Architecture and parameters for all three are
  undisclosed.</p>

  <p>Marks Microsoft's transition from pure OpenAI dependency to building its
  own frontier multimodal stack under VP GenAI <strong>Mustafa Suleyman</strong>'s
  MAI division. Proprietary, available via Microsoft Foundry plus the
  June 2026 distribution expansion to OpenRouter, Fireworks, and Baseten.</p>
