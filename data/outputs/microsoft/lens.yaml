description: >
  <p>Open <strong>3.8B foundational text-to-image diffusion model</strong> from
  Microsoft. Reports competitive-with-or-better quality than FLUX and Stable
  Diffusion 3 at <strong>~19.3% of Z-Image's training compute</strong>; the
  <strong>Lens-Turbo</strong> variant generates 1024² images in 0.84 s.</p>

  <p>Three checkpoints released: base, Lens-Base, and Lens-Turbo. Microsoft's
  first open competitive frontier-class T2I model. Surfaced as a quiet HF org
  upload on May 22 alongside the arxiv submission &mdash; representative of
  exactly the release path the new HF-probe sweep step is designed to catch.</p>
