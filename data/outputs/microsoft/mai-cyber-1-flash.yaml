description: >
  <p>Microsoft AI's first <strong>cybersecurity model</strong>: a sparse MoE
  (137B total / 5B active, 256K context) in the MAI-Thinking-1 lineage.
  Inside the <strong>MDASH</strong> multi-agent security harness it handles
  ~90% of vulnerability-identification work (GPT-5.4 takes the remainder);
  MDASH scores ~96% on CyberGym, claimed +12 points over Anthropic Mythos
  at half the cost. Proprietary.</p>

  <p><strong>MAI Cyber 1.1 Flash</strong> (October 27, 2026) replaces it as a
  selectable scan profile in MDASH. Microsoft reports performance comparable to
  1 Flash at 18% lower cost per scan on its internal vulnerability-scanning
  suite, with no absolute scores; access stays limited to verified MDASH
  customers. Parameters are not restated for 1.1.</p>
