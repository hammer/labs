description: >
  <p>Microsoft AI's first <strong>cybersecurity model</strong>: a sparse MoE
  (137B total / 5B active, 256K context) in the MAI-Thinking-1 lineage.
  Inside the <strong>MDASH</strong> multi-agent security harness it handles
  ~90% of vulnerability-identification work (GPT-5.4 takes the remainder);
  MDASH scores ~96% on CyberGym, claimed +12 points over Anthropic Mythos
  at half the cost. Proprietary.</p>

  <p><strong>MAI Cyber 1.1 Flash</strong> (October 27, 2026) replaces it as a
  selectable scan profile in MDASH. Microsoft reports performance comparable to
  1 Flash at 18% lower cost per scan on its internal vulnerability-scanning
  suite, with no absolute scores; access stays limited to verified MDASH
  customers. Parameters are not restated for 1.1.</p>

  <p><strong>MAI Cyber 2 Flash</strong> (announced November 17, 2026 at Ignite)
  is the next generation. It has a <strong>1M-token context</strong>, four
  times 1.1 Flash's, and is priced at $0.10 / $0.01 / $0.50 per million
  input / cached / output tokens, which Microsoft says is 86% lower on output
  than 1.1 Flash. Microsoft reports <strong>92.3% on CyberGym-E2E</strong>
  against GPT-6 Astra's 91.5%, at half the reasoning budget and under 2% of the
  cost per task. That figure uses 813 of the 905 tasks: Microsoft dropped 92
  whose projects and vulnerability reports overlap its training data. It also
  reports 40.4% on WebExploitBench against GPT-5.6 Cyber's 38.4%. It ships only
  inside Microsoft security products. In MDASH it replaces the MAI-profile model
  for eligible customers from mid-December. Architecture and parameters are
  undisclosed, and no model card had been posted at announcement.</p>
