description: >
  <p>20B-parameter LLM for <strong>PCB schematic generation from
  natural-language requests</strong>. Built on GPT-OSS-20B and fine-tuned
  on ~8K paired user-request / schematic-code samples synthesized via
  GPT drafting + human correction. Takes a circuit description as input
  (e.g., <em>"a 1.8V regulated supply from VIN using an AP2112K LDO"</em>)
  and outputs Python code that renders into KiCad schematics.</p>

  <p>Evaluated on Valid Circuits (executability), Spatial Violation
  (symbol/wire overlap), and Netlist Accuracy (connectivity vs ground
  truth) &mdash; outperforms frontier LLM baselines on schematic generation.
  13,312-token context. MIT license. Companion paper Luo, Ma, Zhang, Qiu
  (<a href="https://arxiv.org/abs/2605.30345">arXiv 2605.30345</a>).</p>
