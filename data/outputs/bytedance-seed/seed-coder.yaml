description: >
  <p>Open-source 8B code-LLM family (previously branded "Doubao-Coder"). Three
  released variants: <strong>Base</strong> (32K), <strong>Instruct</strong> (32K),
  and <strong>Reasoning</strong> (64K, RL-trained). The technical contribution is
  <em>"LLMs can effectively curate code training data by themselves"</em> &mdash;
  a model-centric data-curation pipeline that beats rule-based filters and
  produces SOTA results among 8B open-source code models on generation,
  completion, editing, reasoning, and SWE tasks.</p>

  <p>Successor in branding (and pretraining recipe) to the closed
  <a href="/outputs/bytedance-seed/doubao-seed-code">Doubao Seed Code</a>
  flagship. MIT license.</p>
