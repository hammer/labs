description: >
  <p>ByteDance's flagship refresh, announced at the 2026 Volcano Engine Force
  Conference in Pro and Turbo tiers. ByteDance positions Pro as crossing a
  "production-grade" threshold across code delivery, long-horizon agent
  tasks, multimodal understanding, and enterprise stability, claiming wins
  over Claude Opus 4.6 on several coding/agent/multimodal benchmarks at
  roughly 80% lower total cost of ownership (6&yen;/30&yen; per million
  input/output tokens; Turbo at half). Closed, API-only via Volcano Engine;
  parameters undisclosed. The Doubao family was reported serving 180T+
  tokens/day at announcement; Seedance 2.5 was teased for July.</p>
