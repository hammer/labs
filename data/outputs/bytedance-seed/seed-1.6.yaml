description: >
  <p>General-purpose multimodal model series introducing
  <strong>Adaptive Chain-of-Thought (AdaCoT)</strong> &mdash; a reward-shaped RL
  recipe that teaches the model to <em>decide</em> whether to think before
  answering, instead of always thinking (like a reasoning model) or never
  thinking (like a base chat model). Three published variants:</p>

  <ul>
    <li><strong>Seed-1.6 (AdaCoT)</strong>: model auto-decides per-prompt; matches
    Full-CoT effectiveness while compressing CoT length significantly</li>
    <li><strong>Seed-1.6-Thinking</strong>: always thinks; reasoning-mode peer of
    Seed1.5-Thinking with VLM capabilities</li>
    <li><strong>Seed-1.6-FullCoT / NoCoT</strong>: ablations used to measure the
    AdaCoT trade-off; FullCoT triggers thinking ~90&ndash;100% of the time on
    AIME / BeyondAIME and matches Thinking-mode quality</li>
  </ul>

  <p>256K context, multimodal (text + image), GUI-interaction-trained. Served
  via the Volcengine API. Not currently scored on Artificial Analysis.</p>
