description: >
  <p>MiniMax's <strong>open-weight omni-modal video generator</strong>
  (Hailuo 3.0): 4&ndash;15s clips with <strong>native 32kHz stereo audio</strong>
  in the same pass, 768p base resolution with 2K via In-Context Regeneration,
  and dialogue in 11 languages. FL2VA (first-and-last-frame) and Ref2VA
  (reference-guided) variants ship openly; the H3-Context-IR stage is
  hosted-only. "MiniMax H3 Community License"; technical report promised.</p>
