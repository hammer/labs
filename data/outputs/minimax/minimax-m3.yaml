description: >
  <p>MiniMax's <strong>natively multimodal frontier MoE</strong> (text + image
  + video → text): ~428B total / ~23B active, 128 experts (top-4 + 1 shared,
  60 layers with the first 3 dense), <strong>1M-token context</strong>, dual
  thinking / non-thinking modes. Its headline contribution is
  <strong><a href="/outputs/minimax/minimax-sparse-attention">MiniMax Sparse
  Attention (MSA)</a></strong> — a learned blockwise sparse attention over GQA
  that cuts per-token attention compute ~28× at 1M context, giving M3 a
  reported ~9× prefill / ~15× decode speedup over M2 at 1M context.</p>

  <p>MiniMax Community License (commercial use needs attribution; written
  authorization above $20M/yr revenue). Self-reported agentic/coding
  benchmarks: SWE-Bench Pro 59.0, Terminal-Bench 2.1 66.0, SWE-fficiency 34.8,
  KernelBench Hard 28.8, MCP-Atlas 74.2. Artificial Analysis lists it on the
  <strong>Agentic Index at 59.1</strong> and now scores it
  <strong>36 on the Intelligence Index v4.2</strong>.</p>
