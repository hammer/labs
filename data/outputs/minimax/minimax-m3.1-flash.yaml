name: MiniMax-M3.1-Flash
slug: minimax-m3.1-flash
lab: minimax
type: model
date: 2026-10-19
flagship: true
sources:
  - label: Announcement (MiniMax blog)
    url: https://www.minimax.io/blog/minimax-m31f
  - label: HuggingFace
