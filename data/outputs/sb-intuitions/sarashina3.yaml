description: >
  <p>SB Intuitions' third-generation flagship series, launched via
  SoftBank's sovereign cloud "Cloud PF Type A" (Oracle Alloy on domestic
  data centers): five models &mdash; mini (standard), nano, guard (safety
  classifier), embedding, and rerank. Pretrained from scratch on "30T
  tokens of large-scale, high-quality data" with curriculum learning;
  post-training uses multi-stage asynchronous RL plus OPSD (on-policy
  self-distillation). Evaluated against Qwen3 4B/30B/235B, GPT-4.1, and
  GPT-5.4 mini on eight benchmarks including ELYZA-tasks-100, AIME 2025,
  IFBench, BFCL v3, and &tau;&sup2;-bench Telecom. API-only; parameter
  counts undisclosed.</p>
