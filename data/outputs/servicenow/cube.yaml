description: >
  <p>A proposed standard for tackling <strong>agent-benchmark fragmentation</strong>:
  CUBE is described as "a universal protocol standard built on
  <strong>MCP and Gym</strong> that allows benchmarks to be wrapped once and used
  everywhere." It separates <strong>task, benchmark, package, and registry</strong>
  concerns into distinct API layers, so a benchmark can be integrated a single time
  and then run across any compliant evaluation platform without bespoke glue code.</p>

  <p>A 10-page position paper with an open-source reference implementation
  (<a href="https://github.com/The-AI-Alliance/cube-standard">The-AI-Alliance/cube-standard</a>).
  Led by <strong>ServiceNow AI Research</strong> (first author Alexandre Lacoste,
  with Nicolas Gontier, Massimo Caccia, Alexandre Drouin and colleagues), the
  authorship spans the <a href="https://thealliance.ai/">AI Alliance</a> &mdash;
  <a href="/labs/ibm">IBM Research</a> (Leshem Choshen, Asaf Yehudai, Michal
  Shmueli-Scheuer, Elron Bandel), Mila / McGill (Siva Reddy, Xing Han Lù), CMU
  (Graham Neubig), UC Berkeley (Dawn Song), HKU (Tao Yu), and Ohio State (Yu Su),
  alongside startups Silverstream.ai and Jetty.</p>
