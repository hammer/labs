description: >
  <p>Anthropic's flagship Opus upgrade, just 41 days after
  <a href="/outputs/anthropic/claude-opus-4.7">Opus 4.7</a> — a "modest but
  tangible" improvement. AA Intelligence Index v4.1.1: <strong>57</strong>.
  Headline gains are in <strong>honesty</strong> (more likely to acknowledge
  when it lacks information, less likely to make unsupported claims) and
  <strong>code reliability</strong> (~4× less likely than 4.7 to let flaws in
  its generated code go unremarked). API name <code>claude-opus-4-8</code>.</p>

  <p>Shipped with a <strong>"dynamic workflow"</strong> capability (Claude
  orchestrating multiple subagents at once), a user-facing <strong>effort
  control</strong> (how much reasoning to spend per response), and a
  <strong>fast mode</strong> (~2.5× speed, ~3× cheaper). Available via
  claude.ai, Claude Code, the API, Amazon Bedrock, Google Cloud Vertex AI,
  and Microsoft Foundry.</p>
