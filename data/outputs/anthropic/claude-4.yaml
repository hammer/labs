description: >
  <p>Major generation leap with Opus and Sonnet variants. Claude 4 Sonnet introduced
  <strong>1M token context</strong>. Both models achieved record SWE-bench Verified
  scores: Opus 72.5%, Sonnet 72.7%. Architecture undisclosed.</p>

  <p>Claude 4 was widely regarded as the <strong>best coding model</strong> at launch,
  with particular strength in agentic tasks, extended reasoning, and instruction following.
  Launched alongside Claude Code GA and the Claude Agent SDK. AA Intelligence Index v4.3:
  <strong>21</strong> (Opus with extended thinking; 17 without), 19 (Sonnet with
  extended thinking; 17 without). The score here follows AA's extended-thinking
  Opus page since 2026-09-08; earlier readings in the score trail came from the
  non-reasoning Opus page. Proprietary.</p>
