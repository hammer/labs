description: >
  <p>The first <strong>publicly released model in Anthropic's Mythos class</strong>
  — a locked-down, broadly-available counterpart to the more capable, restricted
  <strong>Claude Mythos 5</strong> released alongside it. AA Intelligence Index
  v4.2: <strong>53</strong> — the <strong>#1 model on AA's index at its July 2026 release</strong>
  (62 on v4.1.1), still ahead of <a href="/outputs/anthropic/claude-opus-4.8">Opus 4.8</a> (46) and
  GPT-5.5 (46). State-of-the-art on nearly all tested capability benchmarks
  (software engineering, knowledge work, vision, scientific research), scoring
  10%+ above Opus 4.8 on some.</p>

  <p>Public release is gated by <strong>domain safeguards</strong>: on high-risk
  queries (e.g. cybersecurity, biology) it blocks and <strong>falls back to
  Opus 4.8</strong> for a safe answer. Priced at <strong>$10/M input,
  $50/M output</strong> (same as Mythos 5; less than half of the earlier Mythos
  Preview, but well above standard Opus). Notably, a US government export
  directive temporarily forced it offline within days of launch. API name
  <code>claude-fable-5</code>.</p>
