description: >
  <p>Anthropic's most capable model: the same underlying model as
  <a href="/outputs/anthropic/claude-fable-5.1">Claude Fable 5.1</a> (AA
  Intelligence Index v4.2 = 57, #1) with <strong>cybersecurity and biology
  safeguards relaxed for vetted professionals</strong> &mdash; Anthropic
  acknowledges it as the strongest cyber-capable model it has released.
  Where scored separately it leads Fable 5.1: <strong>60.9 on Terminal-Bench
  4.0</strong> versus Fable 5.1's 55.8. In Adaptyv Bio protein-design
  evaluations its binding affinities came in <strong>10&times; higher than
  the best prior competition submissions</strong>.</p>

  <p>Access runs through two verification programs &mdash; the
  <strong>Cyber Verification Program</strong> (vetted cyberdefenders) and the
  <strong>Life Sciences Verification Program</strong> (run in partnership
  with the US government) &mdash; currently limited to US organizations with
  international expansion planned. Not independently scored on Artificial
  Analysis (access is too restricted), so <code>intelligence_index</code> is
  left unset; capability is Fable 5.1 plus the unblocked domains. Anthropic
  assesses the release below the next RSP capability tier, with alignment
  improvements over <a href="/outputs/anthropic/claude-mythos-5">Mythos
  5</a>.</p>
