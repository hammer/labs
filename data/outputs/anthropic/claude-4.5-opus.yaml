description: >
  <p>First model to exceed <strong>80% on SWE-bench Verified</strong>. 200K token
  context. Also released as Claude 4.5 Sonnet (September 2025, 1M context, AA Intelligence Index v4.3: 21) and
  Claude 4.5 Haiku (October 2025, AA Intelligence Index v4.3: 18). Architecture undisclosed.</p>

  <p>AA Intelligence Index v4.3: <strong>29</strong> (extended thinking; 24 without). The
  score follows AA's extended-thinking page since 2026-09-08; earlier readings in the
  score trail came from the non-reasoning page. Claude 4.5 Opus was the highest-ranked
  non-reasoning model at the time of release, with particular strength in coding, writing,
  and multi-step agentic tasks. Proprietary.</p>
