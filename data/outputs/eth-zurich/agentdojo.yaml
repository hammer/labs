description: >
  <p>AgentDojo is the <strong>de-facto standard benchmark for prompt-injection and
  agent security</strong>: a dynamic environment of realistic tool-using tasks
  paired with adversarial injection attacks, measuring both utility and robustness.
  From Tramèr's SPY Lab; <strong>NeurIPS 2024 Datasets &amp; Benchmarks</strong> and
  a SafeBench first prize. Adopted into UK AISI's <code>inspect_evals</code>, used
  in US/UK AISI joint testing, and the substrate for Google's CaMeL defense.
  Co-authors later founded Invariant Labs (acquired by Snyk, 2025).</p>
