description: >
  <p>CaMeL ("Defeating Prompt Injections by Design") is a
  <strong>capability-based, system-level defense</strong> against prompt injection:
  it wraps the LLM in a protective layer that tracks data provenance and enforces
  explicit control- and data-flow policies, so untrusted content cannot trigger
  unauthorized actions. First approach to solve <strong>most of AgentDojo by
  construction</strong> rather than by patching the model.</p>

  <p><em>joint&rarr;Google DeepMind</em> (DeepMind-led, ETH first author); IEEE SaTML
  2026.</p>
