description: >
  <p>rsl_rl is a fast, GPU-native <strong>reinforcement-learning training
  library</strong> (PPO and friends) from Marco Hutter's Robotic Systems Lab. It is
  the <strong>default RL trainer of NVIDIA's Isaac Lab</strong> ecosystem, giving it
  massive downstream adoption across sim-to-real legged- and manipulation-robot
  research (~2.8K&#9733;). No single canonical paper &mdash; a GitHub-verified
  framework underpinning the group's ANYmal locomotion work.</p>
