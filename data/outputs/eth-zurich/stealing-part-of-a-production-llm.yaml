description: >
  <p>The first practical <strong>model-extraction attack against deployed
  black-box LLMs</strong>: by querying the production API, the authors recover the
  <strong>embedding-projection (final-layer) weights and hidden dimension</strong>
  of OpenAI and Google PaLM models for a few hundred to a few thousand dollars.
  A landmark security result &mdash; <strong>ICML 2024 Best Paper</strong>.</p>

  <p>From Florian Tramèr's SPY Lab (<em>joint&rarr;Google DeepMind</em>, with Carlini
  et al.; Tramèr and Paleka on the ETH side). Prompted API providers to change how
  logit/logprob endpoints are exposed.</p>
