description: >
  <p>Alibaba with Zhejiang University observes that production agent skills
  are <strong>directory bundles, not isolated prompts</strong>: the root
  loads at activation while references, schemas, scripts and nested subskills
  load only when an execution path needs them &mdash; so compressing the root
  alone misses most deployment cost, and flattening destroys the
  progressive-loading boundaries. <strong>SkillZip Pro</strong> is an
  evaluation-free compressor for whole bundles: it compresses
  <em>across files</em> (dropping content a root or declared environment
  contract already provides) while <strong>preserving routing</strong>, and
  emits an ordinary directory with the harness unchanged.</p>
