description: >
  <p>The second open-weight generation of Tongyi Lab's Wan video models,
  released on July 28, 2025 under <strong>Apache 2.0</strong> (about 19K GitHub
  stars). It brings a <strong>Mixture-of-Experts</strong> design into a video
  diffusion model, but not a token-routed one. The A14B models use two
  experts of about 14B each, split by denoising stage. A high-noise expert
  sets layout in the early steps, and a low-noise expert refines detail in
  the later ones. The switch happens at the step where the signal-to-noise
  ratio reaches half its minimum. That gives <strong>27B total and 14B active
  parameters per step</strong>, so inference compute and memory stay close to
  <a href="/outputs/alibaba/wan2.1">Wan2.1</a>'s 14B. In the team's
  validation-loss ablation, the full Wan2.2 MoE converged lower than Wan2.1
  and than hybrids that reuse Wan2.1 as either expert. Training data was also
  enlarged.</p>

  <p>A dense <strong>TI2V-5B</strong> model handles both text- and image-to-video
  in one checkpoint. It runs on the new Wan2.2-VAE, which compresses 4&times;16&times;16
  (64&times; overall, 4&times;32&times;32 with an extra patchify layer). It generates
  a 5-second 720p/24fps clip in under 9 minutes on one consumer GPU. Alibaba
  reports Wan2.2 ahead of leading closed commercial models on its new
  Wan-Bench 2.0. Later checkpoints in the 2.2 line were Wan2.2-S2V-14B for
  audio-driven video (2025-08-26) and Wan2.2-Animate-14B for character
  animation (2025-09-19), which was followed by
  <a href="/outputs/alibaba/wan-animate-2">Wan-Animate-2</a>. As of
  2026-11-19 the <code>Wan-AI</code> HuggingFace org holds no Wan 3.0
  weights, which leaves Wan2.2 as the latest open Wan base model.</p>
