description: >
  <p>DAMO Academy's embodied world models, released as a pair (both
  HF-trending at launch). <strong>RynnWorld-4D</strong> predicts future
  RGB, depth, and optical flow from a single RGB-D frame plus a language
  instruction, and demonstrates a 4D-conditioned manipulation policy on
  top. <strong>RynnWorld-Teleop</strong> is an action-conditioned world
  model for digital teleoperation &mdash; simulating robot responses to
  operator input without hardware in the loop. Part of DAMO's broader
  Rynn robotics line (RynnVLA, RynnEC).</p>
