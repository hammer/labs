description: >
  <p>Qwen's production speech-recognition system, documented in a 45-author
  technical report on 7 September 2026: a <strong>Mixture-of-Experts, LLM-based
  ASR model</strong> built on the Qwen backbone and trained on tens of millions
  of hours of speech, framed around the gap between benchmark accuracy and
  production utility. It transcribes 30 languages and 16 Chinese dialect
  varieties across eight dialect regions, and adds the production features the
  report singles out: industry-domain entity recognition, hierarchical hotword
  customisation, single-pass transcription polishing, and long-audio contextual
  modelling. A dedicated <strong>Qwen-Audio-3.0-ASR-Streaming</strong> variant
  targets latency-sensitive use. The report claims state-of-the-art or highly
  competitive results on Chinese, English, multilingual, and industrial test
  sets against leading commercial systems. It is the served successor to the
  small open <a href="/outputs/alibaba/qwen3-asr">Qwen3-ASR</a> models; no
  weights are released with the report.</p>

  <p><strong>Qwen-Audio-3.1-ASR</strong> followed on 20 October 2026 with its
  own technical report from Alibaba Token Foundry. It extends the line from
  transcription to <strong>speaker-diarized ASR</strong>, which outputs
  speaker labels and timestamps and handles overlapping speech, and to
  <strong>general audio understanding</strong>: speech, sound and music
  captioning, temporal grounding, sound-event detection and audio QA. It keeps
  the 30 languages and 16 Chinese dialects. The report confirms the
  architecture. The decoder is initialised from the language-model component
  of a Qwen <strong>MoE</strong> backbone and aligned on about <strong>20
  million hours</strong> of multilingual audio with a frozen BEST-RQ-pretrained
  encoder. It then goes through cooldown, SFT, GRPO-based RL on an in-house
  asynchronous FunVerl framework (vLLM rollouts, Megatron trainer) and
  on-policy distillation. Neither the backbone size nor the parameter count
  is given. The family ships as five served variants: Flash-Filetrans, Flash-Streaming,
  Flash-Message, Flash and Next. Only the non-streaming Flash and Next do
  diarization, and only Next does audio understanding. On the report's own
  API-based comparison, Next scores <strong>81.6 on MMAU</strong> against
  Gemini-3.1-Pro's 80.9 and 82.2 on MMSU against Gemini's 85.3, and it leads
  on seven of nine audio-understanding benchmarks. Like 3.0, it is
  hosted only.</p>
