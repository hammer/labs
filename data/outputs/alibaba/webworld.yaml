description: >
  <p>Open <strong>web world model</strong> for training and evaluating browser
  agents: predicts next-page state given the current state and a candidate
  action. Three sizes (8B / 14B / 32B) fine-tuned on Qwen3 bases over
  <strong>1M+ real-world web interaction trajectories</strong>, supporting
  five state representations (A11y Tree, HTML, XML, Markdown, natural
  language). Supports long-horizon (30+ step) trajectory simulation with
  CoT-activated transition prediction.</p>

  <p>Intrinsic (WebWorld-Bench): Factuality 71.0, Web Turing 45.6. When used
  for agent training, downstream gains: <strong>+9.9% on MiniWob++</strong>,
  <strong>+10.9% on WebArena</strong>. Cross-domain generalization to GUI
  desktop (+0.383), code (+0.249), and game environments (+0.220) &mdash; the
  world model abstraction transfers beyond browser tasks. Apache 2.0.</p>

  <p>Model weights re-released on HuggingFace May 8, 2026.</p>
