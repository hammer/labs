description: >
  <p>Qwen Team with MBZUAI (and KAUST): a systematic study of structured
  pruning and knowledge distillation for MoE models at pretraining scale.
  Findings: pruning a pretrained MoE beats training the target architecture
  from scratch at matched token budgets across depth, width, and expert
  compression; one-shot expert-compression methods converge to similar
  performance after large-scale continual pretraining (motivating a
  partial-preservation expert-merging strategy); KD combined with the LM
  loss beats KD alone, with a new multi-token-prediction distillation
  objective adding consistent gains; and progressive pruning schedules
  outperform one-shot compression. Demonstrated by compressing
  Qwen3-Next-80B-A3B to a competitive 23B-A2B model. Paper-only release.</p>
