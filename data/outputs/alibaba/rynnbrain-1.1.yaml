description: >
  <p>DAMO Academy and Hupan Lab's embodied foundation-model family adds native
  3D grounding, contact-point prediction, and an action model spanning Unitree
  G1, Astribot-S1, and Tianji-Wuji robots. The 122B-A10B model leads the paper's
  evaluated proprietary and open models on VSI-Bench, MMSI, and RefSpatial-Bench;
  smaller 2B and 9B checkpoints are also released.</p>
