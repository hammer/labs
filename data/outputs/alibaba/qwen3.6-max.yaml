description: >
  <p>Top proprietary tier of the Qwen3.6 generation and the <strong>first
  fully closed-weights Qwen Max flagship</strong> &mdash; released only as a
  Preview ("smarter, sharper, still evolving"); no GA Qwen3.6-Max ever
  shipped. <strong>256K context</strong>, text-only, with a
  <code>preserve_thinking</code> mode recommended for agentic work and an API
  compatible with both OpenAI and Anthropic specs. $1.30/$7.80 per M tokens
  (90% cache-hit discount).</p>

  <p>Alibaba claimed <strong>#1 on six coding/agentic benchmarks</strong>
  (SWE-bench Pro, Terminal-Bench 2.0, SkillsBench, QwenClawBench,
  QwenWebBench, SciCode), with gains over <a
  href="/outputs/alibaba/qwen3.6-plus">Qwen3.6-Plus</a> of +9.9 SkillsBench
  and +10.8 SciCode. AA Intelligence Index v4.2: <strong>33</strong>.
  Parameters undisclosed (press reports of "35B-A3B" conflate it with the
  open Qwen3.6-35B-A3B). Deprecated a month later in favor of <a
  href="/outputs/alibaba/qwen3.7">Qwen3.7-Max</a> (API live May 19, 2026).</p>
