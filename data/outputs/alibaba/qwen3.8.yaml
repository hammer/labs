description: >
  <p>Alibaba's first open-weight <strong>Qwen-Max-class</strong> release and its
  largest public model: a 2.4T-parameter MoE with 95B active per token. Its
  92-layer hybrid stack interleaves three Gated DeltaNet linear-attention blocks
  with one gated-attention block; 10 of 512 routed experts plus one shared expert
  are active. Native context is 262K and can extend to 1.01M tokens.</p>
  <p>Built for coding, professional work, research, and long-horizon agents, with
  controllable reasoning effort and preserved multi-turn thinking. The weights
  use the custom Qwen3.8-Max license: modification and redistribution are allowed,
  but large consumer products must display attribution and qualifying MaaS/work-
  assistant businesses must obtain a separate commercial license.</p>
tags: [frontier, moe, open-weight, reasoning, agentic, coding]
