name: Qwen-Image
slug: qwen-image
lab: alibaba
date: 2025-08-01
sources:
  - label: Qwen-Image-3.0 blog
    url: https://qwen.ai/blog?id=qwen-image-3.0
  - label: GitHub
    url: https://github.com/QwenLM/Qwen-Image
  - label: HuggingFace
    url: https://huggingface.co/Qwen/Qwen-Image
description: >
  Image generation model family. Qwen-Image (20B MMDiT) excels at text rendering
  in Chinese and English. Qwen-Image-2.0 (7B) unifies generation and editing.
  Qwen-Image-3.0 (July 2026) is hosted only, and the open-weight Qwen-Image-2.1
  (7B, September 2026) adds native transparency and multi-reference editing.
  In October 2026 Alibaba added an open 8-step Qwen-Image-2.1-Turbo checkpoint
  and a hosted Qwen-Image-2.1-Pro, which went on Qwen Cloud on October 2 and
  has no weights.
tags:
  - generation
  - open-weight
outputs:
  - name: Qwen-Image
    type: model
    date: 2025-08-01
    sources:
      - label: GitHub
        url: https://github.com/QwenLM/Qwen-Image
      - label: HuggingFace
        url: https://huggingface.co/Qwen/Qwen-Image
    description: >
      20B-parameter image generation foundation model built on Multimodal Diffusion
      Transformer (MMDiT) architecture. Exceptional text rendering accuracy for
      complex logographic languages.
    model:
      open_weights: true
      parameters: 20B
  - name: Qwen-Image-2.0
    type: model
    date: 2026-02-10
    sources:
      - label: Blog Post
        url: https://qwen.ai/blog?id=65f766fc2dcba7905c1cb69cc4cab90e94126bf4
    description: >
      Next-gen 7B image model unifying text-to-image generation and image editing.
      Native 2K resolution. Scores 88.32 on DPG-Bench, outperforming FLUX.1 (12B).
    model:
      open_weights: true
      parameters: 7B
  - name: Qwen-Image-3.0
    type: model
    date: 2026-07-21
    sources:
      - label: Qwen blog
        url: https://qwen.ai/blog?id=qwen-image-3.0
    description: >
      Hosted image-generation and editing model supporting prompts up to 4,500
      tokens, native text rendering in 12 languages, and legible type down to
      roughly 10 pixels. Alibaba did not release weights or disclose scale.
    model:
      open_weights: false

  - name: Qwen-Image-2.1
    type: model
    date: 2026-09-20
    sources:
      - label: GitHub
        url: https://github.com/QwenLM/Qwen-Image-2.1
      - label: HuggingFace
        url: https://huggingface.co/Qwen/Qwen-Image-2.1
    description: >
      Open-weight unified text-to-image and image-editing model with 7B
      parameters in its visual generation component (32 single-stream DiT
      layers). It generates and edits transparent (RGBA) images, extracts
      subjects from photographs, takes up to 10 reference images, and accepts
      local edits marked by circles, painted annotations or separate masks.
      Native 2K output (2048&times;2048), day-0 Diffusers
      (QwenImage21Pipeline) support, Qwen Research License; about 2,700
      HuggingFace likes and 70,000 downloads in its first ten days.
    model:
      open_weights: true
      parameters: 7B
      license: Qwen Research License

  - name: Qwen-Image-2.1-Turbo
    type: model
    date: 2026-10-09
    sources:
      - label: HuggingFace
        url: https://huggingface.co/Qwen/Qwen-Image-2.1-Turbo
      - label: GitHub
        url: https://github.com/QwenLM/Qwen-Image-2.1
      - label: Qwen Cloud model changelog
        url: https://docs.qwencloud.com/changelog/models
    description: >
      Accelerated checkpoint of Qwen-Image-2.1 for text-to-image generation
      and editing in <strong>8 denoising steps</strong> instead of the base
      model's default 40, run with CFG=1. It keeps "the same 7B visual
      generation architecture" and loads in the same Diffusers
      QwenImage21Pipeline, and the checkpoint ships its own sampling
      schedule. Qwen does not say how the speed-up was obtained (distillation
      or otherwise) and publishes no quality comparison against the 40-step
      model. Released October 9, 2026 under the Qwen Research License, the
      same day the hosted Pro and Turbo APIs went live on Alibaba Cloud Model
      Studio. About 1,000 HuggingFace likes and 31,000 downloads in its
      first two weeks.
    model:
      open_weights: true
      license: Qwen Research License
