description: >
  <p>"Infinity-MM: Scaling Multimodal Performance with Large-Scale and
  High-Quality Instruction Data." Open multimodal instruction dataset with
  <strong>40M+ samples</strong> &mdash; 10M image descriptions plus 24.4M visual
  instruction examples. Introduces a synthetic-instruction generation pipeline
  built on a tagging system and open-source VLMs to enable continuous, large-scale
  expansion of high-quality data.</p>

  <p>Used to train <a href="/outputs/baai/aquila-vl">Aquila-VL-2B</a>, which
  reached SOTA among 2B-class VLMs on MMBench, RealWorldQA, and ScienceQA.
  Released CC-BY-SA-4.0.</p>
