description: >
  <p>First comprehensive safety benchmark for video LVLMs. <strong>2,264
  video-text pairs</strong> covering 13 unsafe categories and 48 fine-grained
  subcategories, each pairing a synthesized ~10s video with either a harmful or
  a benign query. Introduces <strong>RJScore (RiskJudgeScore)</strong>, an
  LLM-based metric that uses token-level logit distributions to capture judge
  confidence and align with human safety judgments.</p>

  <p>Joint work between <a href="/labs/baai">BAAI FlagEval</a> and Beijing
  University of Posts and Telecommunications. Accepted to NeurIPS 2025
  Datasets &amp; Benchmarks track.</p>
