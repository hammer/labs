model:
  architecture: dense
  # Derivative: supervised fine-tune of Qwen/Qwen3.8-27B (HF card base_model;
  # paper sec. 2.4; config.json Qwen3_5ForConditionalGeneration). No `parameters`.
  base_model: qwen3.8
  context_window: 262144
  license: Apache 2.0
  benchmark_scores:
    - benchmark: MLE-bench Lite
      score: "81.8"
      mode: Any Medal, mean of 3 seeds, with skills
    - benchmark: Frontier-CS (Agent Track, 188 tasks)
      score: "70.7"
    - benchmark: BrowseComp
      score: "84.0"
    - benchmark: HLE (text-only)
      score: "52.6"
    - benchmark: GAIA
      score: "92.2"
    - benchmark: DeepSearchQA
      score: "93.8"
      mode: F1
  variants:
    - name: AREX-2
      notes: "27B dense; supervised fine-tune of Qwen3.8-27B"
