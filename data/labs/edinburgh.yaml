description: >
  <p>Edinburgh's frontier-AI output centers on the <strong>ILCC /
  EdinburghNLP</strong> cluster in the School of Informatics. The flagship
  line is <strong><a href="/outputs/edinburgh/hplt">HPLT</a></strong> &mdash;
  the multi-national High Performance Language Technologies consortium
  (Edinburgh a key partner with Oslo, CUNI, Turku, and Helsinki) whose
  open multilingual pretraining corpora scaled from ~7.6T whitespace
  tokens across 193 languages (v2, ACL 2025) to <strong>~30T tokens
  across 198 languages</strong> (HPLT 3.0, CC0, distilled from 7.2PB of
  Internet Archive and Common Crawl). Edinburgh is also a partner
  (Lisbon/Unbabel-led) on <a
  href="/outputs/edinburgh/eurollm">EuroLLM</a>, the from-scratch
  open European LLM covering all 24 EU official languages.</p>

  <p>The second signature is <a href="/people/edoardo-m-ponti">Edoardo
  Ponti</a> and Piotr Nawrot's <strong>inference-efficiency
  program</strong>, run jointly with NVIDIA: <a
  href="/outputs/edinburgh/dmc">Dynamic Memory Compression</a> (ICML
  2024, up to ~4x LLM inference throughput via learned KV-cache
  compression), its DMS successor, and <a
  href="/outputs/edinburgh/sparse-frontier">The Sparse Frontier</a>, the
  largest empirical study of training-free sparse attention. Around it
  sit <a href="/people/mirella-lapata">Mirella Lapata</a>'s long-context
  summarization line (<a
  href="/outputs/edinburgh/moviesum">MovieSum</a>, discourse-driven
  planning) and Pasquale Minervini's group with <a
  href="/outputs/edinburgh/mmlongbench">MMLongBench</a> (NeurIPS 2025
  spotlight) and the <a href="/outputs/edinburgh/scope">SCOPE</a>
  self-play open-endedness work.</p>

  <p>Attribution discipline: the HPLT corpora are consortium artifacts
  and EuroLLM is Lisbon-led with Edinburgh as partner &mdash; Edinburgh
  is credited as a key contributor, not sole owner. The in-window
  picture is honest about gaps: multilingual data infrastructure, MT,
  and inference efficiency are strong; there is no in-window
  Edinburgh-owned scientific foundation model.</p>
