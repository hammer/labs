description: >
  <p>The University of Amsterdam's AI footprint runs through <a
  href="/people/max-welling">Max Welling</a>'s <strong>AMLab</strong>
  &mdash; a founding home of Bayesian and geometric deep learning, whose
  Clifford-equivariance line (Clifford Group Equivariant Networks &rarr;
  <a href="/outputs/uva/clifford-steerable">Clifford-Steerable CNNs</a>)
  and physical-systems transformers (<a
  href="/outputs/uva/erwin">Erwin</a>, ICML 2025) target PDE and
  molecular simulation at scale. Welling co-founded materials-discovery
  startup <strong>CuspAI</strong> in 2024 and is primarily engaged there;
  he retains his UvA chair, and CuspAI-branded output is tracked
  separately, not under UvA.</p>

  <p>The vision side is anchored by <a href="/people/cees-g-m-snoek">Cees
  Snoek</a>'s Video &amp; Image Sense Lab and HAVA-Lab (ELLIS Amsterdam),
  which shipped <a href="/outputs/uva/neobabel">NeoBabel</a> &mdash; an
  open multilingual text-to-image foundation model with a 124M-pair
  multilingual dataset &mdash; and <a
  href="/outputs/uva/tulip">TULIP</a>, the token-length-upgraded CLIP.
  <a href="/people/efstratios-gavves">Efstratios Gavves</a>' Physical AI
  program (QUVA/POP-AART) drives world models as learnable digital twins
  (<a href="/outputs/uva/drema">DreMa</a>, ICLR 2025) and physical-reasoning
  benchmarks, while <a href="/people/erik-j-bekkers">Erik Bekkers</a> is
  the geometric-DL hub: the PONITA weight-sharing framework underpins <a
  href="/outputs/uva/equivariant-neural-fields">Equivariant Neural
  Fields</a> and its seismic Eikonal follow-up.</p>

  <p><a href="/people/maarten-de-rijke">Maarten de Rijke</a>'s IRLab
  rounds out the picture with an ERC generative information-retrieval
  program and co-organization of the NIST <a
  href="/outputs/uva/trec-ikat">TREC iKAT</a> track for personalized
  conversational search. Legacy org repos (AMLab-Amsterdam,
  <a href="https://github.com/QUVA-Lab">QUVA-Lab</a>) are largely
  historical &mdash; active code now ships via personal repos
  (maxxxzdn/erwin, ivonajdenkoska/tulip, mmderakhshani/NeoBabel).</p>
