description: >
  <p><a href="https://en.wikipedia.org/wiki/SpaceX">SpaceX</a>, Elon Musk's
  space-launch company (founded 2002), became a major AI lab through its 2026
  acquisition of <strong>xAI</strong>. xAI &mdash; Musk's AI startup, founded in
  2023 by Musk and 11 researchers from DeepMind, OpenAI, Google, and Microsoft
  Research &mdash; was absorbed in an all-stock merger in
  <strong>February 2026</strong> that valued the combined company at
  <strong>~$1.25T</strong> (xAI itself marked at ~$250B); it is now SpaceX's
  wholly-owned <strong>AI division</strong> (Grok, X, and AI compute). On
  <strong>July 6, 2026</strong> the rebrand completed: the xAI name was retired
  and the AI business now ships as <strong>SpaceXAI</strong>, with a new logo
  folding the SpaceX swoosh-X into &ldquo;AI&rdquo;. On
  <strong>June 12, 2026, SpaceX went public on Nasdaq (ticker SPCX)</strong> in
  the largest IPO in history by capital raised (~$75B; priced at $135/share for
  an implied ~$1.77T valuation); the stock has since climbed to a market
  capitalization of <strong>~$2.05T</strong>. Elon Musk is CEO;
  <strong>Michael Nicolls</strong> (former SpaceX Starlink engineering VP) was
  named xAI president in April 2026.</p>

  <p>The <strong>Grok</strong> family progressed rapidly from Grok-1
  (314B MoE, <a href="https://github.com/xai-org/grok-1">open-sourced</a> with 51K
  stars) to <strong>Grok 4.3</strong> (April 2026; 1M-token context; Artificial
  Analysis Intelligence Index <strong>38</strong> &mdash; &ldquo;high&rdquo;
  variant, on AA's recalibrated v4.1).
  Grok-3 (February 2025) was trained on <strong>200K GPUs</strong> at the Colossus
  supercomputer; Grok-4 (July 2025) added native tool-calling and extended
  reasoning. In May 2026 the team shipped <strong>Grok Build</strong>, an agentic
  coding CLI (with a dedicated coding model), competing with Claude Code and
  Codex.</p>

  <p>The original <strong>Colossus</strong> supercomputer in Memphis, Tennessee
  houses ~230K GPUs (150K H100 + 50K H200 + 30K GB200, ~250MW), with a second
  site, <strong>Colossus 2</strong>, scaling toward a <strong>1M-GPU target</strong>
  (xAI claims gigawatt-scale power, though independent satellite analysis by Epoch
  AI suggests cooling capacity is closer to ~350MW). SpaceX increasingly <strong>monetizes Colossus capacity to
  third parties</strong>: reported multi-year compute agreements include Anthropic
  (~$1.25B/month), Google (~$920M/month), and, announced June 2026,
  <strong>Reflection AI</strong> &mdash; an open-model lab that will reportedly pay
  <strong>up to ~$6.3B through 2029</strong> for Nvidia GB300 capacity in Colossus
  2. The NAACP has sued SpaceX/xAI under the Clean Air Act over gas turbines in
  Southaven, Mississippi that power its Colossus expansion; in June 2026 the DOJ
  moved to intervene and dismiss the suit on national-security grounds.</p>

  <p>Days after the IPO, in <strong>June 2026 SpaceX agreed to acquire the AI
  coding company Cursor (Anysphere) for $60B</strong> in an all-stock deal &mdash;
  <strong>pending regulatory approval, with an expected Q3 2026 close</strong>
  &mdash; to be folded under the xAI division (Cursor was last independently valued
  at $29.3B in November 2025). The company has seen heavy attrition: all of xAI's
  original co-founders have now departed &mdash;
  <a href="https://scholar.google.com/citations?user=_N2COeAAAAAJ">Igor
  Babuschkin</a> (DeepMind AlphaStar) left in August 2025 to start Babuschkin
  Ventures, and
  <a href="https://scholar.google.com/citations?user=ymzxRhAAAAAJ">Jimmy Ba</a>
  (Adam optimizer, Layer Normalization co-author) in February 2026 &mdash; and
  since the SpaceX deal 50+ staff have left for rivals such as Meta and Thinking
  Machines Lab.</p>
