      <p>Corresponding author (songyang@kanzhun.com) of the Nanbeige4-3B
      technical report and an author on Nanbeige4.1, ToolMind, CoSineVerifier
      and Evo-Bench. At BOSS Zhipin since at least 2019, publishing
      person-job-fit and recruiting-recommendation research with Renmin
      University (Wayne Xin Zhao, Ji-Rong Wen) and Peking University. No
      public source names a lab head; he is the most likely lead on the
      author record.</p>
