description: >
  <p>UT Austin pairs world-class academic GPU capacity with strong
  method-level output. The Center for Generative AI (director Adam
  Klivans, alongside NSF's IFML) grew a Vista-hosted cluster past 1,000
  dedicated GPUs (5,000+ campus-wide once the Horizon system's 4,000+
  Blackwells land) &mdash; yet as of mid-2026 <strong>no named open
  foundation model has shipped</strong> from it; the entry tracks the
  infra story and revisits after Horizon goes live. The NSF-Simons
  CosmicAI institute ($20M, 2024) is a scientific-FM watch item.</p>

  <p>What has shipped is influential technique work: Qiang Liu originated
  rectified flow (the SD3/FLUX lineage; Boundary RF continues it in 2025);
  the VITA group's memory-efficient-training line runs GaLore &rarr;
  <a href="/outputs/ut-austin/q-galore">Q-GaLore</a> &rarr;
  <a href="/outputs/ut-austin/apollo-optimizer">APOLLO</a> (MLSys 2025
  Outstanding Paper Honorable Mention, with Meta); Yuke Zhu's Robot
  Perception &amp; Learning lab produced
  <a href="/outputs/ut-austin/libero">LIBERO</a> (the default VLA
  manipulation benchmark), <a href="/outputs/ut-austin/okami">OKAMI</a>,
  and <a href="/outputs/ut-austin/metamon">Metamon</a>; Durrett's group
  shipped the widely-adopted
  <a href="/outputs/ut-austin/minicheck">MiniCheck</a> fact-checker; and
  Harwath's speech group followed VoiceCraft with
  <a href="/outputs/ut-austin/voicestar">VoiceStar</a>.</p>

  <p>Industry gravity is unusually strong: Yuke Zhu co-leads NVIDIA GEAR
  (GR00T is NVIDIA-branded and excluded here), Peter Stone is Chief
  Scientist of Sony AI, Kr&auml;henb&uuml;hl is concurrently at Apple,
  Zhangyang Wang has been on leave at XTX Markets since May 2024 (his
  students continue at UT), and Greg Durrett and Eunsol Choi both moved
  to NYU.</p>
