description: >
  <p>The <strong>University of Hong Kong</strong> (est. 1911) hosts the
  densest cluster of frontier-AI groups of any Hong Kong university, all
  inside its CS department: the <strong>XLANG Lab</strong> (Tao Yu) &mdash;
  the academic center of gravity for computer-use agents &mdash; the
  <strong>HKU NLP Group</strong> (hkunlp, Lingpeng Kong), the
  <strong>Data Intelligence Lab</strong> (HKUDS, Chao Huang), MMLab@HKU
  (Ping Luo), and Xihui Liu's video-generation/world-model group. Work
  ships across several orgs: <code>xlang-ai</code>/<code>xlangai</code>,
  <code>hkunlp</code>, <code>HKUDS</code>, and <code>Dream-org</code>.</p>

  <p>Two lines define the lab. XLANG's
  <a href="/outputs/hku/osworld">OSWorld &rarr; OSWorld 2.0</a> is the
  de-facto industry benchmark for computer-use agents (cited in Anthropic
  and OpenAI computer-use announcements), extended by
  <a href="/outputs/hku/opencua">OpenCUA</a> (with Moonshot, NeurIPS 2025
  Spotlight) and <a href="/outputs/hku/spider-2">Spider 2.0</a> (ICLR 2025
  Oral). Kong's hkunlp runs the most credible academic diffusion-LLM
  program worldwide: the <strong>Dream</strong> family &mdash; the base
  <a href="/outputs/huawei/dream-7b">Dream 7B</a> is filed under Huawei as
  an HKU-led joint with Noah's Ark Lab, with the HKU-led
  <a href="/outputs/hku/dream-coder">Dream-Coder/DreamOn</a> line and the
  seeding <a href="/outputs/hku/diffullama">DiffuLLaMA</a> recipe here
  &mdash; plus the <a href="/outputs/hku/polaris">Polaris</a> RL recipe and
  the <a href="/outputs/hku/verl">veRL/HybridFlow</a> framework
  (22.5K&#9733;) co-developed with ByteDance Seed.</p>

  <p>HKUDS has the highest-adoption OSS portfolio of any HKU lab
  (<a href="/outputs/hku/lightrag">LightRAG</a> 37.8K&#9733;, RAG-Anything
  22.3K&#9733;, AutoAgent 9.5K&#9733;). Industry entanglement is heavy and
  needs per-artifact attribution: recurring ByteDance Seed, Moonshot, and
  Huawei Noah's Ark co-development, and Ping Luo is Deputy Director of the
  HKU&ndash;Shanghai AI Lab joint lab &mdash; much of his output ships
  under SAIL branding.</p>
