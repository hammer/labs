description: >
  <p>SJTU's most famous AI export now ships under someone else's flag:
  <a href="/people/pengfei-liu">Pengfei Liu</a>'s <strong>GAIR</strong> lab
  migrated to the Shanghai Innovation Institute, its GitHub org renamed
  "SII-GAIR", and its post-migration line &mdash; LIMO, OctoThinker, ToRL,
  ASI-ARCH, LIMI, the daVinci family &mdash; files under
  <a href="/labs/sii">SII</a>, deliberately excluded here. What this entry
  retains is the pre-SII GAIR record that shaped the reasoning-data era:
  the O1 Replication Journey, DeepResearcher, ProX, OlympicArena, and
  Anole.</p>

  <p>What remains under university branding is still first-rate.
  <a href="/people/kai-yu">Kai Yu</a>'s <strong>X-LANCE/SpeechLab</strong>
  ships <a href="/outputs/sjtu/f5-tts">F5-TTS</a> &mdash; one of the
  most-downloaded open TTS models anywhere &mdash; and the SLAM-LLM
  speech-LLM training stack; the <strong>IPADS</strong> systems group wrote
  PowerInfer, trained the SmallThinker on-device MoE family from scratch,
  and built SkVM (with the serving team spinning out as Tiiny-AI);
  <a href="/people/cewu-lu">Cewu Lu</a>'s <strong>MVIG</strong> lab anchors
  embodied AI (AlphaPose/GraspNet lineage, AirExo-2); and the
  <strong>APEX</strong> lab (<a href="/people/weinan-zhang">Weinan
  Zhang</a>, <a href="/people/yong-yu">Yong Yu</a>) drives the RL and
  LLM-agents line.</p>
