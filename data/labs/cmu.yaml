description: >
  <p>Carnegie Mellon's School of Computer Science &mdash; the Machine
  Learning Department (headed by Zico Kolter), the Language Technologies
  Institute, and the Robotics Institute, with the FLAME Center supplying
  dedicated foundation-model compute &mdash; is arguably the deepest
  academic bench in AI. Its architecture line is the field's main
  post-Transformer thread: Albert Gu's
  <a href="/outputs/cmu/mamba-2">Mamba-2</a> (with Princeton's Tri Dao)
  underpins today's hybrid SSM production models, and
  <a href="/outputs/cmu/h-net">H-Net</a> (2025) opens the tokenizer-free
  frontier.</p>

  <p>Neubig's LTI groups built the reference open coding-agent stack
  (<a href="/outputs/cmu/openhands">OpenHands</a>, 60K&#9733;, plus
  WebArena and TheAgentCompany agent evals); Watanabe's WAVLab pretrains
  the open Whisper-style <a href="/outputs/cmu/owsm">OWSM</a> speech FMs
  and the OWLS scaling suite; Tianqi Chen's Catalyst group ships
  deployment infrastructure adopted industry-wide (MLC-LLM, XGrammar in
  vLLM/SGLang/TensorRT-LLM); and Kolter's safety line spans GCG &mdash;
  the foundational jailbreak &mdash; to safety pretraining and
  antidistillation sampling.</p>

  <p>Industry pull is constant: Neubig co-founded All Hands AI
  (OpenHands Inc), Gu co-founded Cartesia, Chen went to NVIDIA via
  OctoAI, Kolter chairs OpenAI's safety committee, and Salakhutdinov
  round-tripped through Meta &mdash; the entry keeps university-shipped
  artifacts only.</p>
