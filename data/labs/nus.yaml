description: >
  <p>The <strong>National University of Singapore</strong> (est. 1905) is
  anchored in this index by <strong>ShowLab</strong>, Mike Zheng Shou's
  group and NUS's highest-output frontier-multimodal lab: the
  <a href="/outputs/nus/show-o">Show-o</a> /
  <a href="/outputs/nus/show-o2">Show-o2</a> native unified multimodal
  models (ICLR 2025 / NeurIPS 2025, with ByteDance), the
  <a href="/outputs/nus/showui">ShowUI</a> GUI-agent family (CVPR 2025,
  with Microsoft; extended by ShowUI-&pi; at CVPR 2026), the
  <a href="/outputs/nus/livecc">LiveCC</a> streaming video LLM, and the
  <a href="/outputs/nus/paper2video">Paper2Video</a> /
  Code2Video agentic video-generation frameworks.</p>

  <p>Tat-Seng Chua's <strong>NExT++</strong> lab drives the
  multimodal-generalist agenda &mdash;
  <a href="/outputs/nus/next-gpt">NExT-GPT</a> (the 2023 any-to-any
  multimodal LLM) and <a href="/outputs/nus/general-bench">General-Level
  &amp; General-Bench</a> (ICML 2025 Oral) &mdash; while Bryan Hooi's group
  spans LLM calibration and safety (ConfTuner, NeurIPS 2025), agent
  continual learning (Just-In-Time RL, ICML 2026 Spotlight), MLR-Bench,
  and the UniGraph/UniGraph2 graph foundation models.</p>

  <p>Attribution boundaries: <strong>SEA-LION</strong> belongs to AI
  Singapore, a national programme hosted at NUS rather than an NUS faculty
  lab (placement tracked separately); Yang You's Colossal-AI and Open-Sora
  ship under his company HPC-AI Tech, not NUS; and Sea AI Lab is Sea Ltd,
  unrelated to the university despite the name.</p>
