description: >
  <p>The <strong><a href="https://en.wikipedia.org/wiki/University_of_Toronto">University
  of Toronto</a></strong> (founded 1827) and the co-located
  <strong><a href="https://vectorinstitute.ai">Vector Institute</a></strong>
  (founded 2017) form Canada's densest deep-learning cluster. Vector was
  co-founded in 2017 by <a href="/people/geoffrey-hinton">Geoffrey Hinton</a>
  &mdash; University Professor Emeritus at Toronto, 2018 Turing Award laureate,
  and 2024 <strong>Nobel Prize in Physics</strong> winner &mdash; who remains
  the institute's chief scientific advisor. The same faculty publish under both
  the university and Vector labels, so the cluster is the community's own unit
  of attribution.</p>

  <p>Flagship lines: <a href="/people/bo-wang">Bo Wang</a>'s medical and omics
  foundation-model stack (<a href="/outputs/toronto/scgpt">scGPT</a>, the Nature
  Methods 2024 single-cell FM; <a href="/outputs/toronto/medsam2">MedSAM2</a>;
  <a href="/outputs/toronto/echojepa">EchoJEPA</a>;
  <a href="/outputs/toronto/orthrus">Orthrus</a>;
  <a href="/outputs/toronto/bioreason">BioReason</a>);
  <a href="/people/alan-aspuru-guzik">Alán Aspuru-Guzik</a>'s Matter Lab
  self-driving-labs and generative chemistry
  (<a href="/outputs/toronto/el-agente-q">El Agente Q</a>,
  <a href="/outputs/toronto/quetzal">Quetzal</a>); and
  <a href="/people/colin-raffel">Colin Raffel</a>'s open-data and
  model-merging agenda (<a href="/outputs/toronto/common-pile">The Common
  Pile</a>, the <a href="/outputs/toronto/model-merging-eval">model-merging
  benchmark</a>).</p>

  <p>Industry gravity runs two ways: <a href="/labs/cohere">Cohere</a> spun out
  of Toronto, and Vector co-founder <a href="/people/sanja-fidler">Sanja
  Fidler</a> splits her time between UofT and NVIDIA &mdash; her NVIDIA-branded
  research is tracked under <a href="/labs/nvidia">NVIDIA</a>, and this entry
  keeps university-shipped artifacts only.</p>
