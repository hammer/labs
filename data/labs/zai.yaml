  - name: Yujie Qian
    url: https://people.csail.mit.edu/yujieq/
    role: GLM (2022) co-author; now at Thinking Machines Lab
    formerly: MIT CSAIL (PhD 2023, advisor Regina Barzilay); Voyage AI (founding research scientist)
    description: >
      <p>Co-first-author of the GLM paper (ACL 2022) &mdash; the only author from
      outside the Tsinghua/Zhipu circle, then a PhD student at <strong>MIT
      CSAIL</strong> under Regina Barzilay (PhD 2023), where his thesis spanned
      NLP and molecular ML (MolScribe, RxnScribe). He was a founding research
      scientist at <strong>Voyage AI</strong> (embeddings/RAG, acquired by
      MongoDB) and is now a <strong>Member of Technical Staff at Thinking
      Machines Lab</strong>, Mira Murati's startup in San Francisco.</p>
