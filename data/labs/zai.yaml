    role: Tech Lead, AutoGLM (foundation agents)
    formerly: Tsinghua University (PhD candidate, KEG, advisor Jie Tang)
    description: >
      <p>Co-author of the GLM paper (ACL 2022) and a core
      <a href="/labs/zai">Z.ai</a> researcher, where he leads the
      <strong>AutoGLM</strong> foundation-agents line (AutoGLM 2.0, a universal
      mobile-phone agent, launched August 2025). Lead author of
      <strong>P-tuning</strong> / P-tuning v2, WebGLM, AgentBench, and AutoGLM,
      and a contributor across the GLM-130B / ChatGLM / GLM-4 series. Completing
      his Tsinghua PhD under <a href="/people/jie-tang">Jie Tang</a>.</p>
  - name: Jiezhong Qiu
    url: http://xptree.github.io/
    role: GLM (2022) co-author; now at Zhejiang Lab
    formerly: Tsinghua University (BS/PhD, KEG, advisor Jie Tang)
    description: >
      <p>Co-author of the GLM paper (ACL 2022). A Tsinghua KEG PhD known for
      network/graph representation learning (NetMF, NetSMF, GCC), he is now a
      Researcher at <strong>Zhejiang Lab</strong> (Hangzhou; Zhejiang
      University&ndash;Zhejiang Lab "Hundred Talents" program) working on
      <strong>AI for science</strong> &mdash; protein design and inverse folding
      (including work in <em>Nature Computational Science</em>, 2026). He also
      collaborates on <a href="/labs/moonshot-ai">Moonshot AI</a>'s Kimi models
      (MoBA, Kimi-VL, Kimi Linear).</p>
    urls:
