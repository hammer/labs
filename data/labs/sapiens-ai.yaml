    description: >
      <p>Also known as Tong Yang. Independently corroborated (from 2014-era
      press) as a former <strong>LinkedIn</strong> engineer and
      <strong>UC Berkeley</strong> alum who co-founded the ephemeral social app
      <strong>Sobrr</strong> (2014, ~$1M seed led by IDG). His Microsoft, HEC
      Paris, and NUS-PhD affiliations appear only in self-issued bios; no Google
      Scholar profile or publication record exists beyond the DSPO preprint.</p>
