description: >
  <p><strong>Sapiens AI</strong> (legal entity <em>Singapore Sapiens Technology
  Pte. Ltd.</em>, incorporated 2022 as "Kiwi Network Technology" and rebranded)
  is a Singapore consumer-AI startup led by founder <strong>Bruce Yang</strong>.
  It launched <a href="https://agnes-ai.com">Agnes AI</a> in April 2025 &mdash;
  an AI agent combining real-time web search with a personal memory engine
  &mdash; and runs a free omni-modal API gateway plus a consumer app suite
  (the Agnes app, Agnes Code, and the Pavo creative studio).</p>

  <p>Its model line is mostly <strong>closed</strong>: the Agnes text models run
  1.5 Flash &rarr; 2.0 Flash &rarr; 2.5 Flash &rarr; the flagship
  <a href="/outputs/sapiens-ai/agnes-2.5-pro">Agnes 2.5 Pro Alpha</a>, alongside
  closed image and video models. Artificial Analysis scores the Agnes 2.5 Pro Beta
  checkpoint <strong>35</strong> and <a href="/outputs/sapiens-ai/agnes-3.0-flash">Agnes 3.0
  Flash</a> <strong>36</strong> on Intelligence Index v4.3 (mid-pack, well below
  the 53 frontier). The genuinely open research is
  thin: one open-weight model,
  <a href="/outputs/sapiens-ai/agnes-seallm-8b">Agnes-SeaLLM-8B</a> (a
  Southeast-Asian fine-tune of Qwen3-8B, Apache-2.0), and one arXiv paper,
  <a href="/outputs/sapiens-ai/dspo">DSPO</a> (an RL method co-authored by the
  founder).</p>

  <p><em>Caveat on the company's own claims:</em> Agnes is heavily PR-driven, and
  several headline figures trace only to its own press releases. Independent
  reporting confirms only a March 2026 raise of "tens of millions" (amount,
  valuation, and investors undisclosed) and ~$20M ARR; the frequently-cited "&gt;$100M valuation," multi-million user
  counts, and "Singapore's answer to DeepSeek" / "top-10 lab" framing are
  self-reported and have escalated across releases. Primary sources also
  undercut the "built from scratch" positioning: Google's own case study says the
  consumer app relies on <strong>Gemini Flash</strong> for inference, and the
  open model's card lists <strong>Qwen3-8B-Base</strong> as its base. A real
  applied-AI product with a genuine mid-tier model &mdash; not a frontier lab.</p>
people:
