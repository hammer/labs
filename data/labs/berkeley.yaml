description: >
  <p>Berkeley's frontier-AI footprint runs through <strong>BAIR</strong>,
  Ion Stoica's <strong>Sky Computing Lab</strong> (with its NovaSky and
  Agentica teams), and Dawn Song's <strong>RDI</strong>. No other
  university has shipped more of the industry's shared plumbing: vLLM and
  SGLang began here, Chatbot Arena (with Stanford, as LMSYS) became the
  default human-preference eval before incorporating as LMArena, and the
  <a href="/outputs/berkeley/bfcl">Function-Calling Leaderboard</a> and
  <a href="/outputs/berkeley/livecodebench">LiveCodeBench</a> are cited in
  essentially every 2025-26 model card.</p>

  <p>The 2025-26 signature is <strong>open RL for reasoning and
  agents</strong>: Sky-T1-32B (o1-class for &lt;$450), the Agentica line
  (DeepScaleR &rarr; DeepCoder &rarr; DeepSWE, with Together AI), and the
  <a href="/outputs/berkeley/skyrl">SkyRL</a> library; Song's group
  counters with the sharpest agentic-safety evals (CyberGym, Agents'
  Last Exam). Levine and Abbeel's robotics groups (HIL-SERL, Octo,
  OpenVLA co-lead) anchor the embodied side.</p>

  <p>Attribution discipline matters most here: the university keeps
  original dated releases only &mdash; the living vLLM/SGLang projects,
  LMArena, Physical Intelligence, Nexusflow, and Anyscale/Databricks
  output belong to their companies.</p>
