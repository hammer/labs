description: >
  <p>The University of Maryland's foundation-model output is dominated by
  Tom Goldstein's group (tomg-group-umd), director of the UMD Center for
  Machine Learning: the depth-recurrent latent-reasoning model
  <a href="/outputs/tuebingen/huginn">Huginn-3.5B</a> (co-led with Jonas
  Geiping's ELLIS/MPI T&uuml;bingen group and LLNL &mdash; a genuinely
  multi-lab pretrain), the
  <a href="/outputs/umd/gemstones">Gemstones</a> suite of 4,000+ open
  checkpoints for multi-faceted scaling-law research, the
  <a href="/outputs/umd/dynaguard">DynaGuard</a> dynamic guardian models
  (with Capital One), the standard open LLM-text detector
  <a href="/outputs/umd/binoculars">Binoculars</a>, and the
  memorization-mitigating <a href="/outputs/umd/goldfish-loss">goldfish
  loss</a>.</p>

  <p>Beyond Goldstein: Furong Huang works on trustworthy agents and
  test-time alignment (<a href="/outputs/umd/genarm">GenARM</a>, ICLR
  2025); Soheil Feizi's line probes the robustness limits of AI-text
  detection and watermarking; Jordan Boyd-Graber's QA group seeded the
  benchmark-science critique of
  <a href="/outputs/umd/mcqa-evaluation">multiple-choice evaluation</a>
  (ACL 2025); and Schulhoff's UMD-led
  <a href="/outputs/umd/prompt-report">Prompt Report</a> became the
  standard practitioner taxonomy of prompting. Hal Daum&eacute; III
  directs the NSF TRAILS institute on trustworthy AI.</p>
