description: >
  <p><strong>Inria</strong> (France's National Institute for Research in
  Digital Science and Technology) is the anchor of French academic AI. It
  runs its research as <strong>joint project-teams embedded inside the
  universities</strong>, so a single Inria banner captures most of the
  cluster: <strong>SIERRA</strong> (with ENS Paris/PSL &mdash; Francis
  Bach, optimization/ML theory), <strong>ALMAnaCH</strong> (Beno&icirc;t
  Sagot &mdash; the CamemBERT/Gaperon LLM line), <strong>Soda</strong>
  (Ga&euml;l Varoquaux &mdash; scikit-learn stewardship + tabular FMs),
  <strong>WILLOW</strong> (vision/robotics with DI-ENS), and
  <strong>ARAMIS</strong> (neuroimaging, at the Paris Brain Institute).
  The pure ENS/PSL crown jewels &mdash; the LPENS physics-of-learning
  group and Gabriel Peyr&eacute;'s optimal-transport line &mdash; attach
  as the intertwined academic partner, formalized by the &euro;75M
  <strong>PR[AI]RIE-PSAI</strong> institute (CNRS + Inria + Pasteur + PSL
  + Paris Cit&eacute;, launched June 2025).</p>

  <p>Tracker-relevant output spans four axes at once: a top-tier theory
  result (the <a href="/outputs/inria/diffusion-memorization">NeurIPS
  2025 Best Paper</a> on why diffusion models don't memorize, from
  ENS-PSL's LPENS), a genuinely shipped open-model line
  (<a href="/outputs/inria/camembert-2">CamemBERT</a> &rarr;
  <a href="/outputs/inria/gaperon">Gaperon</a>), scientific tabular
  foundation models (<a href="/outputs/inria/tabicl">TabICL</a>, CARTE
  &mdash; the European counterweight to TabPFN), and the world's
  most-adopted ML library, <a href="/outputs/inria/scikit-learn">scikit-learn</a>
  (66K+&#9733;, now stewarded via the :probabl. spinout).</p>

  <p>The cluster is a heavy talent-donor &mdash; Meta FAIR Paris, Kyutai,
  Mistral, Hugging Face, Owkin, and Apple's Paris ML lab all draw from it,
  and Cordelia Schmid's headline vision work is Google-branded (excluded
  here). Lucie/Luciole (LINAGORA/OpenLLM-France) is a separate
  government-backed consortium, not Inria.</p>
