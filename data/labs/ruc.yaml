description: >
  <p>Renmin University's Gaoling School of Artificial Intelligence
  (GSAI, executive dean Ji-Rong Wen) is China's most focused academic
  LLM school &mdash; and one of very few university groups anywhere
  that pretrains from scratch: the 38-author
  <a href="/outputs/ruc/yulan">YuLan-Base-12B</a> (~1.7T tokens) and
  the data-efficient YuLan-Mini (2.42B / 1.08T tokens, fully open
  recipe with 24 intermediate checkpoints).</p>

  <p>Two engines drive the catalog. Wayne Xin Zhao's
  <strong>RUCAIBox</strong> wrote the earliest open o1/R1 reproduction
  reports (the <a href="/outputs/ruc/still">STILL</a> slow-thinking
  series), <a href="/outputs/ruc/r1-searcher">R1-Searcher</a>'s
  agentic-RAG RL, the OlymMATH olympiad benchmark, and maintains the
  field-defining <a href="/outputs/ruc/llmsurvey">LLMSurvey</a>
  (12.2K&#9733;, basis of the LLMBook). Zhicheng Dou's
  <strong>RUC-NLPIR</strong> owns the 2025&ndash;26 deep-search-agent
  wave &mdash; <a href="/outputs/ruc/search-o1">Search-o1</a> &rarr;
  <a href="/outputs/ruc/webthinker">WebThinker</a> &rarr; ARPO &rarr;
  DeepAgent/Arbor &mdash; plus the
  <a href="/outputs/ruc/flashrag">FlashRAG</a> standard RAG toolkit
  (3.5K&#9733;).</p>

  <p>The work ships under three GitHub orgs (RUCAIBox, RUC-GSAI for
  YuLan, RUC-NLPIR) with weights under HF orgs RUC-AIBOX and
  yulan-team. Industry entanglement is collaboration-shaped rather than
  spinout-shaped: ByteDance Seed (Pass@k Training), Kuaishou (ARPO),
  Baichuan/BAAI (Virgo, HierSearch), and BAAI/DataCanvas compute
  credits on STILL.</p>
