description: >
  <p><a href="https://en.wikipedia.org/wiki/Thinking_Machines_Lab">Thinking
  Machines Lab</a> was founded in February 2025 by <strong>Mira
  Murati</strong> (OpenAI's former CTO) with co-founders including
  <strong>John Schulman</strong> (co-creator of RLHF and PPO) and roughly
  two dozen OpenAI alumni. Its <a
  href="https://techcrunch.com/2025/07/15/mira-muratis-thinking-machines-lab-is-worth-12b-in-seed-round/">$2B
  seed round at a $12B valuation</a> (July 2025; NVIDIA, Accel, ServiceNow,
  Cisco, AMD, Jane Street) was the largest in history. A follow-on raise at
  $50&ndash;60B collapsed by January 2026 amid a wave of departures back to
  OpenAI &mdash; co-founders Barret Zoph and Luke Metz among them &mdash;
  after which PyTorch creator <strong>Soumith Chintala</strong> took over
  as CTO. The ~150-person lab retains multibillion-dollar compute
  commitments from NVIDIA and Google.</p>

  <p>The lab's thesis is <strong>open weights plus customization</strong>,
  against one-size-fits-all frontier APIs. Its first product,
  <strong><a href="https://thinkingmachines.ai/tinker/">Tinker</a></strong>
  (October 2025), is a managed fine-tuning API that exposes low-level
  training loops over open-weight models. The flagship
  <strong><a href="/outputs/thinking-machines/inkling">Inkling</a></strong>
  (July 15, 2026) is a from-scratch 975B-parameter (41B active) natively
  multimodal MoE pretrained on 45T tokens of text, images, audio, and
  video, released under Apache 2.0 &mdash; <a
  href="https://artificialanalysis.ai/articles/thinking-machines-has-released-inkling-the-new-leading-u-s-open-weights-model">the
  leading U.S. open-weights model on the AA Intelligence Index</a> at
  release, with a controllable thinking-effort dial that reaches peer
  scores at roughly a third of the tokens.</p>

  <p>Its <strong>Connectionism</strong> research blog punches above its
  weight: posts on <a
  href="https://thinkingmachines.ai/blog/">defeating nondeterminism in LLM
  inference, LoRA fine-tuning dynamics, on-policy distillation, and modular
  manifolds</a> have been unusually influential for a lab this young, and
  the accompanying batch-invariant-ops code drew 1K+ GitHub stars.</p>
