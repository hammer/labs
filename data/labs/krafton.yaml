description: >
  <p><a href="https://en.wikipedia.org/wiki/Krafton">KRAFTON</a> (KRX:
  259960) is the Korean game company behind <em>PUBG: Battlegrounds</em> and
  <em>inZOI</em>; <strong>KRAFTON AI</strong> is its fast-escalating research
  division &mdash; Deep Learning Division &rarr; AI Division, an AI Frontier
  Division added April 2026, and a dedicated AI Business Unit announced June
  2026, under CAIO <strong>Kangwook Lee</strong>. Research spans language
  models (pretraining through post-training), speech, multimodal, RL/game
  agents, and data-centric AI, with models shipping into PUBG's "Ally" AI
  teammate and inZOI's on-device co-playable characters.</p>

  <p>The open-research turn came in 2026: the <strong>Raon</strong> family
  (April 2026) &mdash; a 9B speech LM claiming #1 among sub-10B public
  speech models for English and Korean, Korea's first announced full-duplex
  speech model, a TTS trained exclusively on public data and released with
  its dataset, and a from-scratch 400M vision encoder &mdash; plus the
  <strong>Terminus-KIRA</strong> agent harness (~920&#9733;) and an
  MoE&rarr;dense conversion framework with KAIST. A member of Korea's
  sovereign-AI consortium: its July 2026 speech model builds on SK Telecom's
  <a href="/outputs/skt/ax-k2">A.X K2</a>.</p>
