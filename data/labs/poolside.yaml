description: >
  <p><a href="https://poolside.ai">Poolside</a> is a San Francisco- and
  Paris-based lab founded in early 2023 by <strong>Jason Warner</strong> (CEO,
  former CTO of <a href="https://github.com">GitHub</a>) and <strong>Eiso
  Kant</strong> (CTO). Unlike the general-purpose foundation-model labs in the
  index, Poolside is a <strong>pure-play agentic-coding lab</strong>: it trains
  models from scratch for software engineering and deploys them inside customer
  environments (largely Global 2000 enterprises and public-sector agencies),
  served through its own "pool" agent harness.</p>

  <p>Its <a href="/outputs/poolside/laguna-m1">Laguna</a> models are
  Mixture-of-Experts transformers trained entirely in-house on a proprietary
  "Titan" stack &mdash; <strong>&gt;30T tokens on up to 6,144 NVIDIA H200
  GPUs</strong>, with a "Model Factory" pipeline (the AutoMixer data-mixture
  optimizer, Muon optimization, and an asynchronous online-RL system using a
  CISPO objective on verifiable coding rewards). In June 2026 Poolside made
  <strong>open weights its default</strong>: both the 33B/3B
  <a href="/outputs/poolside/laguna-xs2">Laguna XS.2</a> (April 2026) and the
  225B/23B flagship <a href="/outputs/poolside/laguna-m1">Laguna M.1</a> are now
  released under <strong>Apache 2.0</strong> on Hugging Face, with base and
  post-trained checkpoints. A <strong>2.1</strong> refresh followed in July 2026
  &mdash; <a href="/outputs/poolside/laguna-xs2">XS 2.1</a> and a new mid-tier
  <a href="/outputs/poolside/laguna-s21">Laguna S 2.1</a> (118B/8B, 1M context)
  &mdash; relicensed to <strong>OpenMDW-1.1</strong>.</p>

  <p>The technical execution arrives against serious company-level headwinds. In
  early April 2026 Poolside's planned <strong>~$2B Series C at a ~$14B
  valuation</strong> &mdash; anchored by a reported up-to-$1B NVIDIA commitment
  &mdash; <a href="https://www.datacenterdynamics.com/en/news/poolside-seeks-partners-for-data-center-in-texas-after-coreweave-deal-falls-apart/">collapsed</a>
  after <a href="https://en.wikipedia.org/wiki/CoreWeave">CoreWeave</a> walked
  away from its 15-year anchor lease for <strong>Project Horizon</strong>, a
  planned 2&nbsp;GW Texas data center, when Poolside missed timelines on the
  first cluster. The Financial Times reported investor concerns that Poolside
  "could not credibly train models that compete with Anthropic, OpenAI, and
  Google DeepMind at the frontier." The last realized valuation is the
  <strong>$3B Series B (October 2024)</strong>.</p>

  <p><em>Note: as of July 2026, Poolside is not scored on the Artificial
  Analysis Intelligence Index. Benchmark numbers on these pages are
  self-reported from the Laguna technical reports, except where attributed to a
  third-party leaderboard (from Laguna S 2.1 onward, some scores come via
  Artificial Analysis and Scale AI).</em></p>
