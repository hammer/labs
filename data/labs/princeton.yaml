description: >
  <p>Princeton's AI research runs through the Department of Computer
  Science and the <strong>Princeton Language and Intelligence (PLI)</strong>
  institute, and its defining contribution of the window is the
  <strong>coding-agent evaluation stack</strong>: the Narasimhan/Yang/
  Jimenez/Press group's <a href="/outputs/princeton/swe-bench">SWE-bench</a>
  family (Verified, Multimodal, Multilingual) became the industry's
  standard frontier-model coding metric, and its
  <a href="/outputs/princeton/swe-agent">SWE-agent</a> agent-computer
  interface plus <a href="/outputs/princeton/swe-smith">SWE-smith</a>
  synthetic-task pipeline anchor the open coding-agent ecosystem.</p>

  <p>Beyond agents, Princeton runs several of the field's marquee lines:
  <a href="/people/tri-dao">Tri Dao</a>'s efficient-kernels agenda
  (<a href="/outputs/princeton/flashattention-3">FlashAttention-3</a>,
  Mamba-2 with CMU's <a href="/people/albert-gu">Albert Gu</a>, GTA/GLA
  attention); <a href="/people/danqi-chen">Danqi Chen</a>'s princeton-nlp
  post-training and long-context science (<a href="/outputs/princeton/simpo">SimPO</a>,
  <a href="/outputs/princeton/helmet">HELMET</a>, ProLong, RLMT);
  <a href="/people/chi-jin">Chi Jin</a>'s open theorem-proving SOTA
  (<a href="/outputs/princeton/goedel-prover">Goedel-Prover</a>); and
  <a href="/people/arvind-narayanan">Arvind Narayanan</a>'s agent-eval
  rigor agenda (<a href="/outputs/princeton/hal">HAL</a> and "AI Agents
  That Matter").</p>

  <p>Industry entanglement is heavy but the entry keeps only
  university-shipped artifacts: Tri Dao is concurrently Chief Scientist at
  Together AI (co-branded on most kernel work), Narasimhan led research at
  Sierra AI before returning full-time in 2025 (Sierra's &tau;-bench is
  excluded), and SWE-bench Verified was a joint release with OpenAI while
  the dataset lives under Princeton's SWE-bench org.</p>
