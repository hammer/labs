description: >
  <p>Peking University's foundation-model output runs on two engines.
  Yaodong Yang's <strong>PKU-Alignment</strong> (Institute for AI) is
  the most complete academic safety/alignment stack anywhere: the Safe
  RLHF &rarr; <a href="/outputs/peking/aligner">Aligner</a> (NeurIPS
  2024 Oral) &rarr;
  <a href="/outputs/peking/align-anything">Align-Anything</a> line, the
  PKU-SafeRLHF preference data much of the field trains cost models on,
  and the ACL 2025 Best Paper showing
  <a href="/outputs/peking/alignment-resistance">language models
  elastically resist alignment</a>.</p>

  <p>Li Yuan's <strong>PKU-YuanGroup</strong> (Shenzhen Graduate
  School; HF org LanguageBind) ships the open video/multimodal line:
  <a href="/outputs/peking/open-sora-plan">Open-Sora Plan</a> (12.2K&#9733;,
  the leading open Sora reproduction, with v1.5's 8B DiT pretrained
  entirely on Huawei Ascend), the foundational
  <a href="/outputs/peking/languagebind">LanguageBind/Video-LLaVA</a>
  lineage, and <a href="/outputs/peking/uniworld">UniWorld</a> unified
  understanding+generation. Supporting benches: Tong Yang's
  <strong>PKU-DS-LAB</strong> (FairyR1-32B branch-merge distillation,
  iFairy 2-bit complex-valued LLMs), Muhan Zhang's group
  (<a href="/outputs/peking/pissa">PiSSA</a>, shipped in HF PEFT, and
  <a href="/outputs/peking/transmla">TransMLA</a>), and Yisen Wang's
  PKU-ML (LongPPL).</p>

  <p>Carve-outs: BIGAI-branded work (the CraftJarvis/MineStudio
  Minecraft-agent lineage under Yitao Liang) is excluded from this
  entry, as is BeingBeyond-branded humanoid work (Being-0; Being-H0 is
  joint). Joint-lab channels run through PKU&ndash;PsiBot (Yaodong
  Yang), PKU&ndash;Rabbitpre (Open-Sora Plan), and Qihoo360 (TinyR1
  method paper).</p>
